<title>חיבור תורמים קבועים</title>
<style>

  :root[data-theme="dark"]{--ground:#17151F;--card:#221F2E;--ink:#ECE7DA;--muted:#A29CB4;--line:#332F42;--accent:#A79EEA;--accent-soft:#2A2740;--gold:#D8B25E;--gold-soft:#2C2740;--yes:#6FC79A;--yes-soft:#1E3329;--no:#E08a6f;--no-soft:#33231E;--shadow:0 8px 30px rgba(0,0,0,.35);}
  *{box-sizing:border-box} html,body{margin:0;overflow-x:hidden}
  body{font-family:-apple-system,"Segoe UI",system-ui,Arial,sans-serif;background:var(--ground);color:var(--ink);line-height:1.5;direction:rtl;padding:20px 14px 60px}
  .wrap{max-width:620px;margin:0 auto}
  header{text-align:center;margin-bottom:16px}
  h1{font-size:1.4rem;margin:.2em 0 .1em}
  .sub{color:var(--muted);font-size:.92rem;margin:0}
  .bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0 6px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s}
  .count{text-align:center;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px}
  .lead{color:var(--muted);font-size:.8rem;margin:0 0 4px;font-weight:600}
  .en{font-size:1.7rem;font-weight:800;margin:0;direction:ltr;text-align:right}
  .info{color:var(--gold);font-weight:700;margin:6px 0 16px;font-size:1rem}
  .q{font-weight:700;margin:2px 0 10px}
  .opts{display:flex;flex-direction:column;gap:9px}
  button{font-family:inherit;cursor:pointer;border:none}
  .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--yes-soft);border:1.5px solid transparent;color:var(--ink);border-radius:12px;padding:13px 15px;font-size:1.05rem;font-weight:700;text-align:start}
  .opt:hover{border-color:var(--yes)} .opt:active{transform:scale(.98)}
  .opt .r{display:flex;align-items:center;gap:8px}
  .opt .ph{font-size:.78rem;font-weight:600;color:var(--muted);direction:ltr}
  .pill{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px}
  .pill.ishz{background:var(--gold-soft);color:var(--gold)}.pill.k101{background:var(--accent-soft);color:var(--accent)}.pill.klali{background:var(--line);color:var(--muted)}
  .big{border-radius:12px;padding:13px 15px;font-size:1rem;font-weight:700;width:100%;border:1.5px solid transparent}
  .link{background:var(--accent-soft);color:var(--accent)}.link:hover{border-color:var(--accent)}
  .no{background:var(--no-soft);color:var(--no)}.no:hover{border-color:var(--no)}
  .panel{margin-top:4px;background:var(--ground);border:1px solid var(--line);border-radius:12px;padding:12px}
  input{width:100%;font-family:inherit;font-size:1rem;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .results{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
  .res{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.98rem;font-weight:600;text-align:start}
  .res:hover{border-color:var(--accent)} .res .ph{font-size:.78rem;color:var(--muted);direction:ltr}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .skip{background:none;color:var(--muted);font-size:.9rem;text-decoration:underline;padding:6px}
  .back{background:none;color:var(--accent);font-size:.9rem;font-weight:600;padding:6px}.back[disabled]{opacity:.3}
  .save-hint{text-align:center;color:var(--muted);font-size:.82rem;margin-top:18px}
  .save-hint button{background:none;color:var(--accent);text-decoration:underline;font-weight:600;font-size:.82rem}
  .done{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 20px;text-align:center}
  .cta{background:var(--accent);color:#fff;border-radius:13px;padding:15px;font-size:1.1rem;font-weight:800;width:100%;margin-top:8px}
  textarea{width:100%;height:140px;margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,monospace;font-size:.8rem;background:var(--ground);color:var(--ink)}
  .ok-toast{color:var(--yes);font-weight:700;margin-top:10px;min-height:1.2em}
</style>

const flow=PAYLOAD.unmatched, DONORS=PAYLOAD.donors;
const TIERS={'יששכר_זבולון':['יששכר־זבולון','ishz'],'קוויטל_101':['קוויטל 101','k101'],'קוויטל_כללי':['כללי','klali']};
const decisions={}; let idx=0;
const stage=document.getElementById('stage'),fill=document.getElementById('fill'),countEl=document.getElementById('count');
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pill(t){if(!TIERS[t])return '';const[l,c]=TIERS[t];return `<span class="pill ${c}">${l}</span>`;}
function set(it,choice){decisions[it.id]={en:it.english,choice};idx++;render();}
function render(){
  const done=Object.keys(decisions).length;
  fill.style.width=(100*done/flow.length)+'%';
  countEl.textContent=done+' מתוך '+flow.length+' טופלו';
  if(idx>=flow.length)return finish();
  const it=flow[idx];
  let opts=it.candidates.map((c,i)=>`<button class="opt" data-choice="${esc(c.name)}"><span>${esc(c.name)}</span><span class="r">${pill(c.tier)}<span class="ph">${esc(c.phone||'')}</span>✓</span></button>`).join('');
  stage.innerHTML=`<div class="card">
    <p class="lead">שם באנגלית מרשימת התרומות</p>
    <p class="en">${esc(it.english)}</p>
    <p class="info">$${esc(it.amount)} · ${it.type==='ישז'?'יששכר־זבולון':esc(it.type)}</p>
    <p class="q">${it.candidates.length?'מי מאלה זה?':'חפש את התורם:'}</p>
    <div class="opts">${opts}
      <button class="big link" id="bLink">חפש תורם אחר…</button>
      <button class="big no" id="bNo">לא ברשימה / דלג</button>
    </div>
    <div id="sub"></div>
    <div class="row"><button class="back" ${idx===0?'disabled':''} id="back">→ חזרה</button></div>
  </div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>set(it,b.dataset.choice));
  document.getElementById('bNo').onclick=()=>set(it,'__none__');
  const bk=document.getElementById('back');if(bk)bk.onclick=()=>{if(idx>0){idx--;render();}};
  document.getElementById('bLink').onclick=()=>{
    const sub=document.getElementById('sub');
    sub.innerHTML=`<div class="panel"><input id="q" placeholder="הקלד שם בעברית…" autocomplete="off"><div class="results" id="res"></div></div>`;
    const q=document.getElementById('q'),res=document.getElementById('res');q.focus();
    q.oninput=()=>{const v=q.value.trim();if(!v){res.innerHTML='';return;}
      const hits=DONORS.filter(x=>x.name.includes(v)).slice(0,12);
      res.innerHTML=hits.map((x,i)=>`<button class="res" data-i="${i}"><span>${esc(x.name)}</span><span class="ph">${esc(x.phone||'')}</span></button>`).join('')||'<div style="color:var(--muted);font-size:.85rem;padding:6px">אין תוצאה</div>';
      res.querySelectorAll('.res').forEach(b=>b.onclick=()=>set(it,hits[b.dataset.i].name));};
  };
}
function buildText(){
  let lines=['חיבור תורמים קבועים:'];
  flow.forEach(it=>{const d=decisions[it.id];if(!d)return;
    lines.push(`${it.id} | ${it.en} ⟵ ${d.choice==='__none__'?'לא נמצא':d.choice}`);});
  lines.push(`(סה"כ: ${Object.keys(decisions).length})`);
  return lines.join('\n');
}
function finish(){
  const linked=Object.values(decisions).filter(d=>d.choice!=='__none__').length;
  stage.innerHTML=`<div class="done"><h2>סיימת! 🎉</h2><p class="sub">שלח לי את התשובות — העתק והדבק בצ'אט.</p>
    <p style="margin:14px 0"><b>${linked}</b> חוברו · <b>${Object.keys(decisions).length-linked}</b> לא נמצאו</p>
    <button class="cta" id="copy">העתק את התשובות</button><div class="ok-toast" id="toast"></div>
    <textarea id="out" readonly></textarea></div>`;
  const out=document.getElementById('out');out.value=buildText();
  document.getElementById('copy').onclick=async()=>{out.select();try{await navigator.clipboard.writeText(out.value);}catch(e){try{document.execCommand('copy');}catch(_){}}

}
