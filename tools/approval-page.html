<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אישור התאמות קוויטל</title>
<style>
  :root{
    --ground:#FBF8F2; --card:#FFFFFF; --ink:#2A2740; --muted:#6E6A82;
    --line:#E7E0D2; --accent:#3B357A; --accent-soft:#EEEBFA;
    --gold:#9C7A2E; --gold-soft:#F5ECD6;
    --yes:#2F7A57; --yes-soft:#E4F1EA; --no:#A8492F; --no-soft:#F6E7E1;
    --shadow:0 6px 24px rgba(40,36,64,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#17151F; --card:#221F2E; --ink:#ECE7DA; --muted:#A29CB4;
      --line:#332F42; --accent:#A79EEA; --accent-soft:#2A2740;
      --gold:#D8B25E; --gold-soft:#2C2740;
      --yes:#6FC79A; --yes-soft:#1E3329; --no:#E08a6f; --no-soft:#33231E;
      --shadow:0 8px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --ground:#FBF8F2;--card:#FFFFFF;--ink:#2A2740;--muted:#6E6A82;--line:#E7E0D2;
    --accent:#3B357A;--accent-soft:#EEEBFA;--gold:#9C7A2E;--gold-soft:#F5ECD6;
    --yes:#2F7A57;--yes-soft:#E4F1EA;--no:#A8492F;--no-soft:#F6E7E1;--shadow:0 6px 24px rgba(40,36,64,.10);
  }
  :root[data-theme="dark"]{
    --ground:#17151F;--card:#221F2E;--ink:#ECE7DA;--muted:#A29CB4;--line:#332F42;
    --accent:#A79EEA;--accent-soft:#2A2740;--gold:#D8B25E;--gold-soft:#2C2740;
    --yes:#6FC79A;--yes-soft:#1E3329;--no:#E08a6f;--no-soft:#33231E;--shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
    background:var(--ground); color:var(--ink); line-height:1.6;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px; margin:0 auto}
  header{text-align:center; margin-bottom:18px}
  h1{font-size:1.5rem; margin:.2em 0 .1em; letter-spacing:.2px}
  .sub{color:var(--muted); font-size:.95rem; margin:0}
  .bar{height:9px; background:var(--line); border-radius:99px; overflow:hidden; margin:18px 0 6px}
  .bar > i{display:block; height:100%; width:0; background:var(--accent);
           border-radius:99px; transition:width .35s ease}
  .count{text-align:center; color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums; margin-bottom:14px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); padding:22px 20px; animation:pop .28s ease
  }
  @keyframes pop{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){.card{animation:none} .bar>i{transition:none}}
  .pill{display:inline-block; font-size:.78rem; font-weight:700; padding:4px 12px;
        border-radius:99px; margin-bottom:14px}
  .pill.ishz{background:var(--gold-soft); color:var(--gold)}
  .pill.k101{background:var(--accent-soft); color:var(--accent)}
  .pill.klali{background:var(--line); color:var(--muted)}
  .lead{color:var(--muted); font-size:.82rem; margin:0 0 4px; font-weight:600; letter-spacing:.3px}
  .kv{font-size:1.85rem; font-weight:800; margin:0 0 14px; line-height:1.25; text-wrap:balance}
  .prayer{background:var(--ground); border:1px dashed var(--line); border-radius:12px;
          padding:10px 13px; font-size:.9rem; color:var(--muted); margin-bottom:18px; max-height:120px; overflow:auto}
  .q{font-weight:700; font-size:1.02rem; margin:4px 0 12px}
  .opts{display:flex; flex-direction:column; gap:10px}
  button{font-family:inherit; cursor:pointer; border:none}
  .opt{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:var(--yes-soft); border:1.5px solid transparent; color:var(--ink);
    border-radius:13px; padding:14px 16px; font-size:1.05rem; font-weight:700; text-align:start;
    transition:transform .1s ease, border-color .15s ease
  }
  .opt:hover{border-color:var(--yes)}
  .opt:active{transform:scale(.98)}
  .opt .ph{font-size:.85rem; font-weight:600; color:var(--muted); direction:ltr; font-variant-numeric:tabular-nums}
  .opt .yes{color:var(--yes); font-size:1.3rem}
  .no{
    background:var(--no-soft); color:var(--no); border-radius:13px; padding:13px 16px;
    font-size:1rem; font-weight:700; width:100%; margin-top:2px; border:1.5px solid transparent;
    transition:border-color .15s ease
  }
  .no:hover{border-color:var(--no)}
  .row{display:flex; align-items:center; justify-content:space-between; margin-top:16px}
  .skip{background:none; color:var(--muted); font-size:.9rem; text-decoration:underline; padding:6px}
  .back{background:none; color:var(--accent); font-size:.9rem; font-weight:600; padding:6px}
  .back[disabled]{opacity:.3; cursor:default}
  .save-hint{text-align:center; color:var(--muted); font-size:.82rem; margin-top:20px}
  .save-hint button{background:none;color:var(--accent);text-decoration:underline;font-weight:600;font-size:.82rem}
  /* מסך סיום */
  .done{background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:26px 22px; text-align:center}
  .done h2{margin:.1em 0 .3em; font-size:1.5rem}
  .stats{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:16px 0}
  .stat{background:var(--ground); border:1px solid var(--line); border-radius:12px; padding:10px 16px; min-width:90px}
  .stat b{display:block; font-size:1.5rem; color:var(--accent); font-variant-numeric:tabular-nums}
  .stat span{font-size:.8rem; color:var(--muted)}
  .cta{background:var(--accent); color:#fff; border-radius:13px; padding:15px 20px; font-size:1.1rem; font-weight:800; width:100%; margin-top:8px}
  .cta:active{transform:scale(.99)}
  textarea{width:100%; height:140px; margin-top:14px; border:1px solid var(--line); border-radius:12px;
           padding:12px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.8rem; background:var(--ground); color:var(--ink); resize:vertical}
  .ok-toast{color:var(--yes); font-weight:700; margin-top:10px; min-height:1.2em}
  a.restart{display:inline-block;margin-top:16px;color:var(--muted);font-size:.85rem}
</style>

<div class="wrap">
  <header>
    <h1>אישור התאמות קוויטל</h1>
    <p class="sub">לכל שם — לחץ על איש הקשר הנכון, או "אף אחד". זהו.</p>
    <div class="bar"><i id="fill"></i></div>
    <div class="count" id="count"></div>
  </header>
  <div id="stage"></div>
  <p class="save-hint">אפשר לעצור באמצע —
    <button id="saveNow">שמור ושלח את מה שעשית עד עכשיו</button>
  </p>
</div>

      <p class="lead">רשום בקוויטל</p>
      <p class="kv">${esc(it.kvittel)}</p>
      ${it.prayer?`<div class="prayer"><b>שמות לתפילה:</b> ${esc(it.prayer)}</div>`:''}
      <p class="q">${it.candidates.length>1?'מי מאלה זה אותו אדם?':'האם זה אותו אדם?'}</p>
      <div class="opts">
        ${opts}
        <button class="no" data-choice="__new__">אף אחד מהם — זה אדם חדש</button>
      </div>
      <div class="row">
        <button class="back" ${idx===0?'disabled':''} id="back">→ חזרה</button>
        <button class="skip" id="skip">דלג בינתיים</button>
      </div>
    </div>`;
  stage.querySelectorAll('[data-choice]').forEach(b=>{
    b.onclick=()=>{ decisions[it.id]={kv:it.kvittel,choice:b.dataset.choice}; idx++; render(); };
  });
  document.getElementById('skip').onclick=()=>{ idx++; render(); };
  const bk=document.getElementById('back'); if(bk) bk.onclick=()=>{ if(idx>0){idx--; render();} };
}

function buildText(){
  let lines=['אישורי התאמות קוויטל:'];
  flow.forEach(it=>{
    const d=decisions[it.id];
    if(!d) return;
    const val = d.choice==='__new__' ? 'אדם חדש' : d.choice;
    lines.push(`${it.id} | ${it.kvittel} ⟵ ${val}`);
  });
  lines.push(`(סה"כ אושרו: ${Object.keys(decisions).length})`);
  return lines.join('\n');
}

function finish(){
  const matched=Object.values(decisions).filter(d=>d.choice!=='__new__').length;
  const asnew=Object.values(decisions).filter(d=>d.choice==='__new__').length;
  stage.innerHTML=`
    <div class="done">
      <h2>כל הכבוד, סיימת! 🎉</h2>
      <p class="sub">נשאר רק לשלוח לי את התשובות — לחיצה אחת, ואז הדבקה בצ'אט.</p>
      <div class="stats">
        <div class="stat"><b>${matched}</b><span>חוברו לאיש קשר</span></div>
        <div class="stat"><b>${asnew}</b><span>אנשים חדשים</span></div>
      </div>
      <button class="cta" id="copy">העתק את התשובות</button>
      <div class="ok-toast" id="toast"></div>
      <textarea id="out" readonly></textarea>
      <a class="restart" id="restart">חזרה לתחילת הרשימה</a>
    </div>`;
  const out=document.getElementById('out'); out.value=buildText();
  document.getElementById('copy').onclick=async()=>{
    out.select();
    try{ await navigator.clipboard.writeText(out.value); }
    catch(e){ try{document.execCommand('copy');}catch(_){} }
    document.getElementById('toast').textContent='הועתק! עכשיו הדבק לי בצ\'אט (Ctrl+V / הדבק).';
  };
  document.getElementById('restart').onclick=(e)=>{e.preventDefault(); idx=0; render();};
}

document.getElementById('saveNow').onclick=()=>{ idx=flow.length; render(); };
render();
</script>
