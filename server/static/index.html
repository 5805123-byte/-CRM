<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כולל חצות — מערכת תורמים</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#18163A">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="כולל חצות">
<style>
  :root{--ground:#FBF8F2;--card:#FFFFFF;--ink:#2A2740;--muted:#6E6A82;--line:#E7E0D2;--accent:#3B357A;--accent-soft:#EEEBFA;--gold:#9C7A2E;--gold-soft:#F5ECD6;--klali:#5A7A8C;--klali-soft:#E6EEF2;--yes:#2F7A57;--yes-soft:#E4F1EA;--no:#C43A2B;--no-soft:#F6E7E1;--shadow:0 6px 24px rgba(40,36,64,.10)}
  @media(prefers-color-scheme:dark){:root{--ground:#17151F;--card:#221F2E;--ink:#ECE7DA;--muted:#A29CB4;--line:#332F42;--accent:#A79EEA;--accent-soft:#2A2740;--gold:#D8B25E;--gold-soft:#2C2740;--klali:#8FB2C4;--klali-soft:#22303A;--yes:#6FC79A;--yes-soft:#1E3329;--no:#E86B5D;--no-soft:#33231E;--shadow:0 8px 30px rgba(0,0,0,.4)}}
  *{box-sizing:border-box}html,body{margin:0}
  .hidden{display:none!important}
  .btn.addbig{width:100%;font-size:1.15rem;font-weight:800;padding:15px;border-radius:14px;background:var(--yes);color:#fff;margin:6px 0 12px;box-shadow:var(--shadow)}
  .btn.addbig:hover{filter:brightness(1.05)}
  .rbtitle{font-weight:800;color:var(--muted);font-size:.9rem;margin:6px 2px 8px;text-align:center}
  .reconboxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 14px}
  .reconbox{display:block;text-decoration:none;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .reconbox.act{background:var(--yes);color:#fff;cursor:pointer}
  .reconbox.act:hover{filter:brightness(1.06)}
  .reconbox.empty{background:var(--ground);border:1px dashed var(--line);color:var(--muted);box-shadow:none;cursor:default}
  .reconbox .rb-t{font-size:1.08rem;font-weight:800}
  .reconbox .rb-s{font-size:.82rem;margin-top:3px;opacity:.95}
  .reconbox.act .rb-s b{font-size:1rem}
  body{font-family:-apple-system,"Segoe UI",system-ui,Arial,sans-serif;background:var(--ground);color:var(--ink);line-height:1.5}
  .app{max-width:820px;margin:0 auto;padding:0 14px 60px}
  header.top{background:var(--ground);padding:14px 0 8px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .brand h1{font-size:1.2rem;margin:0;font-weight:800}.brand .st{margin-inline-start:auto;font-size:.8rem;color:var(--muted)}
  .search{width:100%;font-size:1.05rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
  .tabs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .tab{flex:1 1 auto;background:var(--card);border:1px solid var(--line);font-family:inherit;font-size:1.02rem;font-weight:800;color:var(--muted);padding:13px 14px;border-radius:12px;cursor:pointer;min-width:110px;white-space:nowrap}
  .tab:hover{border-color:var(--accent)}
  .tab.on{background:var(--accent);color:#fff;border-color:transparent;box-shadow:var(--shadow)}
  .tab.danger{color:var(--no);border-color:var(--no-soft)}
  .tab.danger.on{background:var(--no);color:#fff;border-color:transparent}
  .misshead{color:var(--no);font-weight:800;font-size:.95rem;margin:12px 2px 2px}
  .notpassed{background:var(--no-soft);color:var(--no);border:1px solid var(--no);border-radius:10px;padding:8px 12px;font-weight:800;margin-bottom:8px}
  .debtbanner{background:var(--no-soft);color:var(--no);border:1px solid var(--no);border-radius:10px;padding:8px 12px;font-weight:800;margin-bottom:8px;font-size:.9rem}
  .missbox{background:#fdeee9;border:1px solid #f2b8a6;color:#a3341a;border-radius:8px;padding:8px 11px;margin:8px 2px;font-size:.85rem;font-weight:700}
  .kvintakebtn{width:100%;margin:4px 0 2px}
  .intcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;box-shadow:var(--shadow)}
  .intcard.given{opacity:.6}
  .inthd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
  .intmatch{font-size:.88rem;margin:4px 0}
  .intmatch .wholink{cursor:pointer;color:var(--accent);text-decoration:underline}
  .intnames{width:100%;margin:6px 0;padding:8px 10px;border:1px solid var(--gold);border-radius:8px;font-family:inherit;font-size:.95rem;box-sizing:border-box}
  .intq{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;box-sizing:border-box}
  .intbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .intraw{margin-top:6px}
  .givemeth{display:inline-block;background:var(--line);color:var(--ink);border-radius:99px;padding:1px 8px;font-size:.74rem;font-weight:700;white-space:nowrap}
  /* לוח פרנס יום */
  .ktoggle{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
  .ktog{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-family:inherit;font-weight:700;font-size:.88rem;color:var(--muted);cursor:pointer;min-width:90px}
  .ktog.on{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
  .hmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .hmbtn{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 8px;font-family:inherit;font-size:1.1rem;font-weight:800;color:var(--ink);cursor:pointer}
  .hmbtn:hover{border-color:var(--gold)}
  .hmc{position:absolute;top:6px;left:6px;background:var(--gold);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 7px}
  .daygrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
  .daycell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;padding:2px}
  .daycell .dn{font-weight:800;font-size:1rem}
  .daycell .dplus{color:var(--muted);font-size:1.1rem}
  .daycell.full{background:var(--gold-soft);border-color:var(--gold)}
  .daycell.full .dnm{font-size:.62rem;color:var(--gold);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .daycell.sugg{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
  .daycell.sugg .dnm{font-size:.62rem;color:var(--accent);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* כמה תורמים לאותו לילה — כל השמות, שורה לכל אחד */
  .daycell .dnm{line-height:1.2}
  .daycell.multi .dnm{font-size:.55rem}
  .pyslot+.pyslot{border-top:3px double var(--line);margin-top:10px;padding-top:10px}
  .daycell.sel{outline:3px solid var(--accent)}
  .daycell.unpaid{border-color:var(--no);box-shadow:inset 0 0 0 2px var(--no)}
  .movebox{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.82rem;font-weight:700;color:var(--muted)}
  .movebox select{padding:6px 8px;border:1px solid var(--gold);border-radius:8px;font-family:inherit;background:var(--card);color:var(--ink);font-weight:700}
  .movebox button{margin-inline-start:auto}
  .daycell .unpaiddot{font-size:.5rem;line-height:1}
  .dlegend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:2px 2px 8px}
  .dlegend .lg{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-inline-end:4px;border:1px solid var(--line)}
  .dlegend .lg.full{background:var(--gold-soft);border-color:var(--gold)}
  .dlegend .lg.sugg{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
  .dlegend .lg.free{background:var(--card)}
  .dpres{display:flex;flex-direction:column;gap:4px;margin:6px 0}
  .dpr{background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:600}
  .dpr:hover{border-color:var(--accent)}
  .chosen{font-weight:800;color:var(--accent);margin:6px 0}
  /* אברכים */
  .avlist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .avrow{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px}
  .avtop{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:1.05rem}
  .avtop b{font-weight:800}.avsp{flex:1}
  .avps{display:flex;flex-direction:column;gap:8px}
  .avcount{background:var(--gold-soft);color:var(--gold);font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;margin-inline-start:8px}
  .avp{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--ground)}
  .avmain{display:flex;gap:6px;align-items:center}
  .avmain .avname{flex:1;font-weight:800;font-size:1.02rem}
  .avamt{display:flex;align-items:center;gap:1px;background:var(--yes-soft);border:1px solid var(--yes);border-radius:9px;padding:2px 7px}
  .avamt span{color:var(--yes);font-weight:800}
  .avamt input{width:64px;border:none;background:none;font-weight:800;color:var(--yes);text-align:center;padding:6px 2px}
  .avend{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 9px;font-family:inherit;font-weight:600;cursor:pointer;font-size:.76rem;white-space:nowrap;opacity:.75}
  .avend:hover{opacity:1;border-color:var(--accent);color:var(--accent)}
  .avsub{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.avsub input{font-size:.85rem;padding:7px 9px}
  .avfld{display:flex;flex-direction:column;gap:2px;flex:1;min-width:120px}
  .avfld>span{font-size:.68rem;color:var(--muted);font-weight:700}
  .avfld input,.avfld select{width:100%;box-sizing:border-box}
  .avfiles{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
  .fchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border-radius:8px;padding:4px 8px;font-size:.82rem;font-weight:600}
  .fchip a{color:var(--accent);text-decoration:none;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fchip .fdel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:0}
  .fchip .fdl{text-decoration:none;font-size:.9rem;padding:0 2px;line-height:1}
  .filebtn{background:var(--gold-soft);color:var(--gold);border:1px dashed var(--gold);border-radius:9px;padding:8px 12px;font-weight:700;font-size:.85rem;cursor:pointer}
  .fchip.audio{padding:3px 6px}
  .fchip.audio audio{height:34px;max-width:210px;vertical-align:middle}
  .fchip.img{padding:3px}
  .fchip.img img{display:block;width:64px;height:64px;object-fit:cover;border-radius:6px}
  .filebtn.sm{padding:4px 9px;font-size:.78rem;border-radius:8px}
  .dnfiles{margin:2px 0 8px;padding-top:5px;gap:5px}
  .dnfiles .fchip.img img{width:46px;height:46px}
  .dnfiles .fchip.audio audio{height:30px;max-width:180px}
  /* רשימת האברכים לפי שם משפחה — האברך, הזבולון, מתאריך, סכום, הערות */
  .avstat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;
    font-size:.9rem;margin-bottom:8px}
  .avstat .avfreen{color:var(--no)}
  .avnewbox{margin-bottom:8px}
  .avnewbox input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:9px;
    font-family:inherit;background:var(--card);color:var(--ink)}
  /* רשימת האברכים — טבלה צפופה, שורה לאברך, הכל נערך במקום */
  /* טבלה רחבה — נגללת לצדדים בתוך עצמה, כמו אקסל, בלי לדחוס את הטורים */
  .avwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .avinner{min-width:660px}
  .avghead,.avg{display:grid;grid-template-columns:26px minmax(140px,1.4fr) minmax(130px,1.3fr) minmax(112px,1fr) 62px minmax(120px,1.1fr) 76px;
    gap:5px;align-items:center}
  .avghead{position:sticky;top:0;z-index:3;background:var(--ground);border-bottom:1px solid var(--line);
    padding:5px 8px;color:var(--muted);font-size:.7rem;font-weight:800}
  .avtlist{background:var(--card)}
  .avtrow{border-bottom:1px solid var(--line)}
  .avtrow:last-child{border-bottom:none}
  .avtrow:nth-child(even){background:var(--ground)}
  .avtrow.isfree{background:var(--no-soft);box-shadow:inset 3px 0 0 var(--no)}
  .avg{padding:3px 7px;font-size:.83rem;min-height:32px}

  .avg+.avg{border-top:1px dashed var(--line)}
  .avnum{display:block;text-align:center;color:var(--muted);font-size:.7rem;font-weight:800}
  .avg input{width:100%;min-width:0;padding:4px 6px;border:1px solid transparent;border-radius:6px;
    font-family:inherit;font-size:.82rem;background:transparent;color:var(--ink)}
  .avg input:hover{border-color:var(--line)}
  .avg input:focus{border-color:var(--accent);background:var(--card);outline:none}
  .avg .avname{font-weight:800;color:var(--ink);cursor:pointer;text-decoration:underline;
    text-decoration-style:dotted;text-underline-offset:3px;display:block;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;padding:4px 6px}
  .avg .avname:hover{color:var(--accent)}
  .avg .avh_amt{font-weight:800;color:var(--yes);text-align:left}
  .avg .avnote{font-size:.76rem;color:var(--muted)}
  .avg .avhold{color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;
    display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .avg .avfree{color:var(--no);font-weight:800;font-size:.74rem;white-space:nowrap}
  .avg .g7{display:flex;gap:2px;justify-content:flex-end}
  .avg .ib{background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:.82rem;
    padding:2px 4px;line-height:1;color:var(--muted)}
  .avg .ib:hover{border-color:var(--line);background:var(--card)}
  .avg .ib.rd{color:var(--no)}
  .avswapbox,.avassignbox{padding:7px 9px;background:var(--card);border-top:1px dashed var(--line)}
  /* יומן האברך — כל שינוי, בתאריך עברי ולועזי */
  .avhistbox{padding:6px 9px;background:var(--ground);border-top:1px dashed var(--line);font-size:.78rem}
  .avhline{padding:4px 0;border-bottom:1px dotted var(--line);line-height:1.4}
  .avinfobox{padding:8px 9px;background:var(--card);border-top:1px dashed var(--line)}
  .avinfobox input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:.85rem;background:var(--ground);color:var(--ink)}
  .izhrow{padding:7px 10px;font-size:.85rem;line-height:1.45}
  .izhrow small{color:var(--muted)}
  .avhline:last-child{border-bottom:none}
  .avhline small{color:var(--muted)}
  .avswapbox .sw_q,.avassignbox .av_q{width:100%;padding:7px 9px;border:1px solid var(--accent);border-radius:8px;
    font-family:inherit;font-size:.85rem;background:var(--card);color:var(--ink)}
  .avbar{display:flex;align-items:center;gap:8px;margin:8px 0}
  .avtable{width:100%;border-collapse:collapse;background:var(--card);font-size:.9rem}
  .avtable th,.avtable td{border:1px solid var(--line);padding:8px 10px;text-align:start}
  .avtable th{background:var(--gold-soft);color:var(--gold);font-weight:800}
  .avtable tr:nth-child(even) td{background:var(--ground)}
  .avsort-th{cursor:pointer;user-select:none}
  .avsort-th:hover{background:var(--gold)}
  .avsort-th.on::after{content:' ⬇';font-size:.8em}
  .avtabtitle{margin:6px 0;font-size:1rem}
  .izshtar{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .izshtar-t{font-weight:800;color:var(--gold);font-size:.9rem;margin-bottom:6px}
  .izshtar textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-family:inherit;font-size:.9rem;resize:vertical}
  @media print{.avbar{display:none!important}.avtable{font-size:11pt}}
  /* גיליון להדפסה של רשימת האברכים */
  .prsub{color:var(--muted);font-size:.8rem;font-weight:600;margin-top:2px}
  .prtable{width:100%;border-collapse:collapse}
  .prtable th,.prtable td{border:1px solid var(--line);padding:5px 7px;text-align:right;font-size:.85rem}
  .prtable th{background:var(--ground);font-size:.78rem}
  .prtable tbody tr:nth-child(even){background:var(--ground)}
  .prtable tr.prfree td{background:var(--no-soft)}
  @media print{
    .prtable th,.prtable td{border:1px solid #999;padding:3px 5px;font-size:10pt}
    .prtable tbody tr:nth-child(even){background:#f3f3f3}
    .prtable tr.prfree td{background:#fbe4e0}
    .prtable{page-break-inside:auto} .prtable tr{page-break-inside:avoid}
    .prtable thead{display:table-header-group}
  }
  .avsearch{flex:1;min-width:120px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit;font-size:.9rem}
  .avsortsel{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit;font-size:.85rem;font-weight:600}
  .fixamt{display:inline-block;margin-inline-start:8px;background:#e8f5e9;color:#1b7a3d;border-radius:8px;padding:1px 8px;font-size:.78rem;font-weight:800;vertical-align:middle}
  .chbadge{display:inline-block;color:#fff;border-radius:7px;padding:2px 8px;font-size:.72rem;font-weight:800;white-space:nowrap}
  /* סיכום לפי ייעוד */
  /* מי מטפל במשימה — חיווי והחלפה מהירה מהשורה */
  .debtrow .miss{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:3px}
  .debtrow .dbw{font-weight:700}
  .debtrow .dbpaid{width:auto;flex:0 0 auto;padding:2px 9px;font-size:.72rem}
  .debtsum{color:var(--no);font-size:1.02rem;white-space:nowrap}
  .healthbtn{background:none;border:none;font-size:1.1rem;cursor:pointer;padding:2px 4px;width:auto;opacity:.75}
  .hrow{display:flex;gap:9px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line)}
  .hrow:last-child{border-bottom:none}
  .hrow .hi{flex:0 0 auto;font-size:1rem}
  .hrow .hn{flex:1;min-width:0}.hrow .hn b{display:block;font-size:.92rem}
  .hrow .hn small{color:var(--muted);word-break:break-word}
  .hrow.bad .hn b{color:var(--no)}.hrow.warn .hn b{color:var(--gold)}
  /* פנקס ההכתבה — כפתור צף שנמצא בכל מסך */
  .dictfab{position:fixed;left:14px;bottom:16px;width:54px;height:54px;border-radius:50%;
    border:none;background:var(--ink);color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:45;display:flex;align-items:center;justify-content:center;padding:0}
  .dictfab.rec{background:var(--no);animation:micpulse 1s infinite}
  .dictpad{width:100%;min-height:210px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;
    font-family:inherit;font-size:1.05rem;line-height:1.6;background:var(--card);color:var(--ink)}
  .dictbar{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .dictbar .btn{flex:1;min-width:104px;width:auto}
  .dictbig{width:100%;font-size:1.05rem;padding:14px;margin-top:10px}
  .dictbig.rec{background:var(--no)}
  .dicthist{margin-top:14px}
  .dicthist .dh{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    margin-bottom:6px;font-size:.87rem;display:flex;gap:7px;align-items:flex-start}

  .ctabs{display:flex;gap:5px;margin:6px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ctab{background:none;border:none;font-family:inherit;font-size:.92rem;font-weight:700;color:var(--muted);padding:8px 10px;border-radius:9px 9px 0 0;cursor:pointer;border-bottom:2px solid transparent}
  .ctab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
  .ctab .badge{background:var(--no);color:#fff;border-radius:99px;padding:0 6px;font-size:.72rem}
  .logrow{display:flex;gap:8px;align-items:flex-start;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:6px}
  .logrow .pi{flex:1;font-size:.9rem}.logrow .del{background:none;border:none;color:var(--muted);cursor:pointer}
  .logrow.outmail{border-right:3px solid var(--accent)}   /* מייל ששלחנו לתורם — נבדל מאחד שהתקבל */
  .logrow.taskdone{border-right:3px solid var(--yes);background:rgba(34,160,90,.06)}  /* משימה שסומנה כבוצעה */
  .logrow.taskdone .pi b{color:var(--yes)}
  /* התשובה שמאיר ענה — מוזחת מתחת לפנייה עצמה, כדי שיהיה ברור מה ממנו ומה ענינו */
  .thread{margin-bottom:6px}
  .thread .logrow{margin-bottom:4px}
  .logrow.replyrow{margin-right:22px;background:var(--accent-soft);border-color:var(--accent)}
  .logrow.replyrow .pi b{color:var(--accent)}
  /* משימות */
  .taskrow .tdone{background:var(--yes-soft);color:var(--yes);border:1px solid var(--yes);width:30px;height:30px;border-radius:50%;font-weight:800;cursor:pointer;flex-shrink:0}
  /* בתצוגת "בוצעו" הכפתור נושא טקסט מלא — עיגול עם חץ לבדו לא הובן */
  .taskrow .tdone.restore{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);
    width:auto;height:auto;border-radius:9px;padding:7px 10px;font-size:.8rem;white-space:nowrap;line-height:1.2}
  .taskrow.donerow{opacity:.72}
  .taskrow.donerow:hover{opacity:1}
  .taskrow .miss2{font-size:.85rem;color:var(--muted);margin-top:2px}
  .tdate{font-weight:800;font-size:.85rem;color:var(--accent);white-space:nowrap}
  .tdate.over{color:var(--no)}
  /* פס תזכורות מפריע */
  .rembanner{display:none;background:var(--no);color:#fff;padding:11px 16px;font-weight:800;text-align:center;cursor:pointer;position:sticky;top:0;z-index:60;box-shadow:0 3px 12px rgba(0,0,0,.25)}
  .rembanner.show{display:block}
  /* תזכורות בכרטיס */
  .remitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:6px}
  .remitem.over{border-color:var(--no);background:var(--no-soft)}
  .remitem .ri{flex:1;font-size:.9rem}.remitem .ri b{font-weight:800}
  /* שם התורם בתזכורת — לינק לכרטיס שלו */
  .remname{color:var(--accent);text-decoration:underline;cursor:pointer}
  .remitem.over .remname{color:var(--no)}
  .gcal{background:var(--klali-soft);color:var(--klali);text-decoration:none;border-radius:8px;padding:5px 9px;font-size:.78rem;font-weight:700;white-space:nowrap}
  .remset{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);margin-top:6px}
  .remset input{width:auto;padding:5px 8px}
  .icsbox{background:var(--accent-soft);border:1px solid var(--accent);border-radius:11px;padding:12px;margin:10px 0;font-size:.9rem;word-break:break-all}
  .icsbox b{color:var(--accent)}.icsbox .u{direction:ltr;display:block;background:var(--card);padding:8px;border-radius:8px;margin-top:6px;font-family:monospace;font-size:.8rem}
  .whobar{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 10px}
  .whochip{flex:1 1 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:9px 10px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;min-width:70px}
  .whochip.on{background:var(--accent);color:#fff;border-color:transparent}
  .whochip b{opacity:.7;font-size:.82rem}
  .twho{margin-top:5px;font-size:.78rem;padding:3px 7px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted);font-family:inherit}
  .tedit{background:var(--chip);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:.78rem;font-weight:700;padding:4px 9px;color:var(--accent);font-family:inherit}
  .teditpanel{background:var(--ground);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:-4px 2px 10px}
  .teditpanel.hidden{display:none}
  .teditpanel textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:.9rem;background:#fff;color:var(--ink)}
  .teditpanel .tdate2{flex:1;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;background:#fff;color:var(--ink)}
  .icsmini{margin:6px 2px;font-size:.82rem;color:var(--muted)}
  .icsmini summary{cursor:pointer;color:var(--accent);font-weight:700}
  .icsmini .u{direction:ltr;display:block;background:var(--card);border:1px solid var(--line);padding:7px;border-radius:8px;margin-top:6px;font-family:monospace;font-size:.78rem;word-break:break-all}
  @media print{header.top,.chips,.pbar,.kbar .print,.print,.back,.noprint{display:none!important}.app{max-width:none}.plaque{box-shadow:none}}
  /* הדפסת קוויטל נקייה — רק שם תורם ושמות התפילה, בלי תזכורת/כרטיס/אייקונים */
  @media print{
    #rembanner,.rembanner,.kbar,.opencard,.kvtag,.kvcopy,.loose,.hintxt{display:none!important}

  }
</style>
