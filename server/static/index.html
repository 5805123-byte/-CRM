<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כולל חצות — מערכת תורמים</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#18163A">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="כולל חצות">
<style>
  :root{--ground:#FBF8F2;--card:#FFFFFF;--ink:#2A2740;--muted:#6E6A82;--line:#E7E0D2;--accent:#3B357A;--accent-soft:#EEEBFA;--gold:#9C7A2E;--gold-soft:#F5ECD6;--klali:#5A7A8C;--klali-soft:#E6EEF2;--yes:#2F7A57;--yes-soft:#E4F1EA;--no:#C43A2B;--no-soft:#F6E7E1;--shadow:0 6px 24px rgba(40,36,64,.10)}
  @media(prefers-color-scheme:dark){:root{--ground:#17151F;--card:#221F2E;--ink:#ECE7DA;--muted:#A29CB4;--line:#332F42;--accent:#A79EEA;--accent-soft:#2A2740;--gold:#D8B25E;--gold-soft:#2C2740;--klali:#8FB2C4;--klali-soft:#22303A;--yes:#6FC79A;--yes-soft:#1E3329;--no:#E86B5D;--no-soft:#33231E;--shadow:0 8px 30px rgba(0,0,0,.4)}}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:-apple-system,"Segoe UI",system-ui,Arial,sans-serif;background:var(--ground);color:var(--ink);line-height:1.5}
  .app{max-width:820px;margin:0 auto;padding:0 14px 60px}
  header.top{background:var(--ground);padding:14px 0 8px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .brand h1{font-size:1.2rem;margin:0;font-weight:800}.brand .st{margin-inline-start:auto;font-size:.8rem;color:var(--muted)}
  .search{width:100%;font-size:1.05rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
  .tabs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .tab{flex:1 1 auto;background:var(--card);border:1px solid var(--line);font-family:inherit;font-size:1.02rem;font-weight:800;color:var(--muted);padding:13px 14px;border-radius:12px;cursor:pointer;min-width:110px;white-space:nowrap}
  .tab:hover{border-color:var(--accent)}
  .tab.on{background:var(--accent);color:#fff;border-color:transparent;box-shadow:var(--shadow)}
  .tab.danger{color:var(--no);border-color:var(--no-soft)}
  .tab.danger.on{background:var(--no);color:#fff;border-color:transparent}
  .misshead{color:var(--no);font-weight:800;font-size:.95rem;margin:12px 2px 2px}
  .notpassed{background:var(--no-soft);color:var(--no);border:1px solid var(--no);border-radius:10px;padding:8px 12px;font-weight:800;margin-bottom:8px}
  /* לוח פרנס יום */
  .ktoggle{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
  .ktog{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-family:inherit;font-weight:700;font-size:.88rem;color:var(--muted);cursor:pointer;min-width:90px}
  .ktog.on{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
  .hmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .hmbtn{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 8px;font-family:inherit;font-size:1.1rem;font-weight:800;color:var(--ink);cursor:pointer}
  .hmbtn:hover{border-color:var(--gold)}
  .hmc{position:absolute;top:6px;left:6px;background:var(--gold);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 7px}
  .daygrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
  .daycell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;padding:2px}
  .daycell .dn{font-weight:800;font-size:1rem}
  .daycell .dplus{color:var(--muted);font-size:1.1rem}
  .daycell.full{background:var(--gold-soft);border-color:var(--gold)}
  .daycell.full .dnm{font-size:.62rem;color:var(--gold);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .daycell.sugg{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
  .daycell.sugg .dnm{font-size:.62rem;color:var(--accent);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .daycell.sel{outline:3px solid var(--accent)}
  .dlegend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:2px 2px 8px}
  .dlegend .lg{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-inline-end:4px;border:1px solid var(--line)}
  .dlegend .lg.full{background:var(--gold-soft);border-color:var(--gold)}
  .dlegend .lg.sugg{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
  .dlegend .lg.free{background:var(--card)}
  .dpres{display:flex;flex-direction:column;gap:4px;margin:6px 0}
  .dpr{background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:600}
  .dpr:hover{border-color:var(--accent)}
  .chosen{font-weight:800;color:var(--accent);margin:6px 0}
  /* אברכים */
  .avlist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .avrow{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px}
  .avtop{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:1.05rem}
  .avtop b{font-weight:800}.avsp{flex:1}
  .avps{display:flex;flex-direction:column;gap:8px}
  .avcount{background:var(--gold-soft);color:var(--gold);font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;margin-inline-start:8px}
  .avp{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--ground)}
  .avmain{display:flex;gap:6px;align-items:center}
  .avmain .avname{flex:1;font-weight:800;font-size:1.02rem}
  .avamt{display:flex;align-items:center;gap:1px;background:var(--yes-soft);border:1px solid var(--yes);border-radius:9px;padding:2px 7px}
  .avamt span{color:var(--yes);font-weight:800}
  .avamt input{width:64px;border:none;background:none;font-weight:800;color:var(--yes);text-align:center;padding:6px 2px}
  .avend{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 9px;font-family:inherit;font-weight:600;cursor:pointer;font-size:.76rem;white-space:nowrap;opacity:.75}
  .avend:hover{opacity:1;border-color:var(--accent);color:var(--accent)}
  .avsub{display:flex;gap:6px;margin-top:6px}.avsub input{flex:1;font-size:.85rem;padding:7px 9px}
  .avfiles{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
  .fchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border-radius:8px;padding:4px 8px;font-size:.82rem;font-weight:600}
  .fchip a{color:var(--accent);text-decoration:none;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fchip .fdel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:0}
  .filebtn{background:var(--gold-soft);color:var(--gold);border:1px dashed var(--gold);border-radius:9px;padding:8px 12px;font-weight:700;font-size:.85rem;cursor:pointer}
  .avbar{display:flex;align-items:center;gap:8px;margin:8px 0}
  .avtable{width:100%;border-collapse:collapse;background:var(--card);font-size:.9rem}
  .avtable th,.avtable td{border:1px solid var(--line);padding:8px 10px;text-align:start}
  .avtable th{background:var(--gold-soft);color:var(--gold);font-weight:800}
  .avtable tr:nth-child(even) td{background:var(--ground)}
  @media print{.avbar{display:none!important}.avtable{font-size:11pt}}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:.83rem;font-weight:600;padding:6px 12px;border-radius:99px;cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:transparent}
  .cnt{color:var(--muted);font-size:.85rem;margin:10px 2px 0}
  .list{margin-top:10px;display:flex;flex-direction:column;gap:7px}
  .rowc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
  .rowc:hover{border-color:var(--accent)}
  .rowc .nm{font-weight:700;font-size:1.05rem}.rowc .nm small{font-weight:500;color:var(--muted)}
  .rowc .en{font-size:.8rem;color:var(--muted);margin-top:2px;text-align:start}
  .rowc .meta{margin-inline-start:auto;text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .rowc .ph{font-size:.8rem;color:var(--muted);direction:ltr}
  .pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .pill.reg{background:var(--yes-soft);color:var(--yes)}.pill.occ{background:var(--klali-soft);color:var(--klali)}
  .pill.ishz{background:var(--gold-soft);color:var(--gold)}.pill.k101{background:var(--accent-soft);color:var(--accent)}.pill.klali{background:var(--klali-soft);color:var(--klali)}.pill.py{background:var(--gold-soft);color:var(--gold)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .ov{position:fixed;inset:0;background:rgba(20,18,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .ov.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px 32px}
  @media(min-width:640px){.ov{align-items:center}.sheet{border-radius:20px}}
  .sheet .x{float:inline-start;background:var(--line);border:none;color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer}
  .sheet h2{margin:.1em 0 10px}
  label.fld{display:block;margin:10px 0}
  label.fld span{font-size:.8rem;color:var(--muted);display:block;margin-bottom:3px}
  input,select,textarea{width:100%;font-family:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--ground);color:var(--ink)}
  .sec{border-top:2px solid var(--accent-soft);margin-top:16px;padding-top:12px}
  .sec h3{margin:0 0 8px;font-size:1rem;color:var(--accent)}
  .onlinebox{background:linear-gradient(180deg,var(--accent-soft),transparent)}
  .obtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .obtns .btn{flex:1 1 auto}
  .btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
  .totals{display:flex;gap:8px;margin:4px 0 12px}
  .totals .tot{flex:1;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:11px 12px;text-align:center}
  .totals .tot span{display:block;font-size:.76rem;color:var(--muted);margin-bottom:3px}
  .totals .tot b{font-size:1.35rem;color:var(--accent);font-weight:800}
  .totals .tot.year{background:var(--gold-soft);border-color:var(--gold)}
  .totals .tot.year b{color:var(--gold)}
  .pledge{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;margin-bottom:6px;border:1px solid var(--line)}
  .pledge.given{background:var(--yes-soft);border-color:var(--yes)}
  .pledge.pending{background:var(--no-soft);border-color:var(--no)}
  .pledge .pi{flex:1}.pledge .pi b{font-size:1rem}.pledge .pi small{color:var(--muted)}
  .pledge .stbtn{border:none;border-radius:8px;padding:6px 10px;font-family:inherit;font-weight:700;cursor:pointer;font-size:.8rem}
  .pledge.given .stbtn{background:var(--yes);color:#fff}.pledge.pending .stbtn{background:var(--no);color:#fff}
  .pledge .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem}
  .addrow{display:flex;gap:6px;margin-top:8px}.addrow input,.addrow select{flex:1}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 14px;font-family:inherit;font-weight:700;cursor:pointer}
  .btn.sm{padding:8px 12px;font-size:.85rem}
  .saved{color:var(--yes);font-size:.8rem;font-weight:700;margin-inline-start:8px}
  .campc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
  .campc h3{margin:0 0 4px}.campbar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:8px 0;background:var(--no-soft)}
  .campbar i{display:block;height:100%;background:var(--yes)}
  .camprow{display:flex;justify-content:space-between;font-size:.85rem;padding:5px 0;border-top:1px solid var(--line)}
  .camprow.given{color:var(--yes)}.camprow.pending{color:var(--no)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .2s;z-index:99}
  .toast.show{opacity:1}
  /* מטרה (עבור מה) */
  .rowc .purp{font-size:.8rem;color:var(--gold);margin-top:3px;font-weight:600}
  .purpose{background:var(--gold-soft);color:var(--gold);border-radius:10px;padding:8px 12px;font-weight:700;margin:10px 0}
  /* שדות קריאה בכרטיס */
  .rf{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .rf .k{font-size:.8rem;color:var(--muted);min-width:96px}
  .rf .v{font-weight:600}
  .two{display:flex;gap:8px}.two label.fld{flex:1}
  .fld>span{font-size:.8rem;color:var(--muted);display:block;margin-bottom:3px}
  .phones{display:flex;flex-direction:column;gap:6px}
  .phrow{display:flex;gap:6px;align-items:center}
  .phrow .phin{flex:1;direction:ltr;text-align:left}
  .phrow .phdel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.05rem;padding:4px}
  .phadd{align-self:flex-start;margin-top:2px}
  .hintxt{color:var(--muted);font-size:.85rem;padding:4px 0}
  /* מפת חודשים */
  .mgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:6px}
  .mc{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700}
  .mc span{opacity:.85}
  .mc.gp{background:var(--yes);color:#fff}
  .mc.gx{background:var(--no);color:#fff}
  .mc.gn{background:var(--line);color:var(--muted)}
  /* שמות לתפילה בכרטיס */
  .pr{background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin-bottom:5px;font-weight:600;white-space:pre-line}
  /* קוויטל */
  .kbar{display:flex;align-items:center;gap:10px;margin:12px 2px}
  .kbar b{font-size:1.05rem}.cnt2{color:var(--muted);font-size:.85rem}
  .print,.back{margin-inline-start:auto;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-family:inherit;font-weight:700;cursor:pointer}
  .back{margin-inline-start:0;background:var(--line);color:var(--ink)}
  .kblock{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:7px}
  .kblock .who{font-size:.78rem;color:var(--muted);margin-bottom:3px}
  .kblock .loose{color:var(--no);font-weight:700}
  .kvmenu{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .kvbtn{text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;font-family:inherit;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}
  .kvbtn:hover{border-color:var(--accent)}
  .kvbtn b{display:block;font-size:1.28rem;font-weight:800;color:var(--accent);margin-bottom:3px}
  .kvbtn small{color:var(--muted);font-size:.95rem}
  .kvmonth{margin-top:14px}
  .kvmonth h3{color:var(--gold);border-bottom:2px solid var(--gold-soft);padding-bottom:5px;margin:0 0 8px}
  .kblock .names{font-weight:700;font-size:1.05rem;white-space:pre-line;border-radius:8px;padding:4px 6px;margin:-4px -6px}
  .kblock .names[contenteditable]:focus{outline:none;background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
  .prow{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
  .prow textarea{flex:1;resize:none;overflow:hidden;font-weight:600;line-height:1.6;font-size:1.02rem;min-height:2.6em}
  .prow .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:6px 2px}
  /* פרנס יום — רשימה */
  .pyc{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;cursor:pointer;align-items:center}
  .pyc:hover{border-color:var(--gold)}
  .pyc .pdate{background:var(--gold-soft);color:var(--gold);border-radius:9px;padding:8px 12px;font-weight:800;white-space:nowrap;min-width:70px;text-align:center}
  .pyc .pbody .nm{font-weight:700}
  .pyc .pbody .ded{font-size:.85rem;color:var(--muted);margin-top:2px}
  .pyc .printhint{font-size:.75rem;color:var(--accent);margin-top:3px}
  /* שלט פרנס יום */
  .pbar{display:flex;gap:8px;margin:12px 2px}
  .plaque{background:#fffdf6;color:#2a2412;border:3px double var(--gold);border-radius:14px;padding:30px 26px;text-align:center;box-shadow:var(--shadow);max-width:520px;margin:0 auto}
  .plaque .bsd{font-size:.8rem;color:var(--gold);margin-bottom:14px}
  .plaque .ptop{font-size:1rem;line-height:1.7;margin-bottom:16px}
  .plaque .pdate2{font-size:1.5rem;font-weight:800;color:var(--gold);margin:12px 0}
  .plaque .pyz{font-size:.95rem;margin-bottom:8px}
  .plaque .pded2{font-size:1.35rem;font-weight:800;line-height:1.7;margin:8px 0 18px;white-space:pre-line}
  .plaque .pfoot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--gold-soft);padding-top:12px}
  /* לא עבר */
  .rowc .miss{font-size:.82rem;color:var(--no);font-weight:700;margin-top:3px}
  /* קמפיין */
  .campc .csub{font-size:.82rem;color:var(--muted)}
  /* לשוניות בתוך כרטיס */
  .cardsub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .cardsub .ensm{color:var(--muted);font-size:.85rem}
  .ctabs{display:flex;gap:5px;margin:6px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ctab{background:none;border:none;font-family:inherit;font-size:.92rem;font-weight:700;color:var(--muted);padding:8px 10px;border-radius:9px 9px 0 0;cursor:pointer;border-bottom:2px solid transparent}
  .ctab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
  .ctab .badge{background:var(--no);color:#fff;border-radius:99px;padding:0 6px;font-size:.72rem}
  .logrow{display:flex;gap:8px;align-items:flex-start;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:6px}
  .logrow .pi{flex:1;font-size:.9rem}.logrow .del{background:none;border:none;color:var(--muted);cursor:pointer}
  /* משימות */
  .taskrow .tdone{background:var(--yes-soft);color:var(--yes);border:1px solid var(--yes);width:30px;height:30px;border-radius:50%;font-weight:800;cursor:pointer;flex-shrink:0}
  .taskrow .miss2{font-size:.85rem;color:var(--muted);margin-top:2px}
  .tdate{font-weight:800;font-size:.85rem;color:var(--accent)}
  .tdate.over{color:var(--no)}
  /* פס תזכורות מפריע */
  .rembanner{display:none;background:var(--no);color:#fff;padding:11px 16px;font-weight:800;text-align:center;cursor:pointer;position:sticky;top:0;z-index:60;box-shadow:0 3px 12px rgba(0,0,0,.25)}
  .rembanner.show{display:block}
  /* תזכורות בכרטיס */
  .remitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:6px}
  .remitem.over{border-color:var(--no);background:var(--no-soft)}
  .remitem .ri{flex:1;font-size:.9rem}.remitem .ri b{font-weight:800}
