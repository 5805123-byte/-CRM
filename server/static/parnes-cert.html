<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כולל חצות — תעודת פרנס</title>
<style>
  @font-face{font-family:'FrankRuhl';src:url('/frankruhl-regular.ttf') format('truetype');font-weight:400 600;font-display:swap}
  @font-face{font-family:'FrankRuhl';src:url('/frankruhl-bold.ttf') format('truetype');font-weight:700 900;font-display:swap}
  :root{--ink:#1c1710;--deep:#6a1414;--gold:#9c7a2e}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:#d9d2c2;color:var(--ink);font-family:'FrankRuhl',"Frank Ruhl Libre","Times New Roman",serif}
  .scroller{overflow-x:auto;padding:16px}
  .sheet{position:relative;width:794px;aspect-ratio:2482/3509;margin:0 auto;
    background:#fdf9ee top center/100% 100% no-repeat;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
    -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .content{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
  /* בתעודת הפרנס הנוסח נצמד לראש התיבה, שתמיד יישאר מקום להקדשות */
  .content.toptxt{justify-content:flex-start}
  #cbody{width:100%;display:flow-root}
  /* גדלים יחסיים ל-font-size של .content שנקבע אוטומטית למילוי הדף */
  /* מאיר: "יהי רצון עד אחרי יעמדו לזכות — 40, התאריך 50, השמות 70,
     והבקשות של אחר כך 40 שוב". הגדלים נקבעים ב-fit() לפי רוחב הדף. */
  .nusach{line-height:1.45;font-weight:600;width:100%}
  .date{font-weight:800;color:var(--deep);margin:.35em 0 .25em;width:100%}
  .stand{font-weight:600;margin-bottom:.12em;width:100%}
  .stand.off{display:none}
  .pair{width:100%;margin:.15em 0 .35em;position:relative}
  .names{font-weight:800;line-height:1.14;color:#000;width:100%;white-space:pre-line}
  .req{line-height:1.4;font-weight:600;width:100%;margin-top:.05em}
  /* בתוך השמות: הבקשה והפתיח 40 מתוך 70 */
  .names .nreq,.names .nlead{font-size:.571em}
  /* כל השם באותו גודל; רק בן/בת/ז"ל/ע"ה מוקטנים */
  .names .nsm,.cnames .nsm{font-size:.42em;font-weight:600}
  /* שם התורם — קטן מהשמות שמתפללים עליהם */
  /* שורת התורם היא block — אחרת אין לה רוחב אמיתי, וההקטנה שמכניסה שם
     ארוך לשורה אחת לא מצליחה לחשב והשם נחתך בקצה */
  .names .ndon,.cnames .ndon{font-size:.85em;font-weight:700;display:block;margin-bottom:.12em}
  /* "ע\"י", "הר\"ר", "שיחי'" — מילות לוואי, קטנות בבירור מול שם התורם */
  .names .ndon .nsm,.cnames .ndon .nsm,.names .ndon .nreq,.cnames .ndon .nreq{font-size:.5em}
  /* הבקשה — קטנה יותר מהשם, כדי שהשמות יבלטו הכי חזק */
  .names .nreq,.cnames .nreq{font-size:.25em;font-weight:700;letter-spacing:-.01em;word-spacing:-.04em}
  /* "לעילוי נשמת" — חצי מהשם, ומתכווץ יחד איתו כשהוא מוקטן כדי להיכנס */
  .names .nlead,.cnames .nlead{font-size:.5em;font-weight:700;letter-spacing:-.01em;word-spacing:-.04em}
  /* שם שלם בשורה אחת — אם הוא ארוך מדי הוא מוקטן ולא נשבר באמצע */
  .nline{display:block;white-space:nowrap}
  .nrow{display:block}
  /* חדר קפה */
  .cdate{font-size:1.05em;font-weight:700;color:var(--deep);width:100%;margin-bottom:.35em}
  .ctitle{font-size:2.15em;font-weight:800;color:var(--deep);width:100%;margin:.06em 0 .18em}
  .cdedic{font-size:1.18em;font-weight:800;color:var(--deep);width:100%;margin-bottom:.28em;letter-spacing:.005em}
  .cnames{font-size:2.5em;font-weight:800;line-height:1.18;color:#000;width:100%;margin:.1em 0 .25em;white-space:pre-line}
  /* כללי התעודה מרוכזים ב-app.py (חפש "כללי העיצוב הקבועים"). כאן רק
     היישום למסך, ושני המקומות חייבים להישאר זהים.
     קפה/בוקר: "לעילוי נשמת" בגודל השם, והבקשה בגופן שורת הנוסח. */
  .cnames .nlead{font-size:1em}
  .cnames .nreq{font-size:.472em}
  /* תואר ("רבי", "מרת") אינו הפתיח של ההקדשה — הוא בגודל של זצוק"ל */
  .names .nttl,.cnames .nttl{font-size:.42em;font-weight:700;display:block}
  .cclose{font-size:1em;line-height:1.4;font-weight:600;width:100%}
  .rm{display:none}
  @media screen{.rm{display:block;position:absolute;inset-inline-start:-1.5em;top:0;background:none;border:none;color:#c43a2b;cursor:pointer;font-size:.8em;opacity:.5}.rm:hover{opacity:1}}
  [contenteditable]{outline:none;border-radius:6px;transition:background .15s}
  [contenteditable]:focus{background:rgba(156,122,46,.14);box-shadow:0 0 0 2px var(--gold)}
  [contenteditable]:empty:before{content:attr(data-ph);color:#b3a884;font-weight:400}
  .noprint{text-align:center;margin:14px}
  .noprint button{font-family:inherit;font-size:1rem;font-weight:700;padding:12px 26px;border-radius:10px;border:none;background:var(--gold);color:#fff;cursor:pointer;margin:0 5px}
  .noprint button.g{background:#fff;color:var(--gold);border:1px solid var(--gold)}
  .noprint .tip{font-size:.85rem;color:#7a6f50;margin-top:8px}
  @media print{
    @page{size:A4;margin:0}
    body{background:#fff}
    .scroller{overflow:visible;padding:0}
    .sheet{width:210mm;height:297mm;aspect-ratio:auto;box-shadow:none;margin:0}
    .noprint{display:none}
    [contenteditable]:focus{background:none;box-shadow:none}
    [contenteditable]:empty:before{content:''}
    [contenteditable]:empty{display:none}
  }
</style>
</head>
<body>
<div class="scroller"><div class="sheet" id="sheet">
  <div class="content" id="content"></div>
</div></div>

<div class="noprint">
  <button id="copyBtn" style="background:#3b2f5e">📋 העתק תמונה</button>
  <button id="sendBtn" style="background:#25D366">📤 שלח לתורם (תמונה)</button>
  <button onclick="window.print()">🖨️ הדפס / שמור PDF</button>
  <button class="g" id="addBtn">➕ הוסף שם</button>
  <button class="g" onclick="history.length>1?history.back():window.close()">← חזרה</button>
  <div class="tip">"📋 העתק תמונה" — ואז מדביקים בוואטסאפ או במייל. "📤 שלח לתורם" שולח את התעודה כתמונה — בטלפון ישר לוואטסאפ, במחשב מועתקת להדבקה.<br>מלא את הפרטים — הגופן מתאים את עצמו אוטומטית לכמות הטקסט וממלא את כל הדף. השמות מודגשים וגדולים.</div>
</div>

<script>
const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const KIND = q.get('kind') || 'parnes';

// ----- כל השם באותו גודל; רק בן/בת/ז"ל/ע"ה מוקטנים (פשוט ואמין, בלי ניחוש שם מול בקשה) -----
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const SMALLWORD=/^(בן|בת|בר|ב["'״׳]ר|ובן|ובת|ז["'״׳]ל|ע["'״׳]ה|ע["'״׳]י|ע["'״׳]ש|זצ["'״׳]ל|זצוק["'״׳]?ל|הי["'״׳]ד|נ["'״׳]י|שליט["'״׳]א|שיחי["'״׳]?|שיחיו|תחי["'״׳]?|ותחי["'״׳]?|הר["'״׳]ר|הרר|הרב|רבי|ר["'״׳]|מוה["'״׳]ר|הרה["'״׳][גחצקי]|הגה["'״׳]צ|מרן|מרת|מר|האשה|הבחור|הבתולה|הילד|הילדה|הנער|הנערה|ו?ה?חתן|ו?ה?כלה|האברך|הנישאים|הנישאין|היום|עב["'״׳]?ג|אביו|אביה|אמו|אמה|בנו|בנה|בתו|בתה|אחיו|אחיה|אחותו|אחותה|זקנו|זקנתו|חמיו|חמותו|בעלה|אשתו|נכדו|נכדתו|חתנו|כלתו|דודו|דודתו)$/;
// מהמילה שבה מתחילה הבקשה ועד סוף השורה — אותיות קטנות יותר, כדי שהשם
// ושם האם יקבלו את הדגש החזק ביותר
const REQSTART=/^(ו?ל)(רפוא\S*|הצלח\S*|זיווג\S*|זרע\S*|פרנס\S*|ישוע\S*|ברכ\S*|נחת|חיים|בני\S*|שלום|עילוי|עלוי|זכר|כל|אריכ\S*|בריא\S*|שנה|כפרת|הרחב\S*|מזל|שידוך|בן|בת)$|^(לע["'״׳]?נ|לזכות|לזכר|לרגל|לכבוד)$|^ו?בזכות$/;
// פתיח שבא לפני השם — רק הוא קטן, והשמות שאחריו נשארים גדולים
// מאיר כותב "לעלוי" בלי היו"ד — שני הכתיבים מזוהים כמילת פתיח, אחרת
// המילה נשארת גדולה בשורת התורם והמערכת מוסיפה "לעילוי" משלה מתחתיה
const LEADWORD=/^(לע[יו]?לוי|נשמת|לע["'״׳]?נ|לזכר|לזכות|לרפואת|לרפואה|לרפו["'״׳]?ש|להצלחת|להצלחה|לישועת|לישועה|לפרנסת|לפרנסה|לזרע|לזיווג|לברכת|לברכה|לכבוד|לרגל)$/;
// רק פתיח שבא *לפני שם* פותח הקדשה. ההבדל קיים בלשון: "לברכת"/"לרפואת"
// (סמיכות) באות לפני שם, ואילו "לברכה"/"לרפואה" הן הברכה שאחרי השם.
const DEDWORD=/^(לע[יו]?לוי|נשמת|לע["'״׳]?נ|לזכר|לזכות|לרפואת|להצלחת|לישועת|לפרנסת|לברכת|לכבוד|לרגל)$/;
// המשך הפתיח — מילה שנחשבת חלק מהבקשה רק מיד אחרי המילה שלפניה, כך
// ש"שלמה" ב"לרפואה שלמה" קטן אבל "שלמה" כשם פרטי נשאר גדול
const LEAD2={'לרפואה':['שלמה','שלימה'],'לברכה':['והצלחה'],'להצלחה':['וברכה'],
  'לזיווג':['הגון'],'לפרנסה':['טובה'],'לזרע':['של','קודש'],'של':['קיימא'],'לישועה':['שלמה']};
function leadLen(ws){
  let i=0;
  while(i<ws.length && LEADWORD.test(ws[i])){ i++;
    while(i<ws.length && (LEAD2[ws[i-1]]||[]).indexOf(ws[i])>=0) i++; }
  return i;
}
function fmtWords(ws){
  const n=leadLen(ws); let out=[];
  for(let k=0;k<n;k++) out.push(`<span class="nreq">${esc(ws[k])}</span>`);
  let i=n;
  let req=false;
  for(; i<ws.length; i++){
    const w=ws[i];
    if(!req && REQSTART.test(w)) req=true;
    out.push(req ? `<span class="nreq">${esc(w)}</span>`
      : (SMALLWORD.test(w) ? `<span class="nsm">${esc(w)}</span>` : esc(w)));
  }
  return out.join(' ');
}
// מילת קרבה שבאה אחרי הפתיח — "לע\"נ אביו", "לרפואת בנו"
const RELWORD=/^(אביו|אביה|אמו|אמה|בנו|בנה|בתו|בתה|אחיו|אחיה|אחותו|אחותה|זקנו|זקנתו|חמיו|חמותו|בעלה|אשתו|נכדו|נכדתו|חתנו|כלתו|דודו|דודתו|הוריו|הוריה)$/;
// תואר שפותח שם — "החתן", "הכלה". אם אחריו בא שם, כאן מתחילים השמות
const MARKW=/^(ו?ה?חתן|ו?ה?כלה|הבחור|הבתולה|האברך|הילד|הילדה|הנער|הנערה|האשה|מרת|הרב|רבי)$/;
const FILLW=/^(הנישאים|הנישאין|הנישאת|היום|שיחיו|יחיו|תחיו|עב["'״׳]?ג|עם|ואשתו|ורעייתו|ורעיתו)$/;
// תחילת הברכה שאחרי השמות — רק מילים חד-משמעיות, כדי ש"טובה" כשם פרטי לא תחתוך שם
const TAILW=/^שה|^(שיזכו|שיזכה|שתזכה|ה?חופה|יהיה|יהא|תהיה|שיהיה|שתהיה|בשעה|ו?מוצלחת|עדי|קיימא|דורות|ישרים|מבורכים|אמן|במהרה|בקרוב|לתורה|ולחופה|ולמעש[יי]ם|בזש["'״׳]?ט)$/;
// גבולות השמות: לפניהם תארים, אחריהם הברכה — שניהם בקטן, השמות בגדול
function nameSpan(ws){
  const n=ws.length; let i=0;
  while(i<n){
    const w=ws[i];
    if(MARKW.test(w)){
      const nx=ws[i+1]||'';
      if(nx && !MARKW.test(nx) && !FILLW.test(nx) && !TAILW.test(nx)) break;
      i++; continue;
    }
    if(FILLW.test(w)){ i++; continue; }
    break;
  }
  let j=i; while(j<n && !TAILW.test(ws[j])) j++;
  return [i,j];
}
// "לע\"נ אביו" בשורה משלו, כל שם בשורה משלו, והברכה בשורה קטנה מתחת
// מאיר: "חסר המילה לעילוי" — כשנכתב רק "נשמת", התעודה אומרת "לעילוי נשמת"
function addLeilui(ws){
  return ws[0]==='נשמת' ? ['לעילוי'].concat(ws) : ws;
}
function dedPart(ws, trailing){
  ws=addLeilui(ws);
  const k=leadLen(ws);
  let r=k;
  while(r<ws.length && RELWORD.test(ws[r])) r++;
  // שורה שכולה פתיח ואין אחריה שם: אם היא באה אחרי השם היא הבקשה
  // ("לרפואה שלמה") ובגודל הנוסח, ואם היא פותחת — היא הפתיח, חצי מהשם
  if(k>0 && r>=ws.length)
    return `<span class="nrow ${trailing?'nreq':'nlead'}">${ws.map(w=>esc(w)).join(' ')}</span>`;
  if(k>0 && r<ws.length) return bodyPart(ws.slice(r), ws.slice(0,r));
  return bodyPart(ws);
}
// שורת הפתיח (כולל התארים שלפני השם) אחת, אחריה כל שם בשורה משלו, ואז הברכה
// תואר שנכתב תמיד מעל השם — "החתן", "הכלה", "הרב"
const TITLEW=/^(ו?ה?חתן|ו?ה?כלה|הבחור|הבתולה|האברך|הילד|הילדה|הנער|הנערה|האשה|מרת|מר|הרב|רבי|הר["'״׳]ר|הרר|מוה["'״׳]ר|הרה["'״׳][גחצקי]|הגה["'״׳]צ|מרן)$/;
function bodyRows(ws, lead){
  const [a,b]=nameSpan(ws), rows=[];
  const head=(lead||[]).concat(ws.slice(0,a));
  if(head.length) rows.push({ws:head,role:'lead'});
  const emit=seg=>{
    let t=0; while(t<seg.length-1 && TITLEW.test(seg[t])) t++;
    if(t) rows.push({ws:seg.slice(0,t),role:'ttl'});
    const rest=seg.slice(t);
    // כלל 3: הבקשה יורדת לשורה משלה ואינה נדחסת לשורת השם
    let r=-1;
    for(let i=0;i<rest.length;i++) if(REQSTART.test(rest[i])){ r=i; break; }
    if(r===0) rows.push({ws:rest,role:'req'});          // שורה שכולה בקשה
    else if(r>0){ rows.push({ws:rest.slice(0,r),role:'names'}); rows.push({ws:rest.slice(r),role:'req'}); }
    else rows.push({ws:rest,role:'names'});
  };
  let cur=[];
  for(let k=a;k<b;k++){
    if(cur.length && MARKW.test(ws[k])){ emit(cur); cur=[]; }
    cur.push(ws[k]);
  }
  if(cur.length) emit(cur);
  if(b<ws.length) rows.push({ws:ws.slice(b),role:'req'});
  return rows;
}
// מאיר: "אל תעשה אף פעם שורה עם מילה אחת. המילים הרה\"ק רבי שיהיו בשורה
// אחת, גם המילים בן רבי שיהיו בשורה אחת, אותו גודל גופן כמו זצו\"קל"
function joinSingles(rows){
  // מאיר: "המילים מאחרי לעילוי נשמת אותו גודל עד המילה זצוק\"ל, חוץ
  // מהמילים בן רבי. הרה\"ק רבי יהיו אותה שורה."
  // שורת השמות מכילה שמות בלבד; מילות הלוואי שנגררו לסופה יורדות אל
  // שורת התואר שאחריהן ומצטרפות אליה, בגודל של זצוק\"ל.
  const out=[];
  rows.forEach(r=>{
    let ws=r.ws.slice(); const role=r.role;
    const prev=out.length?out[out.length-1]:null;
    if(role==='ttl' && prev && prev.role==='names'){
      const take=[];
      while(prev.ws.length>1 && SMALLWORD.test(prev.ws[prev.ws.length-1])) take.unshift(prev.ws.pop());
      if(take.length) ws=take.concat(ws);
    }
    if(role==='ttl' && ws.length===1 && prev && (prev.role==='names'||prev.role==='ttl')){
      prev.ws=prev.ws.concat(ws); return;
    }
    // סיומת ברכה בודדת ("אמן") נצמדת לברכה שמעליה
    if(role==='req' && ws.length===1 && prev && prev.role==='req'){
      prev.ws=prev.ws.concat(ws); return;
    }
    if(ws.length) out.push({ws,role});
  });
  return out.filter(r=>r.ws.length);
}
function rowsHTML(rows){
  return rows.map(r=>{
    if(r.role==='lead') return `<span class="nrow nlead">${r.ws.map(w=>esc(w)).join(' ')}</span>`;
    if(r.role==='ttl')  return `<span class="nrow nttl">${r.ws.map(w=>esc(w)).join(' ')}</span>`;
    if(r.role==='req')  return `<span class="nrow nreq">${r.ws.map(w=>esc(w)).join(' ')}</span>`;
    return `<span class="nline">${fmtWords(r.ws)}</span>`;
  }).join('');
}
function bodyPart(ws, lead){ return rowsHTML(joinSingles(bodyRows(ws, lead))); }
// שם התורם קטן מהשמות שמתפללים עליהם — בין אם הוא בשורה משלו ובין אם
// הוא באותה שורה, לפני "לע\"נ" / "לרפואת"
function formatName(line, donorLine){
  const t=(line||'').trim(); if(!t) return '';
  const ws=t.split(/\s+/);
  let ded=-1;
  // שורה שמתחילה בפתיח היא כולה הקדשה — אין בה שם תורם, ואסור שהמילה
  // הראשונה תיחשב לשם התורם רק כי אחריה בא עוד פתיח ("לעילוי" ואז "נשמת")
  if(!LEADWORD.test(ws[0]))
    for(let k=1;k<ws.length;k++){
      // אחרי מילת הפתיח חייב לבוא שם. אם נשארה רק המשך הבקשה, זו בקשה
      // שאחרי השם ("יעקב בן שרה לרפואה שלמה") ולא הקדשה של תורם
      if(DEDWORD.test(ws[k]) && leadLen(ws.slice(k))<ws.length-k){ ded=k; break; } }
  // מי תורם ועבור מה הוא תורם — תמיד בשתי שורות נפרדות
  if(ded>0) return `<span class="nrow ndon"><span class="nline">${fmtWords(ws.slice(0,ded))}</span></span>`+dedPart(ws.slice(ded),1);
  if(LEADWORD.test(ws[0])) return dedPart(ws);
  const body=bodyPart(ws);
  return donorLine ? `<span class="ndon">${body}</span>` : body;
}
function formatLines(text){
  const ls=String(text||'').split('\n');
  // שורה ראשונה היא שם התורם רק אם אחריה יש שורת הקדשה/בקשה
  const hasLead=ls.some((l,i)=>i>0 && LEADWORD.test((l.trim().split(/\s+/)[0]||'')));
  return ls.map((l,i)=>formatName(l, i===0 && hasLead)).join('\n');
}
function wireFmt(el){
  el.addEventListener('focus',()=>{ el.textContent=el.innerText; });      // עריכה בטקסט רגיל
  el.addEventListener('blur',()=>{ el.innerHTML=formatLines(el.innerText); fit(); });
}

const CFG = {

  coffee:    {bg:'/letterhead-coffee.jpg',  top:'24%',  left:'9%',  right:'9%', bottom:'21%'},

Object.assign($('content').style, {top:cfg.top, left:cfg.left, right:cfg.right, bottom:cfg.bottom});

// מאיר: "איפה שכתוב לעילוי נשמת — תוריד את המילים יהיו ויעמדו לזכות"
// מאיר: "אם יש לעילוי נשמת או לרפואת אז מורידים את המילה לזכות" — גם
// "יהיו ויעמדו לזכות" בפרנס לילה, וגם ה"לזכות" שבסוף נוסח הקפה והבוקר.
const NESHAMA=/לע[יו]?לוי|לע["'\u05f4\u05f3]?נ(\s|$)|נשמת|לרפוא/;
function certNames(){
  const pairs=[...document.querySelectorAll('.pair .names')];
  if(pairs.length) return pairs.map(e=>e.innerText).join(' ');
  const n=document.getElementById('c_names');
  return n?n.innerText:'';
}
function standToggle(){
  const st=document.querySelector('.stand');
  if(st) st.classList.toggle('off', NESHAMA.test(certNames()));
  dedicToggle();
}
// נוסח הקפה/הבוקר נגמר ב"לזכות", ובהקדשה לעילוי נשמת המילה הזו יורדת.
// אם מאיר ערך את הנוסח בעצמו — לא נוגעים במה שכתב.
let DEDIC_FULL='', DEDIC_BARE='';
function dedicToggle(){
  const el=document.getElementById('c_dedic'); if(!el||!DEDIC_FULL)return;
  const cur=el.textContent.trim();
  if(cur!==DEDIC_FULL && cur!==DEDIC_BARE) return;
  const want=NESHAMA.test(certNames())?DEDIC_BARE:DEDIC_FULL;
  if(cur!==want) el.textContent=want;
}
// מאיר: "המילים יהי רצון תמיד בגודל אחיד, בשלוש שורות בלבד". הגודל נקבע
// מהרוחב — הנוסח חייב לצאת בשלוש שורות — וכל השאר נגזר ממנו לפי היחסים.
// רק אם הכל יחד גבוה מהמסגרת מקטינים הכל יחד ושומרים על היחסים.
const NUSLINES=3;
function fit(){
  standToggle();
  // בתעודת הפרנס כל הגדלים נקבעו במפורש, ולכן אין חיפוש גודל לפי הנוסח:
  // קובעים אותם, ורק אם הכל יחד לא נכנס לדף מקטינים הכל באותם יחסים.
  if(KIND==='parnes'){ fitParnes(); return; }
  // מאיר: "את התאריך תגדיל לגודל 50 תמיד" — 50 פיקסלים על רוחב 1000,
  // כלומר 5% מרוחב הדף. קבוע, ואינו מתכווץ יחד עם שאר הטקסט.
  const sh=document.getElementById('sheet');
  if(sh && (KIND==='coffee'||KIND==='breakfast')){
    const px=(sh.clientWidth*0.05).toFixed(2)+'px';
    const cd=document.getElementById('c_date'), cx=document.getElementById('c_dedic');
    if(cd) cd.style.fontSize=px;
    if(cx) cx.style.fontSize=px;
  }
  const c = $('content'), body = document.getElementById('cbody');
  const avail = c.clientHeight - 14; if(avail<=0 || !body) return;  // שוליים קטנים לקצוות
  const nus = c.querySelector('.nusach');
  let best=6;
  if(nus){
    const lines=px=>{ c.style.fontSize=px+'px';
      const lh=parseFloat(getComputedStyle(nus).lineHeight)||1;
      return Math.round(nus.getBoundingClientRect().height/lh); };
    let lo=6, hi=380;
    for(let i=0;i<22;i++){ const mid=(lo+hi)/2;
      if(lines(mid)<=NUSLINES){ best=mid; lo=mid; } else { hi=mid; } }
  } else { best=40; }
  c.style.fontSize=best+'px';
  fitNames(c);
  // גלישה לגובה — מקטינים הכל יחד, היחסים נשמרים
  if(body.getBoundingClientRect().height>avail){
    let lo=6, hi=best, b2=6;
    for(let i=0;i<20;i++){ const mid=(lo+hi)/2; c.style.fontSize=mid+'px'; fitNames(c);
      if(body.getBoundingClientRect().height<=avail){ b2=mid; lo=mid; } else { hi=mid; } }
    c.style.fontSize=b2+'px'; fitNames(c);
  }
}
/* מאיר: "המילים יהי רצון עד אחרי המילים יעמדו לזכות שיהיו גודל אחיד של
   40, התאריך גודל 50, השמות גודל 70, חוץ ממה שכבר ציינתי לך כמו בן בת
   או שיחי' וכו', הבקשות של אחר כך גודל 40 שוב."
   המספרים הם על רוחב 1000 ומתאימים את עצמם לרוחב הדף, כדי שיהיו זהים
   במסך, בתמונה ובהדפסה. sf מקטין את כולם יחד רק כשההקדשה ארוכה מדי. */
function parnesSizes(sf){
  const sh=document.getElementById('sheet'); if(!sh)return;
  const u=(sh.clientWidth/1000)*sf;
  // מנקים הקטנות קודמות — הן חושבו מול גודל אחר
  document.querySelectorAll('#pairs .nline,#pairs .nlead,#pairs .nreq,#pairs .nttl')
    .forEach(e=>e.style.removeProperty('font-size'));
  const set=(sel,n)=>document.querySelectorAll(sel)
    .forEach(e=>{e.style.setProperty('font-size',(n*u).toFixed(2)+'px','important');});
  // גודל הבסיס קובע גם את הרווחים שבין הבלוקים (הם ביחידות em)
  document.getElementById('content').style.fontSize=(40*u).toFixed(2)+'px';
  set('.nusach',40); set('.date',50); set('.stand',40);
  set('#pairs .names',70); set('#pairs .req',40);
  set('#pairs .nreq',40); set('#pairs .nlead',40);
  // ורק עכשיו, מול הגודל הסופי, מקטינים שם ארוך כדי שיישאר בשורה אחת
  document.querySelectorAll('#pairs .nline').forEach(el=>{
    const box=el.parentElement, avail=box?box.clientWidth:0;
    if(!avail)return;
    const w=el.scrollWidth;
    if(w>avail) el.style.setProperty('font-size',
      (70*u*Math.max(.3, avail/w)).toFixed(2)+'px','important');
  });
}
function fitParnes(){
  const c=$('content'), body=document.getElementById('cbody');
  parnesSizes(1);
  const avail=c.clientHeight-14; if(avail<=0||!body)return;
  if(body.getBoundingClientRect().height<=avail)return;
  let lo=.15, hi=1;
  for(let i=0;i<18;i++){ const mid=(lo+hi)/2; parnesSizes(mid);
    if(body.getBoundingClientRect().height<=avail) lo=mid; else hi=mid; }
  parnesSizes(lo);
}
// שם ארוך מתכווץ כדי להישאר בשורה אחת, במקום להישבר באמצע
function fitNames(c){
  c.querySelectorAll('.nlead').forEach(el=>{el.style.fontSize='';});
  const fac=new Map();
  // כלל 2: מודדים קודם את כל שורות השמות, ואז נותנים לכולן את המקדם
  // הקטן ביותר — שורה ארוכה לא מתכווצת לבדה ומשאירה שם אחר ענק לידה
  const lines=[...c.querySelectorAll('.nline')];
  lines.forEach(el=>{el.style.fontSize='';});
  const need=new Map();
  lines.forEach(el=>{
    const box=el.parentElement, avail=box?box.clientWidth:0;
    if(!avail) return;
    const w=el.scrollWidth;
    const f=(w>avail)?Math.max(.30, avail/w):1;
    need.set(box, Math.min(need.get(box)!=null?need.get(box):1, f));
  });
  lines.forEach(el=>{
    const box=el.parentElement, f=need.get(box);
    if(f==null||f>=1) return;
    el.style.fontSize=f.toFixed(3)+'em';
    fac.set(box, f);
  });
  // "לעילוי נשמת" חייב להישאר חצי מהשם — גם אחרי שהשם הוקטן כדי להיכנס
  fac.forEach((f,box)=>box.querySelectorAll('.nlead')
    .forEach(el=>{el.style.fontSize=(.5*f).toFixed(3)+'em';}));
}
const wire = el => el.querySelectorAll('[contenteditable]').forEach(e=>e.addEventListener('input', fit));

if(KIND==='coffee' || KIND==='breakfast'){
  // ----- תעודת חדר קפה / ארוחת בוקר (אותו בלאנק להשקות) -----
  // התאריך ושורת הנוסח נצמדים לראש הדף, שיישאר מקום להקדשות ארוכות
  $('content').classList.add('toptxt');
  $('addBtn').style.display='none';
  const dedic = KIND==='breakfast' ? 'ארוחת בוקר היום נתרמה לזכות' : 'הקפה החלב שתיה חמה ועוגיות נתרמו לזכות';
  DEDIC_FULL = dedic; DEDIC_BARE = dedic.replace(/\s*לזכות$/,'');
  $('content').innerHTML =
    `<div id="cbody">
     <div class="cdate" contenteditable="true" id="c_date" data-ph="~ ~ התאריך ~ ~"></div>
     <div class="cdedic" contenteditable="true" id="c_dedic">${dedic}</div>
     <div class="cnames" contenteditable="true" id="c_names" data-ph="השמות"></div>
     </div>`;
  if(q.get('date')) $('c_date').textContent=q.get('date');
  if(q.get('names')) $('c_names').innerHTML=formatLines(q.get('names'));
  wireFmt($('c_names'));
  wire($('content'));
} else {
  // ----- תעודת פרנס לילה -----
  $('content').classList.add('toptxt');
  $('content').innerHTML =
    `<div id="cbody">
     <div class="nusach">יהי רצון שזכות הלימודים והתפילות הנעשים כאן בכולל חצות בעת רצון הגדול של חצות הלילה עד הבוקר</div>
     <div class="date" contenteditable="true" id="c_date" data-ph="~ ~ התאריך ~ ~"></div>
     <div class="stand">יהיו ויעמדו לזכות</div>
     <div id="pairs"></div>
     </div>`;
  if(q.get('date')) $('c_date').textContent=q.get('date');
  $('c_date').addEventListener('input', fit);
  window.addPair = function(name){
    const wrap=document.createElement('div'); wrap.className='pair';
    wrap.innerHTML='<button class="rm" title="הסר">✕</button>'+
      '<div class="names" contenteditable="true" data-ph="השם"></div>';
    const nd=wrap.querySelector('.names');
    if(name) nd.innerHTML=formatLines(name);
    wireFmt(nd);
    wrap.querySelector('.rm').onclick=()=>{ wrap.remove(); fit(); };
    wire(wrap); $('pairs').appendChild(wrap); fit();
  };
  addPair(q.get('names')||'');
  $('addBtn').onclick=()=>addPair('');

// ----- שליחת התעודה לתורם כתמונה (מהתוכן שעל המסך, כולל עריכות) -----
function certText(){
  const dt=($('c_date')?$('c_date').innerText:'').trim();
  let nm='';
  if(KIND==='coffee'||KIND==='breakfast'){ nm=($('c_names')?$('c_names').innerText:'').trim(); }
  else { nm=[...document.querySelectorAll('#pairs .names')].map(e=>e.innerText.trim()).filter(Boolean).join('\n'); }
  return {date:dt, names:nm, roles:certRoles()};
}
// תפקיד כל שורה כפי שהוא מצויר עכשיו על המסך. השרת מקבל אותו כמו שהוא
// ואינו מנתח את הטקסט מחדש — ניתוח שני של טקסט שכבר סודר הורס אותו:
// "הרה\"ק רבי" נשבר לשתי שורות, ו"לזכות" הפך לשם גדול.
function certRoles(){
  const box=(KIND==='coffee'||KIND==='breakfast')?$('c_names'):null;
  if(!box)return '';
  const out=[];
  box.childNodes.forEach(n=>{
    if(n.nodeType!==1)return;
    const c=n.className||'';
    if(n.classList.contains('ndon')){ out.push('donor'); return; }
    if(/\bnlead\b/.test(c)) out.push('lead');
    else if(/\bnttl\b/.test(c)) out.push('ttl');
    else if(/\bnreq\b/.test(c)) out.push('req');
    else out.push('names');
  });
  return out.join(',');
}
// כתובת התמונה לפי מה שכתוב עכשיו על המסך
function certPngUrl(ext){
  const {date,names}=certText();
  const {roles}=certText();
  return '/cert.'+(ext||'png')+'?'+new URLSearchParams({kind:KIND,date,names,roles:roles||''}).toString();
}
// התמונה מוכנה מראש ברקע — כדי שההעתקה ללוח תקרה מיד בלחיצה (כרום דורש זאת)
let PNGREADY=null, PNGKEY='', PNGERR='';
async function preparePng(){
  const k=certPngUrl('png');
  if(PNGKEY===k && PNGREADY) return PNGREADY;
  PNGKEY=k; PNGREADY=null; PNGERR='';
  try{ const r=await fetch(k); const b=await r.blob();
    if(b && b.size>5000 && (b.type||'').indexOf('image')>=0){ PNGREADY=b; }
    else{ PNGERR=await b.text().catch(()=>'')||('שגיאת שרת '+r.status); } }
  catch(e){ PNGERR='אין חיבור לשרת'; }
  return PNGREADY;
}
// העתקה ללוח — הדרך הכי מהירה: מעתיקים ומדביקים בוואטסאפ/מייל
$('copyBtn').onclick=async()=>{
  const b=$('copyBtn'), t0=b.textContent;
  const {names}=certText();
  if(!names.trim()){ alert('אין שמות בתעודה'); return; }
  if(!(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write)){
    alert('הדפדפן הזה לא תומך בהעתקת תמונה — השתמש ב"שלח לתורם"'); return; }
  const ok=()=>{ b.textContent='✅ הועתק — הדבק בוואטסאפ'; setTimeout(()=>{b.textContent=t0;},2500); };
  let err='';
  // 1) התמונה כבר בזיכרון — הדרך שעובדת בכרום
  if(PNGREADY && PNGKEY===certPngUrl('png')){
    try{ await navigator.clipboard.write([new ClipboardItem({'image/png':PNGREADY})]); ok(); return; }
    catch(e){ err=e&&e.message||String(e); }
  }
  // 2) ספארי: צורת ה-Promise שומרת על אישור המשתמש
  try{ await navigator.clipboard.write([new ClipboardItem({'image/png':preparePng().then(x=>x||Promise.reject())})]); ok(); return; }
  catch(e){ err=err||(e&&e.message||String(e)); }
  // 3) הבאה ואז כתיבה
  b.textContent='מעתיק…';
  try{ const blob=await preparePng();
    if(blob){ await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]); ok(); return; } }
  catch(e){ err=err||(e&&e.message||String(e)); }
  b.textContent=t0;
  const why=PNGERR||err;
  alert(PNGERR ? ('התמונה לא נוצרה בשרת:\n'+PNGERR)
              : ('ההעתקה נכשלה'+(why?(': '+why):'')+'\nנסה "שלח לתורם", או לחץ שוב — התמונה כבר מוכנה עכשיו.'));
  preparePng();
};

$('sendBtn').onclick=async()=>{
  const b=$('sendBtn'), t0=b.textContent;
  const {date,names}=certText();
  if(!names.trim()){ alert('אין שמות בתעודה'); return; }
  b.disabled=true; b.textContent='מכין את התמונה…';
  const url=certPngUrl('jpg');
  let blob=null;
  try{ const rs=await fetch(url); blob=await rs.blob(); }
  catch(e){ b.disabled=false; b.textContent=t0; window.open(url,'_blank'); return; }
  if(!blob||blob.size<5000||(blob.type||'').indexOf('image')<0){   // לא לשלוח קובץ פגום
    b.disabled=false; b.textContent=t0; alert('התמונה לא נוצרה כראוי — נסה שוב'); return; }
  const fname='תעודת פרנס'+(date?(' — '+date):'')+'.jpg';
  const cap='תעודת פרנס — כולל חצות 🕯️'+(date?('  ·  '+date):'');
  b.disabled=false; b.textContent=t0;
  try{ const file=new File([blob],fname,{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:cap}); return; } }
  catch(e){ if(e&&e.name==='AbortError') return; }
  try{ if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      alert('התמונה הועתקה — פתח וואטסאפ ווב או מייל והדבק (Ctrl+V)'); return; } }catch(e){}
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};

let _prep=null;
function schedulePrep(){ clearTimeout(_prep); _prep=setTimeout(preparePng,600); }
document.addEventListener('input', schedulePrep, true);
document.addEventListener('blur', schedulePrep, true);
window.addEventListener('load', ()=>setTimeout(preparePng,400));

window.addEventListener('resize', fit);
window.addEventListener('load', fit);            // אחרי טעינת רקע הבלאנק
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit).then(()=>setTimeout(fit,60));  // אחרי טעינת הגופן (מונע חיתוך למעלה)
fit();
