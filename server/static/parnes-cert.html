<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כולל חצות — תעודת פרנס</title>
<style>
  @font-face{font-family:'FrankRuhl';src:url('/frankruhl-regular.ttf') format('truetype');font-weight:400 600;font-display:swap}
  @font-face{font-family:'FrankRuhl';src:url('/frankruhl-bold.ttf') format('truetype');font-weight:700 900;font-display:swap}
  :root{--ink:#1c1710;--deep:#6a1414;--gold:#9c7a2e}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:#d9d2c2;color:var(--ink);font-family:'FrankRuhl',"Frank Ruhl Libre","Times New Roman",serif}
  .scroller{overflow-x:auto;padding:16px}
  .sheet{position:relative;width:794px;aspect-ratio:2482/3509;margin:0 auto;
    background:#fdf9ee top center/100% 100% no-repeat;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
    -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .content{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
  #cbody{width:100%;display:flow-root}
  /* גדלים יחסיים ל-font-size של .content שנקבע אוטומטית למילוי הדף */
  .nusach{font-size:1em;line-height:1.45;font-weight:600;width:100%}
  .date{font-size:1.55em;font-weight:800;color:var(--deep);margin:.5em 0 .35em;width:100%}
  .stand{font-size:1em;font-weight:600;margin-bottom:.15em;width:100%}
  .pair{width:100%;margin:.15em 0 .35em;position:relative}
  .names{font-size:2.3em;font-weight:800;line-height:1.14;color:#000;width:100%;white-space:pre-line}
  .req{font-size:1em;line-height:1.4;font-weight:600;width:100%;margin-top:.05em}
  /* השם ושם האם — גדולים; בן/בת, ז"ל/ע"ה, והבקשה — קטנים */
  .names .nbig,.cnames .nbig{font-size:1em;font-weight:800}
  .names .nsm,.cnames .nsm{font-size:.5em;font-weight:600}
  /* חדר קפה */
  .cdate{font-size:1.05em;font-weight:700;color:var(--deep);width:100%;margin-bottom:.35em}
  .ctitle{font-size:2.5em;font-weight:800;color:var(--deep);width:100%;margin:.1em 0 .25em}
  .cdedic{font-size:1.42em;font-weight:800;color:var(--deep);width:100%;margin-bottom:.4em;letter-spacing:.005em}
  .cnames{font-size:2.35em;font-weight:800;line-height:1.28;color:#000;width:100%;margin:.15em 0 .4em;white-space:pre-line}
  .cclose{font-size:1em;line-height:1.4;font-weight:600;width:100%}
  .rm{display:none}
  @media screen{.rm{display:block;position:absolute;inset-inline-start:-1.5em;top:0;background:none;border:none;color:#c43a2b;cursor:pointer;font-size:.8em;opacity:.5}.rm:hover{opacity:1}}
  [contenteditable]{outline:none;border-radius:6px;transition:background .15s}
  [contenteditable]:focus{background:rgba(156,122,46,.14);box-shadow:0 0 0 2px var(--gold)}
  [contenteditable]:empty:before{content:attr(data-ph);color:#b3a884;font-weight:400}
  .noprint{text-align:center;margin:14px}
  .noprint button{font-family:inherit;font-size:1rem;font-weight:700;padding:12px 26px;border-radius:10px;border:none;background:var(--gold);color:#fff;cursor:pointer;margin:0 5px}
  .noprint button.g{background:#fff;color:var(--gold);border:1px solid var(--gold)}
  .noprint .tip{font-size:.85rem;color:#7a6f50;margin-top:8px}
  @media print{
    @page{size:A4;margin:0}
    body{background:#fff}
    .scroller{overflow:visible;padding:0}
    .sheet{width:210mm;height:297mm;aspect-ratio:auto;box-shadow:none;margin:0}
    .noprint{display:none}
    [contenteditable]:focus{background:none;box-shadow:none}
    [contenteditable]:empty:before{content:''}
    [contenteditable]:empty{display:none}
  }
</style>
</head>
<body>
<div class="scroller"><div class="sheet" id="sheet">
  <div class="content" id="content"></div>
</div></div>

<div class="noprint">
  <button onclick="window.print()">🖨️ הדפס / שמור PDF</button>
  <button class="g" id="addBtn">➕ הוסף שם</button>
  <button class="g" onclick="history.length>1?history.back():window.close()">← חזרה</button>
  <div class="tip">מלא את הפרטים — הגופן מתאים את עצמו אוטומטית לכמות הטקסט וממלא את כל הדף. השמות מודגשים וגדולים.</div>
</div>

<script>
const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const KIND = q.get('kind') || 'parnes';

// ----- הדגשת שם + שם האם (גדול) מול בן/בת, כינויים והבקשה (קטן) -----
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const HONOR=/^(ז["'״׳]ל|ע["'״׳]ה|זצ["'״׳]ל|זצוק["'״׳]?ל|הי["'״׳]ד|שליט["'״׳]א|נ["'״׳]י|שתחי['׳]|שיחי['׳]|תחי['׳]|הכהן|הלוי|הי["'״׳]ו)$/;
const PREFIX=/^(לעילוי|לע["'״׳]נ|נשמת|לזכר|לזכרון|לרפואת|לרפואה|לזרע|האשה|האישה|האיש|החשוב|החשובה|היקר|היקרה|מרת|מר|הרב|הרה["'״׳]ח|רבי|ר['׳]|הבחור|הבחורה|הילד|הילדה|החתן|הכלה|כמר|מוה["'״׳]ר|מוהר["'״׳]ר|הר["'״׳]ר)$/;
const REQWORD=/^(הצלחה|בריאות|פרנסה|רפואה|רפו["'״׳]ש|ישועה|ישועות|זיווג|זווג|דעת|שלום|זרע|אריכות|ברכה|עשירות|שידוך|שידוכים|הרווחה|נחת|בנים|חתונה|סייעתא|וזוג["'״׳]?|הכל)/;
function isReqStart(w){ return HONOR.test(w) || REQWORD.test(w) || /^ל.+/.test(w); }
function formatName(line){
  const t=(line||'').trim(); if(!t) return '';
  const toks=t.split(/\s+/);
  const big=s=>`<span class="nbig">${esc(s)}</span>`, sm=s=>`<span class="nsm">${esc(s)}</span>`;
  let ci=-1; for(let i=0;i<toks.length;i++){ if(toks[i]==='בן'||toks[i]==='בת'){ci=i;break;} }
  if(ci<0) return big(t);                                   // אין בן/בת — כל השורה שם
  const pre=toks.slice(0,ci); let p=0; while(p<pre.length && PREFIX.test(pre[p])) p++;
  const prefix=pre.slice(0,p).join(' ');                    // "לעילוי נשמת האשה החשובה" — קטן
  let name=pre.slice(p).join(' ') || pre[pre.length-1] || '';// השם עצמו — גדול
  let mi=ci+1; const mom=[];                                // שם האם — עד 2 מילים, עצירה בבקשה/כינוי/פסיק
  while(mi<toks.length && mom.length<2){ const w=toks[mi]; if(isReqStart(w)) break; mom.push(w); mi++; if(/[,־]$/.test(w)) break; }
  const rest=toks.slice(mi).join(' ');                      // הבקשה + כינויים — קטן
  let out=(prefix?sm(prefix)+' ':'')+(name?big(name)+' ':'')+sm(toks[ci]);
  if(mom.length) out+=' '+big(mom.join(' '));
  if(rest) out+=' '+sm(rest);
  return out;
}
function formatLines(text){ return String(text||'').split('\n').map(formatName).join('\n'); }
function wireFmt(el){
  el.addEventListener('focus',()=>{ el.textContent=el.innerText; });      // עריכה בטקסט רגיל
  el.addEventListener('blur',()=>{ el.innerHTML=formatLines(el.innerText); fit(); });
}

const CFG = {
  parnes:    {bg:'/letterhead.jpg',        top:'9.5%', left:'25%', right:'5%', bottom:'11%'},
  coffee:    {bg:'/letterhead-coffee.jpg',  top:'24%',  left:'9%',  right:'9%', bottom:'21%'},
  breakfast: {bg:'/letterhead-coffee.jpg',  top:'24%',  left:'9%',  right:'9%', bottom:'21%'},
};
const cfg = CFG[KIND] || CFG.parnes;
$('sheet').style.backgroundImage = `url("${cfg.bg}")`;
Object.assign($('content').style, {top:cfg.top, left:cfg.left, right:cfg.right, bottom:cfg.bottom});

function fit(){
  const c = $('content'), body = document.getElementById('cbody');
  const avail = c.clientHeight - 14; if(avail<=0 || !body) return;  // שוליים קטנים לקצוות
  let lo=6, hi=380, best=6;
  for(let i=0;i<24;i++){ const mid=(lo+hi)/2; c.style.fontSize=mid+'px';
    // מדידת גובה העוטף הפנימי — לא scrollHeight (שנחסם ע"י גובה המסגרת)
    if(body.getBoundingClientRect().height <= avail){ best=mid; lo=mid; } else { hi=mid; } }
  c.style.fontSize=best+'px';
}
const wire = el => el.querySelectorAll('[contenteditable]').forEach(e=>e.addEventListener('input', fit));

if(KIND==='coffee' || KIND==='breakfast'){
  // ----- תעודת חדר קפה / ארוחת בוקר (אותו בלאנק להשקות) -----
  $('addBtn').style.display='none';
  const dedic = KIND==='breakfast' ? 'ארוחת בוקר היום נתרמה לזכות' : 'הקפה החלב שתיה חמה ועוגיות נתרמו לזכות';
  $('content').innerHTML =
    `<div id="cbody">
     <div class="cdate" contenteditable="true" id="c_date" data-ph="~ ~ התאריך ~ ~"></div>
     <div class="ctitle">פרנס יום</div>
     <div class="cdedic" contenteditable="true" id="c_dedic">${dedic}</div>
     <div class="cnames" contenteditable="true" id="c_names" data-ph="השמות"></div>
     </div>`;
  if(q.get('date')) $('c_date').textContent=q.get('date');
  if(q.get('names')) $('c_names').innerHTML=formatLines(q.get('names'));
  wireFmt($('c_names'));
  wire($('content'));
} else {
  // ----- תעודת פרנס לילה -----
  $('content').innerHTML =
    `<div id="cbody">
     <div class="nusach">יהי רצון שזכות הלימודים והתפילות הנעשים כאן בכולל חצות בעת רצון הגדול של חצות הלילה עד הבוקר</div>
     <div class="date" contenteditable="true" id="c_date" data-ph="~ ~ התאריך ~ ~"></div>
     <div class="stand">יהיו ויעמדו לזכות</div>
     <div id="pairs"></div>
     </div>`;
  if(q.get('date')) $('c_date').textContent=q.get('date');
  $('c_date').addEventListener('input', fit);
  window.addPair = function(name){
    const wrap=document.createElement('div'); wrap.className='pair';
    wrap.innerHTML='<button class="rm" title="הסר">✕</button>'+
      '<div class="names" contenteditable="true" data-ph="השם"></div>';
    const nd=wrap.querySelector('.names');
    if(name) nd.innerHTML=formatLines(name);
    wireFmt(nd);
    wrap.querySelector('.rm').onclick=()=>{ wrap.remove(); fit(); };
    wire(wrap); $('pairs').appendChild(wrap); fit();
  };
  addPair(q.get('names')||'');
  $('addBtn').onclick=()=>addPair('');
}

window.addEventListener('resize', fit);
window.addEventListener('load', fit);            // אחרי טעינת רקע הבלאנק
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit).then(()=>setTimeout(fit,60));  // אחרי טעינת הגופן (מונע חיתוך למעלה)
fit();
</script>
</body>
</html>
