<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כולל חצות — טיפול והתאמת תרומות</title>
<style>
  :root{--bg:#f4f1e8;--card:#fff;--ink:#221c12;--muted:#8a7f66;--line:#e5ddc9;--gold:#9c7a2e;--gold-soft:#f3ecd8;--accent:#3b2f5e;--yes:#1b7a3d;--no:#b5321f}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Arial,sans-serif;padding:12px;max-width:820px;margin:0 auto}
  h1{font-size:1.25rem;margin:6px 0}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:10px}
  .bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--line)}
  .prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .prog>i{display:block;height:100%;background:var(--yes);width:0;transition:width .3s}
  .filters{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
  .filters button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:700;cursor:pointer}
  .filters button.on{background:var(--accent);color:#fff;border-color:transparent}
  .grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:11px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .grp.done{opacity:.55}
  .gname{font-weight:800;font-size:1.05rem;direction:ltr;text-align:right}
  .gsum{color:var(--muted);font-size:.85rem;margin-top:2px}
  .match{margin:8px 0;padding:8px 10px;border-radius:10px;font-size:.9rem}
  .match.ok{background:#eaf6ee;border:1px solid #bfe3c9}
  .match.no{background:#fdeee9;border:1px solid #f2c9bc}
  .match .cardlink{color:var(--accent);text-decoration:underline;font-weight:800}
  .dupwarn{background:#fff4d6;border:1px solid #e6c65c;color:#8a6a00;border-radius:8px;padding:6px 9px;margin-top:8px;font-size:.82rem;font-weight:700;clear:both}
  .dupok{background:#eaf6ee;border:1px solid #bfe3c9;color:#1e6b3a;border-radius:8px;padding:6px 9px;margin-top:8px;font-size:.82rem;font-weight:700;clear:both}
  .missbox{background:#fdeee9;border:1px solid #f2b8a6;color:#a3341a;border-radius:8px;padding:7px 10px;margin:8px 0;font-size:.85rem;font-weight:700}
  .match .inlineedit{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;clear:both}
  .match .inlineedit label{font-size:.8rem;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
  .match .inlineedit select{padding:6px 9px;border:1px solid var(--gold);border-radius:8px;font-family:inherit;font-size:.85rem;background:#fff;color:var(--ink);font-weight:700}
  .fld{display:block;margin:7px 0}
  .fld span{display:block;font-size:.78rem;color:var(--muted);margin-bottom:3px;font-weight:700}
  .fld input,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-family:inherit;font-size:.92rem}
  .two{display:flex;gap:8px}.two>*{flex:1}
  .addrbox{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:9px;padding:8px 10px;font-size:.84rem;margin:7px 0;direction:ltr;text-align:right}
  .kvbox{background:#f4f1ff;border:1px solid #b9a9f0;border-radius:9px;padding:9px 11px;font-size:.86rem;margin:7px 0}
  .notebox{background:var(--card);border:1px dashed var(--line);border-radius:9px;padding:8px 11px;margin:7px 0}
  .notebox .rnote{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:.9rem;background:#fff;color:var(--ink);box-sizing:border-box}
  .kvbox textarea{width:100%;margin-top:6px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:.88rem;background:#fff;color:var(--ink);line-height:1.5}
  .addrbox b{color:var(--gold)}
  .chk{display:flex;align-items:center;gap:7px;font-size:.86rem;margin:6px 0;cursor:pointer}
  .txn{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
  .rowdel{background:none;border:none;color:#c9b8b8;font-size:1rem;cursor:pointer;padding:2px 6px;line-height:1}
  .rowdel:hover,.rowdel.armed{color:var(--no)}
  .rowdel.armed{font-size:.78rem;font-weight:700}
  .grpdel{display:block;width:100%;margin-top:8px;background:none;border:1px dashed var(--line);color:var(--muted);
    border-radius:9px;padding:8px;font-family:inherit;font-size:.8rem;cursor:pointer}
  .grpdel.armed{border-color:var(--no);color:var(--no);font-weight:700}
  .amt{font-weight:800;font-size:1rem;min-width:74px}
  .date{color:var(--muted);font-size:.8rem}
  .rec{background:#ede7fb;color:#5b3ea8;border-radius:6px;padding:1px 7px;font-size:.72rem;font-weight:800}
  .txn.failed{opacity:.75}
  .txn.failed .amt{text-decoration:line-through;color:var(--muted)}
  .failbadge{background:#fdeee9;color:var(--no);border:1px solid #f2c9bc;border-radius:6px;padding:2px 8px;font-size:.72rem;font-weight:800;white-space:nowrap}
  .py{background:#fff3e0;color:#b5641a;border-radius:6px;padding:1px 7px;font-size:.72rem;font-weight:800}
  .txn select{flex:1;min-width:120px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:.85rem}
  .btn{border:none;border-radius:10px;padding:10px 16px;font-weight:800;font-size:.92rem;cursor:pointer;font-family:inherit}
  .btn.go{background:var(--accent);color:#fff;width:100%;margin-top:10px}
  .btn.sm{padding:7px 12px;font-size:.82rem}
  .btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
  .res{border:1px solid var(--line);border-radius:9px;margin-top:5px;max-height:180px;overflow:auto}
  .res div{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.88rem}
  .res div:hover{background:var(--gold-soft)}
  .pick{background:#eaf6ee;border:1px solid #bfe3c9;border-radius:9px;padding:7px 10px;font-size:.88rem;margin-top:5px}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;font-weight:700;z-index:20}
  .toast.show{opacity:1}
  .done-msg{text-align:center;padding:30px;color:var(--yes);font-weight:800;font-size:1.1rem}
  .pypick select{flex:1;padding:7px 8px;border:1px solid var(--gold);border-radius:8px;font-family:inherit;font-size:.85rem;background:#fff}
</style>
</head>
<body>
<h1>💳 טיפול והתאמת תרומות — אוטרייז ובנק ווסט (ינואר–אוגוסט 2026)</h1>
<div class="sub">לכל תורם: אשר עבור מה תרם, השלם שם עברי / צור כרטיס, ובחר אם לעדכן כתובת. תרומת $480 = פרנס לילה. הוראות קבע מסומנות.<br>בפרנס — אפשר לכתוב מיד את השמות; היום ישובץ ב<a href="/" target="_blank" rel="noopener" style="color:var(--accent);font-weight:800">🌙 לוח פרנס יום</a>.</div>
<div style="margin:0 0 10px"><button id="mailsync" style="width:100%;padding:10px;border:1px dashed var(--accent);background:#fff;color:var(--accent);border-radius:10px;font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer">📥 משוך מיילים מהתיבה ותייק אצל התורמים</button></div>
<div class="bar">
  <div class="prog"><i id="pbar"></i></div>
  <div class="sub" id="pcount" style="margin:5px 0 0"></div>
  <div class="filters">
    <button data-f="pending" class="on">🕒 לטיפול</button>
    <button data-f="nomatch">❓ בלי כרטיס</button>
    <button data-f="failed">🔴 לא עברו</button>
    <button data-f="all">הכל</button>
    <button data-f="done">✓ טופלו</button>
  </div>
</div>
<div id="list"></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let DATA = [], FILT = 'pending', CAMPAIGNS = [], BUILDING_ITEMS = [];
const CATS = ['','קבוע','יששכר־זבולון','פרנס לילה','חדר קפה','ארוחת בוקר','נר למאור','קוויטל','מזדמן','חד-פעמי','בניין'];
const isBldg=c=>/בנין|בניין/.test(c||'');
// שינוי קוויטל/קטגוריה של התורם ישירות מכאן — בלי להיכנס לכרטיס
const TIEROPTS = [['','— בלי קוויטל —'],['יששכר_זבולון','יששכר־זבולון'],['קוויטל_101','כל לילה'],['קוויטל_שבועי','שבועי']];
const DCATS = ['','קבוע','מזדמן','פרנס יום','בניין/הקדשה','חד-פעמי'];
// קוויטל — כולל "מזדמנים" (קטגוריה=מזדמן בלי דרגה). כשבוחרים אותו נשאל חודש/שנה
function tierOpts(sel,cat){const isOcc=!(sel||'')&&cat==='מזדמן';return TIEROPTS.map(([v,l])=>`<option value="${esc(v)}" ${(v===(sel||'')&&!isOcc)?'selected':''}>${l}</option>`).join('')+`<option value="__occ" ${isOcc?'selected':''}>מזדמנים</option>`;}
// בורר פרנס — חודש/יום/שנה עבריים
const HMORD=['תשרי','חשון','כסלו','טבת','שבט','אדר','ניסן','אייר','סיון','תמוז','אב','אלול'];
function heYearOpts(sel){let ys=['תשפ"ד','תשפ"ה','תשפ"ו','תשפ"ז','תשפ"ח','תשפ"ט','תש"צ'];if(sel&&!ys.includes(sel))ys.unshift(sel);return ys.map(y=>`<option ${y===sel?'selected':''}>${y}</option>`).join('');}
// סוגי משימה — אותה רשימה גם בכרטיס התורם
const WHOOPTS=[['','👤 מאיר (אני)'],['אהרן','👤 אהרן']];
const TASKKINDS=[['followup','📞 להתקשר אליו'],['email','📧 לשלוח אימייל / וואטסאפ'],['verify','💰 לבדוק שנגבה'],['card','💳 לבדוק כרטיס'],['charge','🧾 לחייב'],['other','🔔 אחר']];
const HYEARS=['תשפ"ה','תשפ"ו','תשפ"ז','תשפ"ח'];
const HEBYEAR='תשפ"ו';
// מודאל בחירת חודש+שנה עברית (לשיוך תורם מזדמן)
function pickMonthYear(curM,curY){return new Promise(res=>{
  const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999';
  o.innerHTML=`<div style="background:var(--card,#fff);padding:18px;border-radius:14px;max-width:340px;width:88%;box-shadow:0 10px 40px rgba(0,0,0,.3)"><div style="font-weight:700;margin-bottom:10px">לאיזה חודש ושנה עברית לשייך את הקוויטל של התורם המזדמן?</div>
    <div style="display:flex;gap:8px"><select class="pmM" style="flex:1;padding:10px;font-size:1.05rem">${HMORD.map(m=>`<option ${m===curM?'selected':''}>${m}</option>`).join('')}</select>
      <select class="pmY" style="flex:1;padding:10px;font-size:1.05rem">${HYEARS.map(y=>`<option ${y===(curY||HEBYEAR)?'selected':''}>${y}</option>`).join('')}</select></div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="pmC" style="flex:1;padding:10px;border:1px solid var(--line,#ccc);border-radius:8px;background:#eee">ביטול</button><button class="pmOK" style="flex:1;padding:10px;border:none;border-radius:8px;background:var(--brand,#4a3f9e);color:#fff;font-weight:700">אישור</button></div></div>`;
  document.body.appendChild(o);
  const done=v=>{o.remove();res(v);};
  o.querySelector('.pmC').onclick=()=>done(null);
  o.querySelector('.pmOK').onclick=()=>done({month:o.querySelector('.pmM').value,year:o.querySelector('.pmY').value});
  o.onclick=e=>{if(e.target===o)done(null);};
});}
function heDay(n){const ones=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],tens=['','י','כ','ל'];let s;if(n===15)s='טו';else if(n===16)s='טז';else s=(tens[Math.floor(n/10)]||'')+(ones[n%10]||'');return s.length<=1?s+"'":s.slice(0,-1)+'"'+s.slice(-1);}
const PARNES_CATS=['פרנס לילה','חדר קפה','ארוחת בוקר'];
function dcatOpts(sel){return DCATS.map(c=>`<option value="${esc(c)}" ${c===(sel||'')?'selected':''}>${c||'— קטגוריה —'}</option>`).join('');}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400);}
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json();}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const TODAY=new Date().toISOString().slice(0,10);
function norm(s){return (s||'').toLowerCase().replace(/\s+/g,' ').trim();}
const MONIDX={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const HEMON=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function txMonth(d){const m=/^(\d{2})-([A-Za-z]{3})-(\d{4})/.exec(d||'');return m?MONIDX[m[2]]:null;}
// זיהוי חודשים חסרים בהוראת קבע — לכל סכום קבוע שחוזר, איתור פערים בין החודש הראשון לאחרון
// נוכחות נספרת מכל חיוב באותו סכום (גם חד־פעמי) — כך שחודש ששולם בתאריך אחר לא נחשב חסר
function missingMonths(txs){
  const settled=txs.filter(t=>!t.status||t.status==='settled');
  const recAmts={};
  settled.filter(t=>t.recurring).forEach(t=>{const a=Math.round(parseFloat(t.amount||0));const mi=txMonth(t.date);if(mi==null||!a)return;(recAmts[a]=recAmts[a]||new Set()).add(mi);});
  const out=[];
  Object.keys(recAmts).forEach(amt=>{
    if(recAmts[amt].size<2) return;
    const present=new Set();
    settled.forEach(t=>{if(Math.round(parseFloat(t.amount||0))==+amt){const mi=txMonth(t.date);if(mi!=null)present.add(mi);}});
    const arr=[...recAmts[amt]].sort((a,b)=>a-b), lo=arr[0], hi=arr[arr.length-1], miss=[];
    for(let m=lo;m<=hi;m++) if(!present.has(m)) miss.push(m);
    if(miss.length) out.push({amt:+amt, miss});
  });
  return out;
}

// סינון לפי מקור (משבצת נפרדת לכל שיטת תשלום)
const SRC = new URLSearchParams(location.search).get('src') || '';
function srcGroup(s){ s=(s||'').toLowerCase();
  if(s.includes('authorize')) return 'authorize';
  if(s.includes('banquest')||s.includes('ווסט')) return 'banquest';
  if(s.includes('check')||s.includes('צ׳ק')||s.includes("צ'ק")) return 'checks';
  if(s.includes('zelle')||s.includes('transfer')||s.includes('ach')||s.includes('העבר')||s.includes('זל')) return 'transfers';
  if(s.includes('donors')||s.includes('ojc')) return 'donorsfund';
  return 'other'; }
const SRCLABEL={authorize:'אוטרייז',banquest:'בנק ווסט',checks:'צ׳קים',transfers:'העברות בנקאיות וזל',donorsfund:'דונרס פאנד / OJC'};

// שמירת מיקום העבודה — כדי לחזור לאותה נקודה אחרי כניסה לכרטיס תורם וחזרה
const PKEY='recpos_'+(SRC||'all'), FKEY='recfilt_'+(SRC||'all');
try{const sf=sessionStorage.getItem(FKEY); if(sf)FILT=sf;}catch(e){}
let didRestore=false;
function savePos(k){try{sessionStorage.setItem(PKEY,JSON.stringify({y:window.scrollY,k:k||null}));}catch(e){}}
window.addEventListener('scroll',()=>{clearTimeout(savePos._t);savePos._t=setTimeout(()=>savePos(null),200);},{passive:true});
function restorePos(){try{const raw=sessionStorage.getItem(PKEY);if(!raw)return;const p=JSON.parse(raw);
  if(p.k){const g=document.querySelector('.grp[data-k="'+(window.CSS&&CSS.escape?CSS.escape(p.k):p.k)+'"]');if(g){g.scrollIntoView({block:'center'});return;}}
  if(p.y)window.scrollTo(0,p.y);}catch(e){}}

let KVDEF=['',''];
async function load(){ [DATA, CAMPAIGNS, BUILDING_ITEMS] = await Promise.all([api('GET','/api/recon'), api('GET','/api/campaigns'), api('GET','/api/building_items')]);
  try{const meta=await api('GET','/api/data'); KVDEF=meta.kv_default||['','']; }catch(e){}
  if(SRC){ DATA=DATA.filter(x=>srcGroup(x.source)===SRC); const h=document.querySelector('h1'); if(h&&SRCLABEL[SRC]) h.textContent='💳 טיפול והתאמת תרומות — '+SRCLABEL[SRC]; }
  render(); }

function groupKey(x){ return norm(x.first+' '+x.last); }

function render(){
  const total = DATA.length, done = DATA.filter(x=>x.processed).length;
  $('#pbar').style.width = total? (done/total*100)+'%':'0';
  $('#pcount').textContent = `${done} / ${total} טופלו`;
  // group by person
  const groups = {};
  DATA.forEach(x=>{ const k=groupKey(x); (groups[k]=groups[k]||[]).push(x); });
  let entries = Object.entries(groups);
  entries = entries.filter(([k,txs])=>{
    const allDone = txs.every(t=>t.processed);
    const matched = txs.some(t=>t.donor_id);
    const hasFailed = txs.some(t=>t.status && t.status!=='settled');
    const hasSettled = txs.some(t=>!t.status || t.status==='settled');
    if(FILT==='pending') return !allDone && hasSettled;   // רק מי שיש לו עסקה שעברה וטרם טופלה
    if(FILT==='done') return allDone;
    if(FILT==='nomatch') return !matched && !allDone && hasSettled;
    if(FILT==='failed') return hasFailed;
    return true;
  });
  entries.sort((a,b)=>a[0].localeCompare(b[0]));
  document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('on',b.dataset.f===FILT));
  const list = $('#list');
  if(!entries.length){ list.innerHTML='<div class="done-msg">🎉 אין פריטים בקטגוריה הזו</div>'; return; }
  list.innerHTML = entries.map(([k,txs])=>groupCard(k,txs)).join('') + `<datalist id="bldgdl">${BUILDING_ITEMS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
  entries.forEach(([k,txs])=>wireGroup(k,txs));
  if(!didRestore){ didRestore=true; requestAnimationFrame(restorePos); }
}

function groupCard(k,txs){
  const t0=txs[0], allDone=txs.every(t=>t.processed);
  const matched = txs.find(t=>t.donor_id);
  const siteAddr = [t0.addr,t0.city,t0.state,t0.zip].filter(Boolean).join(', ');
  const settled = txs.filter(t=>!t.status||t.status==='settled');
  const failedN = txs.length - settled.length;
  const total = settled.reduce((s,t)=>s+parseFloat(t.amount||0),0);
  let head = `<div class="gname">${esc((t0.first+' '+t0.last).trim())}</div>
    <div class="gsum">${settled.length} עברו · סה"כ $${total.toFixed(2)}${failedN?(' · <span style="color:var(--no)">'+failedN+' לא עברו</span>'):''}${t0.email?(' · '+esc(t0.email)):''}</div>`;
  const miss=missingMonths(txs);
  const missHtml=miss.length?('<div class="missbox">'+miss.map(x=>`🔴 הוראת קבע $${x.amt} — כנראה לא עברה בחודשים: <b>${x.miss.map(m=>HEMON[m]).join(', ')}</b>`).join('<br>')+'</div>'):'';
  let matchHtml;
  if(matched){
    const srcM=/Banquest|ווסט/.test(txs[0].source||'')?'בנק ווסט':'Authorize';
    let dupWarn='';
    if(matched.match_summary>0) dupWarn+=`<div class="dupok">✓ יש ${matched.match_summary} תרומות סיכום ${srcM} בכרטיס — יוחלפו אוטומטית בייבוא (ללא כפילות)</div>`;
    if(matched.match_summary_other>0) dupWarn+=`<div class="dupwarn">⚠️ יש גם ${matched.match_summary_other} תרומות סיכום בשיטה אחרת — נשמרות. ודא שאינן אותו כסף</div>`;
    matchHtml=`<div class="match ok" data-did="${matched.donor_id}">✓ מותאם לכרטיס: <a class="cardlink" href="/?donor=${matched.donor_id}" target="_blank" rel="noopener"><b>${esc(matched.match_name||'')}</b> ↗</a>
      <button class="btn sm ghost changebtn" style="float:left;padding:3px 9px">🔄 שנה תורם</button>
      ${dupWarn}
      <div class="inlineedit">
        <label>🕯️ קוויטל:<select class="mtier">${tierOpts(matched.match_tier||'',matched.match_cat||'')}</select></label>
        <label>📋 קטגוריה:<select class="mcat">${dcatOpts(matched.match_cat||'')}</select></label>
        ${(!(matched.match_tier||'')&&(matched.match_cat||'')==='מזדמן')?`<label>🗓️ חודש:<button type="button" class="btn sm ghost kvmy" style="padding:5px 10px">${esc((matched.match_kv_month||'— בחר —')+' '+(matched.match_kv_year||''))}</button></label>`:''}
      </div></div>`;
  }else{
    matchHtml=`<div class="match no">❓ לא נמצא כרטיס תואם — חפש קיים או צור חדש</div>`;
  }
  const assign=`<div class="assign" data-k="${esc(k)}" ${matched?'style="display:none"':''}>
      <label class="fld"><span>חפש תורם קיים</span><input class="dsearch" placeholder="שם בעברית/אנגלית…" autocomplete="off"></label>
      <div class="res" style="display:none"></div>
      <div class="pick" style="display:none"></div>
      <div style="text-align:center;color:var(--muted);font-size:.8rem;margin:6px 0">— או —</div>
      <div class="two"><label class="fld"><span>שם משפחה (עברית) *</span><input class="nl" placeholder="שם משפחה" value="${esc(t0.sugg_last||'')}"></label>
        <label class="fld"><span>שם פרטי (עברית)</span><input class="nf" placeholder="שם פרטי" value="${esc(t0.sugg_first||'')}"></label></div>
      ${(t0.sugg_last||t0.sugg_first)?`<div class="sub" style="font-size:.75rem;color:var(--gold)">✍️ הצעת איות אוטומטית — בדוק ותקן אם צריך</div>`:''}
      <div class="two"><label class="fld"><span>📋 סוג התורם</span><select class="ncat">${DCATS.map(c=>`<option value="${esc(c)}" ${c==='מזדמן'?'selected':''}>${c||'— בחר —'}</option>`).join('')}</select></label>
        <label class="fld"><span>🕯️ דרגת קוויטל</span><select class="ntier">${TIEROPTS.map(([v,l])=>`<option value="${esc(v)}">${l}</option>`).join('')}<option value="__occ" selected>מזדמנים</option></select></label></div>
      <div class="tierhint" style="display:none;color:var(--no);font-size:.78rem;font-weight:700;margin:-2px 0 4px">↑ בחר איזו דרגה קבועה: יששכר־זבולון / כל לילה / שבועי</div>
      <div class="two nkvmy"><label class="fld"><span>🗓️ חודש (מזדמנים)</span><select class="nkvm">${HMORD.map(m=>`<option ${m===KVDEF[0]?'selected':''}>${m}</option>`).join('')}</select></label>
        <label class="fld"><span>שנה עברית</span><select class="nkvy">${heYearOpts(KVDEF[1])}</select></label></div>
      <label class="fld"><span>📝 הערות (למשל: הגיע דרך אבא קלוק) — ניתן לחיפוש</span><input class="nn" placeholder="דרך מי הגיע / כל הערה שתרצה למצוא אחר כך"></label>

      <div class="sub" style="font-size:.78rem">ייווצר כרטיס חדש עם השם האנגלי, הטלפון, האימייל והכתובת מהאתר.</div>
    </div>`;
  const kvHtml = t0.kv_names ? `<div class="kvbox">🕯️ <b>שמות לקוויטל שנשלחו מהאתר:</b>
      <textarea class="kvtext" rows="${Math.min(6,t0.kv_names.split('\n').length+1)}">${esc(t0.kv_names)}</textarea>
      <label class="chk"><input type="checkbox" class="kvadd" checked> צרף את השמות לקוויטל של התורם</label></div>` : '';
  const noteHtml=`<div class="notebox"><label class="fld"><span>📝 הערה לתרומה הזו (למשל: קרן מיוחדת שנתרמה דרך הבנק שבו היא עובדת)</span>
      <input class="rnote" placeholder="מה מיוחד בתרומה הזו — יישמר אצל התורם"></label>
      <label class="chk"><input type="checkbox" class="rnotedon" checked> שמור גם בהערות התורם (כדי שאפשר יהיה לחפש)</label>
      <div class="two" style="margin-top:6px"><label class="fld"><span>✅ משימה (למשל: לבדוק מתי היא צריכה לשלם בפעם הבאה)</span><input class="rtask" placeholder="מה צריך לעשות — ייכנס ללשונית משימות"></label>
        <label class="fld"><span>מתי להזכיר</span><input type="date" class="rtaskd" value="${TODAY}"></label></div>
      <div class="two"><label class="fld"><span>סוג המשימה</span><select class="rtaskk">${TASKKINDS.map(([v,l])=>`<option value="${esc(v)}">${l}</option>`).join('')}</select></label>
        <label class="fld"><span>👤 מי מטפל</span><select class="rtaskw">${WHOOPTS.map(([v,l])=>`<option value="${esc(v)}">${l}</option>`).join('')}</select></label></div></div>`;
  let addrHtml='';
  if(siteAddr){
    const stored = matched? (matched.match_addr||'') : '';
    const diff = stored && norm(stored)!==norm(siteAddr);
    addrHtml=`<div class="addrbox"><b>כתובת מהאתר:</b> ${esc(siteAddr)}${t0.phone?('<br><b>טלפון:</b> '+esc(t0.phone)):''}
      ${stored?`<br><b>בכרטיס:</b> ${esc(stored)}`:''}</div>
      ${(!stored||diff)?`<label class="chk"><input type="checkbox" class="upaddr" ${!stored?'checked':''}> עדכן/הוסף את הכתובת מהאתר לכרטיס</label>`:''}`;
  }
  const rows = txs.map(t=>{
    const amt=parseFloat(t.amount||0), is480=amt===480;
    const failed = t.status && t.status!=='settled';
    const cur=t.category||'';
    let opts=CATS.map(c=>`<option value="${esc(c)}" ${c===cur?'selected':''}>${c||'— עבור מה? —'}</option>`).join('');
    if(CAMPAIGNS.length) opts+='<optgroup label="🎯 מגביות/ייעודים">'+CAMPAIGNS.map(c=>`<option value="${esc(c)}" ${c===cur?'selected':''}>${esc(c)}</option>`).join('')+'</optgroup>';
    opts+=`<option value="__new__">➕ עבור מה חדש… (טקסט חופשי)</option>`;
    const STLBL={declined:'🔴 נדחה — לא עבר',error:'🔴 שגיאה — לא עבר',voided:'🔴 בוטל — לא עבר',refund:'↩️ הוחזר'};
    const stlbl = STLBL[t.status]||'🔴 לא עבר';
    return `<div class="txn ${failed?'failed':''}" data-tid="${esc(t.tid)}">
      <span class="amt">$${amt.toFixed(2)}</span><span class="date">${esc(t.date)}</span>
      ${t.recurring?'<span class="rec">הוראת קבע</span>':''}${is480&&!failed?'<span class="py">פרנס לילה</span>':''}
      ${failed?`<span class="failbadge">${stlbl}</span>`:(t.processed?'<span style="color:var(--yes);font-weight:800">✓ טופל</span>':`<select class="cat">${opts}</select><input class="newcat" placeholder="עבור מה? (למשל מתנות לאביונים תשפ״ו)" style="display:none;width:100%;margin-top:5px;padding:7px 9px;border:1px solid var(--gold);border-radius:8px;font-family:inherit"><input class="bldgitem" list="bldgdl" placeholder="🏗️ מה תרם בבניין? (שולחן/עמוד/מטר…)" style="display:${isBldg(cur)?'block':'none'};width:100%;margin-top:5px;padding:7px 9px;border:1px solid var(--gold);border-radius:8px;font-family:inherit">`)}
      ${(!failed&&!t.processed)?(()=>{const show=is480||PARNES_CATS.includes(t.category||'');return `<div class="pypick" style="display:${show?'flex':'none'};gap:6px;width:100%;margin-top:5px">
        <select class="pymon">${HMORD.map(m=>`<option>${m}</option>`).join('')}</select>
        <select class="pyday">${Array.from({length:30},(_,i)=>`<option value="${i+1}">${heDay(i+1)}</option>`).join('')}</select>
        <select class="pyyr">${HYEARS.map(y=>`<option ${y==='תשפ"ו'?'selected':''}>${y}</option>`).join('')}</select></div>
      <input class="pyded" placeholder="🕯️ שמות/בקשות לפרנס (רשות)" style="display:${show?'block':'none'};width:100%;margin-top:5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit">`;})():''}
      <button class="rowdel" title="מחק את השורה הזו מדף החיובים">🗑</button>
    </div>`;
  }).join('');
  return `<div class="grp ${allDone?'done':''}" data-k="${esc(k)}">
    ${head}${missHtml}${matchHtml}${assign}${kvHtml}${addrHtml}${noteHtml}${rows}
    ${allDone?'':`<button class="btn go">✓ הכנס את כל התרומות של ${esc((t0.first+' '+t0.last).trim())}</button>`}
    <button class="grpdel">🗑 מחק את ${esc((t0.first+' '+t0.last).trim())} מדף החיובים (ניסיון תרומה / כפילות)</button>
  </div>`;
}

function wireGroup(k,txs){
  const card=[...document.querySelectorAll('.grp')].find(el=>el.dataset.k===k);
  if(!card) return;
  const state={donorId:(txs.find(t=>t.donor_id)||{}).donor_id||null, createNew:false, nl:'', nf:''};
  // מחיקת שורת חיוב / כל השורות של אותו שם — לניסיונות תרומה וכפילויות. שתי לחיצות לאישור
  const arm=(btn,label,run)=>{let ok=false,tm=null;const back=btn.innerHTML;
    btn.onclick=async()=>{
      if(!ok){ok=true;btn.classList.add('armed');btn.innerHTML=label;
        tm=setTimeout(()=>{ok=false;btn.classList.remove('armed');btn.innerHTML=back;},12000);return;}
      clearTimeout(tm);btn.disabled=true;await run();};};
  card.querySelectorAll('.txn').forEach(row=>{
    const b=row.querySelector('.rowdel'); if(!b) return;
    arm(b,'בטוח? לחץ שוב',async()=>{
      const tid=row.dataset.tid;
      const r=await api('DELETE','/api/recon/'+encodeURIComponent(tid));
      if(!r||!r.ok){b.disabled=false;b.classList.remove('armed');b.innerHTML='🗑';toast('המחיקה נכשלה');return;}
      DATA=DATA.filter(x=>x.tid!==tid); toast('השורה נמחקה ✓'); render();});
  });
  const gd=card.querySelector('.grpdel');
  if(gd) arm(gd,'⚠️ בטוח? לחץ שוב כדי למחוק '+txs.length+' שורות',async()=>{
    for(const t of txs) await api('DELETE','/api/recon/'+encodeURIComponent(t.tid));
    const gone=new Set(txs.map(t=>t.tid));
    DATA=DATA.filter(x=>!gone.has(x.tid)); toast('נמחק מדף החיובים ✓'); render();});
  const chb=card.querySelector('.changebtn');
  if(chb) chb.onclick=()=>{ const a=card.querySelector('.assign'); a.style.display = a.style.display==='none'?'block':'none'; };
  // בכניסה לכרטיס תורם — שמור את המיקום הנוכחי כדי לחזור לאותה נקודה
  const clink=card.querySelector('.cardlink'); if(clink) clink.addEventListener('click',()=>savePos(k));
  // שינוי קוויטל/קטגוריה של התורם ישירות בשורת ההתאמה
  const did=(txs.find(t=>t.donor_id)||{}).donor_id;
  const mt=card.querySelector('.mtier'), mc=card.querySelector('.mcat');
  if(mt&&did) mt.onchange=async()=>{
    if(mt.value==='__occ'){
      const cur=DATA.find(x=>x.donor_id==did)||{};
      const pick=await pickMonthYear(cur.match_kv_month||KVDEF[0]||'תשרי',cur.match_kv_year||KVDEF[1]||HEBYEAR);
      if(!pick){ mt.value=cur.match_tier||''; return; }
      await api('PUT','/api/donor/'+did,{category:'מזדמן',tier:'',kv_month:pick.month,kv_year:pick.year});
      DATA.forEach(x=>{if(x.donor_id==did){x.match_cat='מזדמן';x.match_tier='';x.match_kv_month=pick.month;x.match_kv_year=pick.year;}});
      if(mc)mc.value='מזדמן';
      toast('שויך למזדמנים · '+pick.month+' '+pick.year+' ✓'); return;
    }
    await api('PUT','/api/donor/'+did,{tier:mt.value}); DATA.forEach(x=>{if(x.donor_id==did)x.match_tier=mt.value;}); toast('קוויטל עודכן בכרטיס ✓'); };
  const kvbtn=card.querySelector('.kvmy');
  if(kvbtn&&did) kvbtn.onclick=async()=>{
    const cur=DATA.find(x=>x.donor_id==did)||{};
    const pick=await pickMonthYear(cur.match_kv_month||KVDEF[0]||'תשרי',cur.match_kv_year||KVDEF[1]||HEBYEAR);
    if(!pick)return;
    await api('PUT','/api/donor/'+did,{category:'מזדמן',tier:'',kv_month:pick.month,kv_year:pick.year});
    DATA.forEach(x=>{if(x.donor_id==did){x.match_kv_month=pick.month;x.match_kv_year=pick.year;}});
    kvbtn.textContent=pick.month+' '+pick.year;
    toast('קוויטל מזדמנים · '+pick.month+' '+pick.year+' ✓');
  };
  if(mc&&did) mc.onchange=async()=>{ await api('PUT','/api/donor/'+did,{category:mc.value}); DATA.forEach(x=>{if(x.donor_id==did)x.match_cat=mc.value;}); toast('קטגוריה עודכנה בכרטיס ✓'); };
  const assign=card.querySelector('.assign');
  if(assign){
    const si=assign.querySelector('.dsearch'), res=assign.querySelector('.res'), pick=assign.querySelector('.pick');
    let tmr;
    si.oninput=()=>{clearTimeout(tmr);tmr=setTimeout(async()=>{
      const q=si.value.trim(); if(q.length<2){res.style.display='none';return;}
      const r=await api('GET','/api/pubsearch?q='+encodeURIComponent(q));
      res.style.display='block';
      res.innerHTML=r.map(d=>`<div data-id="${d.id}">${esc(d.last)} ${esc(d.first||'')}</div>`).join('')||'<div style="color:var(--muted)">אין תוצאות — צור חדש למטה</div>';
      res.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{
        state.donorId=+x.dataset.id; state.createNew=false;
        pick.style.display='block'; pick.innerHTML='✓ נבחר: <b>'+x.textContent+'</b>';
        res.style.display='none'; si.value=x.textContent;
      });
    },250);};
    const nl=assign.querySelector('.nl'), nf=assign.querySelector('.nf'), nn=assign.querySelector('.nn');
    const ncat=assign.querySelector('.ncat'), ntier=assign.querySelector('.ntier');
    const nkvm=assign.querySelector('.nkvm'), nkvy=assign.querySelector('.nkvy'), nkvmy=assign.querySelector('.nkvmy');
    if(nl.value.trim()){ state.nl=nl.value.trim(); state.nf=nf.value.trim(); }   // הצעת האיות מוכנה מראש
    // מזדמן -> הקוויטל מזדמן אוטומטית, לחודש הנוכחי (ומכ' בחודש — לחודש הבא)
    const syncKv=()=>{
      const cat=ncat?ncat.value:'';
      if(ntier){
        if(cat==='מזדמן' && ntier.value!=='__occ') ntier.value='__occ';          // מזדמן → קוויטל מזדמנים
        else if(cat==='קבוע' && ntier.value==='__occ') ntier.value='';           // קבוע → בחר דרגה קבועה
      }
      const occ = ntier && ntier.value==='__occ';
      if(nkvmy) nkvmy.style.display=occ?'flex':'none';
      // קבוע בלי דרגה — מדגישים שצריך לבחור איזו דרגה קבועה
      const need = (cat==='קבוע' && ntier && !ntier.value);
      if(ntier) ntier.style.borderColor = need ? 'var(--no)' : '';
      const hint=assign.querySelector('.tierhint');
      if(hint) hint.style.display = need ? 'block' : 'none';
      grab();
    };
    const grab=()=>{ state.nn=nn?nn.value.trim():'';
      state.ncat=ncat?ncat.value:''; state.ntier=ntier?ntier.value:'';
      state.nkvm=nkvm?nkvm.value:''; state.nkvy=nkvy?nkvy.value:'';
      if(nl.value.trim()){ state.createNew=true; state.donorId=null; state.nl=nl.value.trim(); state.nf=nf.value.trim(); pick.style.display='none'; } };
    [nl,nf,nn].forEach(inp=>inp&&(inp.oninput=grab));
    [nkvm,nkvy].forEach(el=>el&&(el.onchange=grab));
    if(ncat)ncat.onchange=syncKv; if(ntier)ntier.onchange=syncKv;
    syncKv();
  }
  // הצגת שדה שמות פרנס כשבוחרים קטגוריית פרנס
  card.querySelectorAll('.txn').forEach(txEl=>{const sel=txEl.querySelector('.cat'),ded=txEl.querySelector('.pyded'),pick=txEl.querySelector('.pypick'),nc=txEl.querySelector('.newcat'),bl=txEl.querySelector('.bldgitem');
    const toggleBldg=v=>{if(bl)bl.style.display=isBldg(v)?'block':'none';};
    if(sel)sel.addEventListener('change',()=>{const isNew=sel.value==='__new__';if(nc){nc.style.display=isNew?'block':'none';if(isNew)nc.focus();}const on=PARNES_CATS.includes(sel.value);if(ded)ded.style.display=on?'block':'none';if(pick)pick.style.display=on?'flex':'none';toggleBldg(isNew?(nc?nc.value:''):sel.value);});
    if(nc)nc.addEventListener('input',()=>toggleBldg(nc.value));   // כשמקלידים קטגוריית בניין חופשית
  });
  const btn=card.querySelector('.btn.go'); if(!btn) return;
  btn.onclick=async()=>{
    if(!state.donorId && !state.createNew){ toast('בחר תורם קיים או מלא שם משפחה לכרטיס חדש'); return; }
    let upaddr = card.querySelector('.upaddr'); upaddr = upaddr? upaddr.checked : false;
    const kvText = card.querySelector('.kvtext'); const kvChk = card.querySelector('.kvadd');
    let kvAdd = kvChk ? kvChk.checked : false;
    const rnote = card.querySelector('.rnote'), rnoteDon = card.querySelector('.rnotedon');
    const rtask = card.querySelector('.rtask'), rtaskd = card.querySelector('.rtaskd'), rtaskk = card.querySelector('.rtaskk'), rtaskw = card.querySelector('.rtaskw');
    let taskDone = false;
    const catSels=[...card.querySelectorAll('.txn')];
    btn.disabled=true; btn.textContent='מכניס…';
    let donorId=state.donorId;
    for(const txEl of catSels){
      const tid=txEl.dataset.tid;
      if(txEl.classList.contains('failed')){ await api('POST','/api/recon/'+tid,{skip:true}); continue; }  // לא עבר — לא מייבאים
      const sel=txEl.querySelector('.cat'); if(!sel) continue;
      let catVal=sel.value;
      if(catVal==='__new__'){
        const nc=txEl.querySelector('.newcat'); catVal=nc?nc.value.trim():'';
        if(!catVal){ toast('כתוב עבור מה, או בחר קטגוריה'); btn.disabled=false; btn.textContent='✓ הכנס את כל התרומות'; return; }
        if(!CAMPAIGNS.includes(catVal)){ await api('POST','/api/campaigns',{name:catVal}); CAMPAIGNS.unshift(catVal); }
      }
      if(isBldg(catVal)){const bl=txEl.querySelector('.bldgitem');const item=bl?bl.value.trim():'';if(item){if(!BUILDING_ITEMS.includes(item)){await api('POST','/api/building_items',{name:item});BUILDING_ITEMS.unshift(item);}catVal=catVal+' — '+item;}}
      const dedEl=txEl.querySelector('.pyded');
      const body={category:catVal, update_addr:upaddr, dedication:dedEl?dedEl.value.trim():''};
      if(rnote&&rnote.value.trim()){ body.note=rnote.value.trim(); body.note_to_donor=rnoteDon?rnoteDon.checked:true; }
      if(!taskDone && rtask && rtask.value.trim()){ body.task=rtask.value.trim(); body.task_date=rtaskd?rtaskd.value:''; body.task_kind=rtaskk?rtaskk.value:'followup'; body.task_who=rtaskw?rtaskw.value:''; taskDone=true; }
      if(kvAdd&&kvText&&kvText.value.trim()){ body.attach_kv=true; body.kv_text=kvText.value.trim(); }
      if(PARNES_CATS.includes(catVal)){const mon=txEl.querySelector('.pymon'),day=txEl.querySelector('.pyday'),yr=txEl.querySelector('.pyyr');if(mon&&day){body.month=mon.value;body.day=+day.value;body.hyear=yr?yr.value:'';body.date_text=heDay(+day.value)+' '+mon.value;}}
      if(donorId) body.donor_id=donorId;
      else if(state.createNew){ body.new_donor={last:state.nl,first:state.nf,notes:state.nn||'',
        category:(state.ncat||''), tier:(state.ntier==='__occ'?'':(state.ntier||'')),
        kv_month:(state.ntier==='__occ'?(state.nkvm||''):''), kv_year:(state.ntier==='__occ'?(state.nkvy||''):''),
        occasional:(state.ntier==='__occ')}; }
      const r=await api('POST','/api/recon/'+tid, body);
      if(r.donor_id){ donorId=r.donor_id; }
      upaddr=false; kvAdd=false; // רק פעם אחת
    }
    toast('הוכנס ✓'); await load();
  };
}

$('.filters').addEventListener('click', e=>{ if(e.target.dataset.f){ FILT=e.target.dataset.f; try{sessionStorage.setItem(FKEY,FILT);}catch(err){} document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('on',b===e.target)); window.scrollTo(0,0); render(); }});
const _ms=document.getElementById('mailsync');
if(_ms)_ms.onclick=async()=>{
  _ms.disabled=true;const t0=_ms.textContent;_ms.textContent='מושך מיילים…';
  const r=await api('POST','/api/mail/contacts_sync',{});
  _ms.disabled=false;_ms.textContent=t0;
  if(!r||!r.ok){toast(r&&r.error==='not_configured'?'המייל לא מוגדר בשרת':'שגיאה: '+((r&&(r.detail||r.error))||''));return;}
  toast(r.new?('תויקו '+r.new+' מיילים אצל התורמים ✓'):'אין מיילים חדשים לתיוק');
};
load();
</script>
