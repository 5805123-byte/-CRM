<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול המקווה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- 🛁 מאיר: "אתר חדש לניהול האופציות של המקווה… אותן קריאות API בדיוק, עיצוב חדש בלבד".
     כל מה שנעשה כאן עובר דרך אותם /api/mikveh/… של האתר הרגיל — שינוי בצד אחד נראה מיד בצד השני. -->
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#1d2433;--muted:#6b7488;--line:#e6eaf2;--soft:#eef3ff;--blue:#2f6fed;--blue2:#e8efff;
  --green:#15b97c;--green2:#e3f8ef;--red:#ef4444;--red2:#fdecec;--amber:#f59e0b;--amber2:#fff4dc;--violet:#7c5cff;--violet2:#efeaff;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#fff;border-inline-start:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:22px 22px 14px;font-weight:800;font-size:1.25rem;color:var(--blue);display:flex;align-items:center;gap:10px}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:.75rem}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 14px;border-radius:10px;cursor:pointer;text-align:right;font-weight:600;color:#3b4456}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--blue2);color:var(--blue)}
.nav button svg{width:20px;height:20px;flex:none}
.nav .badge{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:20px;padding:0 8px;font-size:.75rem;min-width:22px;text-align:center}
.side .foot{padding:14px 18px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.main{min-width:0;padding:22px 26px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:1.45rem;display:flex;align-items:center;gap:10px}
.top h1 svg{width:24px;height:24px;color:var(--blue)}
.top .sub{color:var(--muted);font-size:.85rem}
.top .grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.btn:hover{border-color:#cfd7e6}
.btn.p{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.p:hover{filter:brightness(1.05)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.r{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}
.grid{display:grid;gap:16px}.grid>*,.main{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.pad{padding:18px}
.card h3{margin:0 0 12px;font-size:1rem;display:flex;align-items:center;gap:8px}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:flex-start;cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:#cfd7e6}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--blue2);color:var(--blue)}
.kpi .ic svg{width:21px;height:21px}
.kpi .t{color:var(--muted);font-size:.85rem;font-weight:500}
.kpi .v{font-size:1.7rem;font-weight:800;line-height:1.25;letter-spacing:-.5px}
.kpi .s{color:var(--muted);font-size:.8rem}
.ic.g{background:var(--green2);color:var(--green)}.ic.r{background:var(--red2);color:var(--red)}.ic.a{background:var(--amber2);color:var(--amber)}.ic.v{background:var(--violet2);color:var(--violet)}
.two{grid-template-columns:2fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:1100px){.two,.three{grid-template-columns:1fr}}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.chart svg{width:100%;height:200px;display:block}
.bc{position:relative}.bcmax{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.bcx{position:relative;height:20px;margin-top:4px;direction:ltr}.bcx span{position:absolute;transform:translateX(-50%);font-size:.72rem;color:var(--muted);white-space:nowrap}
.card h3 svg{width:18px;height:18px;flex:none;color:var(--blue)}
.bars .row{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:.88rem}
.bars .track{height:8px;background:#eef1f6;border-radius:6px;overflow:hidden}.bars .fill{height:100%;background:var(--blue);border-radius:6px}
.bars .n{color:var(--muted);text-align:left;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;outline:0;padding:11px 0;width:100%;background:none}
.search svg{width:18px;color:var(--muted)}
select,input[type=text],input[type=number],input[type=date],input[type=time],input:not([type]),textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:0}
select:focus,input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
textarea{width:100%;resize:vertical}
.seg{display:inline-flex;background:#e9eef7;border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:600;color:#4b5568;font-size:.88rem}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.seg button i{font-style:normal;color:var(--muted);font-weight:500;margin-inline-start:4px}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
.t th{text-align:right;font-weight:600;color:var(--muted);font-size:.8rem;padding:11px 12px;border-bottom:1px solid var(--line);background:#fafbfd;position:sticky;top:0}
.t td{padding:10px 12px;border-bottom:1px solid #f0f3f8;vertical-align:middle}
.t tr.cl{cursor:pointer}.t tr.cl:hover td{background:#f7f9ff}
.tw{overflow:auto;border-radius:var(--r)}
.who{display:flex;align-items:center;gap:10px}.who b{font-weight:600}.who small{display:block;color:var(--muted);font-size:.78rem}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.82rem;flex:none}
.av.lg{width:54px;height:54px;font-size:1.1rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;background:#f1f4f9;font-size:.8rem;font-weight:600;white-space:nowrap}
.chip .d{width:8px;height:8px;border-radius:50%}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.76rem;font-weight:600;background:#f1f4f9;color:#4b5568;white-space:nowrap}
.tag.g{background:var(--green2);color:#0b8a5b}.tag.r{background:var(--red2);color:#c02626}.tag.a{background:var(--amber2);color:#b45309}.tag.b{background:var(--blue2);color:var(--blue)}
.red{color:var(--red)}.green{color:#0b8a5b}.mut{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
.empty{padding:40px;text-align:center;color:var(--muted)}
.skel{background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 50%,#eef1f6 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spin{width:16px;height:16px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
/* מגירת לקוח */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:40;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(640px,100%);background:var(--bg);z-index:41;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.drawer.on{transform:none}
.dh{background:#fff;padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;position:sticky;top:0;z-index:2}
.dh h2{margin:0;font-size:1.2rem}.dh .x{margin-inline-start:auto}
.db{padding:18px 20px;overflow:auto;flex:1}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.x svg{width:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile span{display:block;color:var(--muted);font-size:.76rem}.tile b{font-size:1.05rem}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--blue)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 12px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.list .it{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.list .it .m{flex:1;min-width:0}.list .it .m small{display:block;color:var(--muted);font-size:.8rem}
/* חלון */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(17,24,39,.4);padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff}
.mbox .mh h3{margin:0;font-size:1.05rem;flex:1}
.mbox .mb{padding:18px 20px}
.mbox .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;position:sticky;bottom:0;background:#fff}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:9px;align-items:center;margin:8px 0;cursor:pointer}.chk input{width:18px;height:18px}
.hint{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.85rem;color:#3b4456;line-height:1.6;margin:8px 0}
.warn{background:var(--red2);color:#a61b1b;border-radius:10px;padding:10px 12px;font-size:.88rem;margin:8px 0}
pre.code{direction:ltr;text-align:left;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;font-size:.82rem;white-space:pre-wrap;word-break:break-all}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.2s;z-index:80;font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%)}
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--sh)}
.mobbar{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}.side{position:fixed;inset:0 0 0 auto;width:260px;z-index:50;transform:translateX(105%);transition:.2s}
  .side.on{transform:none}.main{padding:14px 14px 60px}
  .mobbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .t .hm{display:none}
}
.kcs{display:flex;flex-wrap:wrap;gap:4px 14px}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 6a2 2 0 1 1 4 0v8"/><path d="M3 14h18v1a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6v-1z"/><path d="M6 21l-1 1M18 21l1 1"/></svg>
      <div>ניהול המקווה<small>מקווה לייביש עוזר</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><a href="/" id="oldsite">↩ למערכת הרגילה</a><span id="who"></span></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="ov" id="ov"></div>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
// ---------- עזרים ----------
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nis=n=>n==null||n===''?'—':'₪'+(+n).toLocaleString('he-IL',{maximumFractionDigits:2});
const money=ag=>ag==null?'—':nis((+ag||0)/100);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date());
const dmy=s=>{s=String(s||'');return s.length>=10?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(2,4):'—';};
const dmyhm=s=>{s=String(s||'');return s.length>=16?dmy(s)+' '+s.slice(11,16):dmy(s);};
const past=s=>!!s&&String(s).slice(0,10)<TODAY;
const ago=s=>{if(!s)return '—';const d=new Date(s);if(isNaN(d))return '—';const days=Math.floor((new Date().setHours(0,0,0,0)-new Date(d).setHours(0,0,0,0))/864e5);
  const hm=d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});return days<=0?'היום '+hm:days===1?'אתמול '+hm:days<7?'לפני '+days+' ימים':dmy(s);};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200);}
async function api(m,u,b){
  const r=await fetch(u,{method:m,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  if(r.status===401){showLogin();throw new Error('auth');}
  if(r.status===403)return {ok:false,error:'אין הרשאה — צריך להיכנס בסיסמה הראשית'};
  try{return await r.json();}catch(e){return {ok:false,error:'השרת לא ענה ('+r.status+')'};}
}
const ICON={
 dash:'<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5"/>',
 door:'<path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17"/><path d="M3 21h18"/><circle cx="15" cy="12" r="1"/>',
 debt:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/>',
 inbox:'<path d="M4 13l2.5-7h11L20 13"/><path d="M4 13v6h16v-6h-5a3 3 0 0 1-6 0z"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 alert:'<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/>',
 send:'<path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/>',
 phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
 refresh:'<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12A9 9 0 0 1 18.5 5.8L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
 cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
 check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
 swap:'<path d="M7 7h13l-4-4M17 17H4l4 4"/>',
 lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
 msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
 ext:'<path d="M14 4h6v6M10 14L20 4M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
 wallet:'<path d="M20 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15v12H5a2 2 0 0 1-2-2V6"/><circle cx="16" cy="14" r="1"/>',
 gift:'<rect x="3" y="8" width="18" height="4"/><path d="M12 8v13M5 12v9h14v-9M12 8S10 3 7.5 4.5 9 8 12 8zM12 8s2-5 4.5-3.5S15 8 12 8z"/>'
};
const ic=(n,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]||''}</svg>`;

// ---------- חלונות ----------
function modal(title,body,buttons){
  return new Promise(res=>{const m=$('#modal'),b=$('#mbox');
    b.innerHTML=`<div class="mh"><h3>${title}</h3><button class="x" data-x>${ic('x')}</button></div><div class="mb">${body}</div>
      <div class="mf">${(buttons||[{t:'סגירה',v:null}]).map((x,i)=>`<button class="btn ${x.cls||''}" data-i="${i}">${x.t}</button>`).join('')}</div>`;
    m.classList.add('on');const done=v=>{m.classList.remove('on');res(v);};

// ---------- גרף עמודות (SVG) ----------
function barChart(rows,keys,colors,labelEvery){
  // עמודות ב-SVG (נמתח לרוחב), התוויות ב-HTML כדי שהטקסט לא יימתח
  const W=1000,H=200,n=rows.length||1,bw=W/n;
  const mx=Math.max(1,...rows.map(r=>keys.reduce((s,k)=>s+(+r[k]||0),0)));
  let g='';[.25,.5,.75].forEach(f=>g+=`<line x1="0" x2="${W}" y1="${H-H*f}" y2="${H-H*f}" stroke="#eef1f6" vector-effect="non-scaling-stroke"/>`);
  let lab='';rows.forEach((r,i)=>{let y=H;keys.forEach((k,j)=>{const v=+r[k]||0,h=v/mx*(H-4);if(!h)return;y-=h;
      g+=`<rect x="${i*bw+bw*.18}" y="${y}" width="${bw*.64}" height="${h}" fill="${colors[j]}"><title>${dmy(r.date)} · ${keys.map(kk=>(+r[kk]||0).toLocaleString('he-IL')).join(' / ')}</title></rect>`;});
    if(i%labelEvery===0||i===n-1)lab+=`<span style="left:${(i+.5)/n*100}%">${r.date.slice(8,10)}/${r.date.slice(5,7)}</span>`;});
  return `<div class="bc"><div class="bcmax num">${Math.round(mx).toLocaleString('he-IL')}</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="#d9dee8" vector-effect="non-scaling-stroke"/></svg><div class="bcx">${lab}</div></div>`;}
const barsList=(items,fmt)=>{const mx=Math.max(1,...items.map(x=>+x.v||0));return `<div class="bars">${items.map(x=>`<div class="row"><span>${esc(x.k)}</span><div class="track"><div class="fill" style="width:${(+x.v||0)/mx*100}%;${x.c?'background:'+x.c:''}"></div></div><span class="n">${fmt?fmt(x.v):x.v}</span></div>`).join('')||'<div class="mut">אין נתונים</div>'}</div>`;};

function filtClients(){const F=S.filter,C=(S.mk&&S.mk.clients)||[],q=F.q.trim().toLowerCase(),qd=q.replace(/\D/g,'');
  let a=C.filter(c=>{if(F.g&&c.group!==F.g)return false;
    if(F.st==='act'&&!(c.sub_end&&!past(c.sub_end)))return false;if(F.st==='exp'&&!(c.sub_end&&past(c.sub_end)))return false;
    if(F.st==='blk'&&!c.blocked)return false;if(F.st==='bal'&&!((cBal(c)||0)>0))return false;if(F.st==='zk'&&!((c.temp_balance||0)>0))return false;
    if(!q)return true;return cName(c).toLowerCase().includes(q)||(qd.length>=3&&String(c.phone||'').replace(/\D/g,'').includes(qd))||String(c.code||'')===q;});
  const sk={name:c=>(c.last||'')+(c.first||''),code:c=>+c.code||0,last:c=>String(c.last_in||''),end:c=>String(c.sub_end||'')}[F.sort];
  a.sort((x,y)=>{const A=sk(x),B=sk(y);return F.sort==='last'?String(B).localeCompare(String(A)):typeof A==='number'?A-B:String(A).localeCompare(String(B),'he');});return a;}

      <div class="card pad"><h3>${ic('gear')} כללים</h3>
        <label class="fld"><span>אפשר להחליף</span><div style="display:flex;gap:8px;align-items:center"><input type="number" id="imax" value="${esc(C.max)}" style="width:80px"> פעמים בתוך <input type="number" id="idays" value="${esc(C.days)}" style="width:80px"> ימים</div></label>
        <label class="fld"><span>הנחת חבר קהילה — מינימום הוראת קבע (₪)</span><input type="number" id="imin" value="${esc(C.min_keva!=null?C.min_keva:100)}"></label>
        <div class="fld"><span>קטגוריית הוראת הקבע בנדרים שנחשבת להנחה</span><div class="kcs">${[...new Set([...(r.keva_cats||[]),...(C.keva_cats||[])])].map(k=>`<label class="chk"><input type="checkbox" data-kc="${esc(k)}" ${(C.keva_cats||[]).includes(k)?'checked':''}>${esc(k)}</label>`).join('')||'<span class="mut">אין עדיין קטגוריות בהוראות הקבע שנמשכו</span>'}</div><div class="hint">הוראת קבע בקטגוריה אחרת לא נחשבת. בלי סימון — כל הוראת קבע לקהילה נחשבת.</div></div>
        <div class="hint">👥 חבר קהילה (לפי הטלפון ברשימת הקהילה) שומע: 1 לקבוצות ההנחה, 2 לרגילות. ההנחה ניתנת לבד רק עם הוראת קבע פעילה מהמינימום ומעלה, ורק אם אין לקוח אחר עם אותו טלפון / ת.ז. שכבר בהנחה. אחרת הוא שומע למה, ויכול לשלוח בקשה.</div>
        <label class="chk"><input type="checkbox" id="ireq" ${C.req_on?'checked':''}>מי שאין לו הרשאה / עבר את המקסימום — יכול לשלוח בקשה למשרד</label>
        <button class="btn p" id="isave" style="margin-top:10px">שמירה</button>
        <h3 style="margin-top:22px">הגדרה בימות המשיח</h3><pre class="code">type=api\napi_link=${esc(r.link)}\napi_hangup_send=no</pre></div></div>`;
    $('#isave').onclick=()=>{const say={};$$('#ib [data-say]').forEach(i=>{if(i.value.trim())say[i.dataset.say]=i.value.trim();});
      save({enabled:$('#ion').checked,groups:$$('#ib [data-sg]').filter(x=>x.checked).map(x=>x.dataset.sg),member_groups:$$('#ib [data-mg]').filter(x=>x.checked).map(x=>x.dataset.mg),
        locked_groups:$$('#ib [data-lg]').filter(x=>x.checked).map(x=>x.dataset.lg),say,max:$('#imax').value,days:$('#idays').value,min_keva:$('#imin').value,keva_cats:$$('#ib [data-kc]').filter(x=>x.checked).map(x=>x.dataset.kc),req_on:$('#ireq').checked});};}
  else if(ITAB==='price'){
    $('#ib').innerHTML=`<div class="grid two"><div class="card pad"><h3>${ic('cash')} חישוב ההפרש</h3>
        <div class="hint">(המחיר החודשי החדש − המחיר החודשי שלו) × ימים שנשארו במנוי ÷ ימים בחודש. בלי מנוי בתוקף — אין הפרש.</div>
        <div class="row2"><label class="fld"><span>ימים בחודש</span><input type="number" id="pdiv" value="${esc(C.divisor||30)}"></label>
        <label class="fld"><span>עיגול</span><select id="prnd"><option value="1"${+C.round===1?' selected':''}>שקל שלם</option><option value="5"${+C.round===5?' selected':''}>5 שקלים</option><option value="0.01"${+C.round<1&&+C.round>0?' selected':''}>אגורה</option></select></label></div>
        <label class="chk"><input type="checkbox" id="pcr" ${C.credit_down!==false?'checked':''}>מעבר לקבוצה זולה — זיכוי ביתרה הזמנית (אי אפשר לבטל)</label>
        <label class="chk"><input type="checkbox" id="pcan" ${C.cancel_on!==false?'checked':''}>מי שעבר עם חוב שלא שולם — יכול לבטל בטלפון</label>
        <h3 style="margin-top:16px">קבוצות ערך צבור (בלי מחיר חודשי)</h3>${r.groups.map(g=>`<label class="chk"><input type="checkbox" data-eg="${esc(g.id)}" ${g.erech?'checked':''}>${esc(g.name)}</label>`).join('')}</div>
      <div class="card pad"><h3>${ic('wallet')} תשלום ההפרש</h3>
        ${[['keva','מהוראת הקבע (נדרים פלוס)'],['card','אשראי בטלפון (נדרים פלוס)'],['debt','חוב במקווה — משלם במכונה']].map(([k,t])=>`<label class="chk"><input type="checkbox" data-pm="${k}" ${PM.has(k)?'checked':''}>${t}</label>`).join('')}
        <label class="fld" style="margin-top:10px"><span>קופת נדרים פלוס</span><select id="pnd"><option value="">— לא נבחרה —</option>${(r.accounts||[]).map(a=>`<option value="${esc(a.mosad)}"${String(C.nd_mosad||'')===String(a.mosad)?' selected':''}>${esc(a.name)} · ${esc(a.mosad)}</option>`).join('')}</select></label>
        <button class="btn p" id="psave">שמירה</button></div></div>`;
    $('#psave').onclick=()=>{const pm=$$('#ib [data-pm]').filter(x=>x.checked).map(x=>x.dataset.pm);if(pm.some(m=>m!=='debt')&&!$('#pnd').value){alertBox('חסרה קופה','לתשלום באשראי / הוראת קבע צריך לבחור קופת נדרים פלוס');return;}
      save({divisor:$('#pdiv').value,round:$('#prnd').value,credit_down:$('#pcr').checked,cancel_on:$('#pcan').checked,pay_methods:pm,nd_mosad:$('#pnd').value,erech_groups:$$('#ib [data-eg]').filter(x=>x.checked).map(x=>x.dataset.eg)});};}
  else if(ITAB==='lock'){
    $('#ib').innerHTML=`<div class="card pad"><div class="hint">לקוחות שלא יכולים להחליף קבוצה בטלפון. נועלים מכרטיס הלקוח.</div><div class="list">${(r.locked||[]).map(x=>`<div class="it"><div class="m"><b>${esc(x.name||x.id)}</b><small>${x.code?'#'+esc(x.code):''}</small></div><button class="btn sm" data-ul="${esc(x.id)}">ביטול נעילה</button></div>`).join('')||'<div class="empty">אין לקוחות נעולים</div>'}</div></div>`;
    $$('#ib [data-ul]').forEach(b=>b.onclick=async()=>{await api('POST','/api/mikveh/selfgroup_lock',{id:b.dataset.ul,locked:false});toast('הנעילה בוטלה');vIvr();});}
  else if(ITAB==='log'){
    $('#ib').innerHTML=`<div class="card tw"><table class="t"><thead><tr><th>מתי</th><th>לקוח</th><th>מעבר</th><th>הפרש</th><th></th></tr></thead><tbody>${(r.log||[]).map(x=>`<tr><td class="num">${dmyhm(x.at)}</td><td><b>${esc(x.name||'')}</b></td><td>${esc(x.from_name||'')} ← ${esc(x.to_name||'')}${x.status==='cancelled'?' <span class="tag a">בוטל</span>':x.ok?'':' <span class="tag r">לא בוצע</span>'}</td>
      <td class="num">${x.amount?(x.amount>0?'<span class="red">'+nis(x.amount)+'</span> '+esc({debt:'חוב',card:'אשראי',keva:'הו"ק'}[x.method]||''):'<span class="green">זיכוי '+nis(-x.amount)+'</span>'):'—'}</td><td><button class="btn sm" data-ld="${x.id}">${ic('trash')}</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">אין</td></tr>'}</tbody></table></div>`;
    $$('#ib [data-ld]').forEach(b=>b.onclick=async()=>{if(!await confirmBox('מחיקה מהיומן','השורה לא תיספר יותר בכמות ההחלפות. במקווה לא משתנה כלום.'))return;await api('POST','/api/mikveh/selfgroup_log_del',{id:+b.dataset.ld});vIvr();});}}
async function ivrTexts(){const ext=ITAB==='vmset'?'vm':'grp';const [r,v]=await Promise.all([api('GET','/api/mikveh/ivr_texts'),ext==='vm'?api('GET','/api/mikveh/vm'):Promise.resolve(null)]);if(!$('#ib'))return;
  const T=(r.texts||[]).filter(x=>x.ext===ext);
  $('#ib').innerHTML=`<div class="card pad">${ext==='vm'&&v&&v.ok?`<h3>הגדרה בימות המשיח</h3><pre class="code">type=api\napi_link=${esc(v.link)}\napi_hangup_send=yes</pre>`:''}
    <div class="hint">בסוגריים מסולסלים — המערכת ממלאת לבד: {name} שם, {group} קבוצה, {price} מחיר, {amount} סכום, {days} ימים, {who} שם, {min} מינימום. שדה ריק = הנוסח המקורי.</div>
    ${T.map(x=>`<label class="fld"><span>${esc(x.label)}${x.val?' <b style="color:var(--blue)">· שונה</b>':''}</span><textarea rows="2" data-tx="${esc(x.key)}" placeholder="${esc(x.def)}">${esc(x.val||x.def)}</textarea></label>`).join('')}
    <div class="acts"><button class="btn p" id="tsave">שמירה</button><button class="btn" id="treset">להחזיר הכל לנוסח המקורי</button></div></div>`;
  const all=()=>{const t={};$$('#ib [data-tx]').forEach(x=>t[x.dataset.tx]=x.value);return t;};
  $('#tsave').onclick=async()=>{const x=await api('POST','/api/mikveh/ivr_texts',{texts:all()});x.ok?(toast('נשמר'),vIvr()):alertBox('לא נשמר',x.error);};
  $('#treset').onclick=async()=>{if(!await confirmBox('נוסח מקורי','להחזיר את כל הטקסטים בלשונית הזו לנוסח המקורי?'))return;const t=all();Object.keys(t).forEach(k=>t[k]='');await api('POST','/api/mikveh/ivr_texts',{texts:t});vIvr();};}

// ---------- כניסה ----------
function showLogin(msg){document.body.innerHTML=`<div class="login"><h2 style="margin-top:0">🛁 ניהול המקווה</h2><div class="mut" style="margin-bottom:14px">${esc(msg||'הקלד את הסיסמה של המערכת')}</div>
  <input type="password" id="lp" style="width:100%" placeholder="סיסמה"><button class="btn p" id="lb" style="width:100%;justify-content:center;margin-top:12px">כניסה</button>
  <div style="margin-top:14px;text-align:center"><a href="/">או כניסה דרך המערכת הרגילה</a></div></div>`;
  const go_=async()=>{const r=await (await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#lp').value,portal:'admin'})})).json().catch(()=>({}));
    if(r&&r.ok)location.reload();else showLogin((r&&r.error)||'סיסמה שגויה');};
  $('#lb').onclick=go_;$('#lp').onkeydown=e=>{if(e.key==='Enter')go_();};$('#lp').focus();}

// ---------- התחלה ----------
(async()=>{const me=await (await fetch('/api/me',{credentials:'same-origin'})).json().catch(()=>({}));
  if(me.auth_on&&!me.role){showLogin();return;}
  if(me.auth_on&&me.role!=='admin'){showLogin('הכניסה הזו פותחת רק חלק מהמערכת — צריך את הסיסמה הראשית');return;}
  $('#who').textContent=me.auth_on?'מחובר':'';
  S.view=(location.hash||'#dash').slice(1);if(!NAV.some(n=>n[0]===S.view))S.view='dash';
  navPaint();render();badges();setInterval(badges,120000);
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==S.view&&NAV.some(n=>n[0]===v)){S.view=v;navPaint();render();}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('on'))$('#modal').classList.remove('on');});})();
</script>
</body>
</html>
