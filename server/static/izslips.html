<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>דפי קוויטל — יששכר־זבולון</title>
<style>
  /* שלושה פתקים בדף A4, לגזירה. כל פתק על הבלאנק של כולל חצות. */
  @page{size:A4 portrait;margin:0}
  :root{--ink:#2A2740;--gold:#8a6a22;--deep:#7a1f1f}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#EDE7DA;color:var(--ink);
    font-family:"Frank Ruhl Libre","Times New Roman",serif}
  .bar{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:10px 14px;background:#3B357A;color:#fff;font-family:system-ui,sans-serif}
  .bar b{font-size:1rem}
  .bar .sp{flex:1}
  .bar button,.bar select{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:9px;
    border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
  .bar button:hover{background:rgba(255,255,255,.24)}
  /* מאיר: "כשאני רוצה לבחור אברך ספציפי הוא לא מראה לי את שמותיהם,
     רק בטאבלט ולא במחשב". חלון הבחירה במחשב נפתח על רקע לבן, והאפשרויות
     ירשו color:#fff מהסרגל — לבן על לבן. כאן נקבע להן צבע משלהן. */
  .bar select option{color:#2A2740;background:#fff;font-weight:600}
  .bar select{max-width:min(46vw,320px);text-overflow:ellipsis}
  /* מאיר: "בשורה של כל האברכים שיהיה שורת חיפוש אברך ספציפי" */
  .bar input{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:9px;min-width:200px;
    border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff}
  .bar input::placeholder{color:rgba(255,255,255,.7)}
  .bar input:focus{outline:none;background:rgba(255,255,255,.22)}
  .hint{padding:8px 14px;background:#fff8e6;color:#7a5a12;font-family:system-ui,sans-serif;font-size:.86rem}
  .sheet{width:210mm;height:297mm;margin:12px auto;background:#fff;
    box-shadow:0 6px 24px rgba(40,36,64,.18);display:flex;flex-direction:column}
  /* מאיר: "כשאני מוריד להדפסה זה לא מראה את הלוגו ועיצוב הבלאנק".
     רקע ב-CSS אינו מודפס אלא אם המשתמש מסמן "גרפיקת רקע" בתיבת
     ההדפסה. תמונה אמיתית מודפסת תמיד, ולכן הבלאנק הוא <img> ולא
     background — ולמקרה שנשאר רקע כלשהו, גם print-color-adjust. */
  .slip{width:210mm;height:148.5mm;position:relative;overflow:hidden;background:#fdf8ee;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .slip>.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;
    z-index:0;pointer-events:none}
  .slip .in{position:absolute;inset:6mm 11mm 6mm 11mm;display:flex;flex-direction:column;z-index:1}
  /* שורת הראש — מוסטת שמאלה כדי לא להיכנס מתחת ללוגו שבימין */
  .who{display:flex;gap:13mm;align-items:flex-start;padding-inline-start:36mm;min-height:33mm;
    overflow:hidden}
  .who .w{line-height:1.2}
  .who .lbl{font-size:14pt;color:var(--gold);font-weight:800;letter-spacing:.01em}
  .who .nm{font-size:24pt;font-weight:800;color:var(--deep);white-space:nowrap}
  /* התואר ר' / מרת / ה"ה — קטן מהשם עצמו, כמו שמאיר ביקש */
  .who .nm i{font-style:normal;font-size:14pt;font-weight:700;opacity:.9}
  /* הנוסח — פי שניים מקודם, ו"לזכות" בשורה נפרדת */
  .lead{margin-top:0.5mm;font-size:21pt;color:var(--ink);font-weight:700;line-height:1.3;
    text-align:center}
  .lead .z{display:block;margin-top:1.5mm;color:var(--deep);font-weight:800}
  .names{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
    margin-top:3mm;font-size:45pt;font-weight:800;line-height:1.28;overflow:hidden}
  .names span{display:block;width:100%}
  /* מאיר: "אם יש לאברך 2 או 3 שותפים שמחזיקים אותו אז זה מוציא לכל שותף
     דף — מסרבל ובלגן. שיהיו כל השותפים באותו דף, אבל מחולק, ורק לוגו
     אחד למעלה." רצועה לכל שותף, בגובה שווה, עם קו מפריד וכותרת. */
  .secs{flex:1;display:flex;flex-direction:column;min-height:0}
  /* flex-basis:auto — הגובה נקבע לפי מה שכל רצועה באמת צריכה, ורק העודף
     מתחלק שווה בשווה. חלוקה לחלקים שווים הקטינה את כל הגופנים לפי
     הרצועה הצפופה ביותר. */
  .sec{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .sec + .sec{border-top:1.2pt dashed var(--gold);padding-top:1.5mm}
  /* מאיר: "אני רוצה שהכל יהיה אותו גודל, גם השותף השני שמתחתיו — השם
     שלו ושל האברך והקוויטל, הכל אותו גודל ללא הבדל." לכן כותרת השותף
     הנוסף כתובה באותם גדלים בדיוק של שורת הראש: התווית 14pt זהב והשם
     24pt כהה, והמדידה מקטינה את שתיהן יחד כדי שיישארו שוות. */
  .subwho{text-align:center;font-size:14pt;line-height:1.25;white-space:nowrap;
    overflow:hidden;margin-bottom:.5mm}
  .subwho b{color:var(--deep);font-weight:800;font-size:24pt}
  .subwho i{font-style:normal;color:var(--gold);font-weight:800;font-size:14pt}
  .sec + .sec .names{margin-top:1mm}
  .empty{color:#9a9384;font-weight:600;font-size:16pt}
  /* קו הקיפול הוא גבול של הפתק העליון ולא אלמנט נוסף — אלמנט נפרד
     הוסיף פיקסל וגלש לעמוד שני בהדפסה */
  .slip:first-child{border-bottom:2px dashed #a08c5e}
  /* מאיר: "זה לא טוב לי הפוך — תעשה ששני הצדדים יהיו אחד אחרי השני
     ולא הפוך". שני החצאים באותו כיוון: גוזרים בקו המקווקו ומקבלים
     שני פתקים זהים, או מקפלים. */
  .slip.flip{transform:none}
  /* מאיר: "אני רוצה גם אפשרות של הדפסה של דף שלם כזה בדיוק, רק לא חצי
     דף — שיהיה לי את שתי האפשרויות כדי לשלוח לתורם". דף שלם = פתק אחד
     בעמוד, על הבלאנק המלא. הגדלים ביחס שבו התמונה מצוירת בשרת, כדי
     שהמסך, ההדפסה והתמונה שנשלחת ייראו אותו דבר. */
  .sheet.one{display:block}
  .slip.full{height:297mm;border-bottom:none}
  .slip.full .who{min-height:36mm}
  .slip.full .lead{font-size:24pt;margin-top:2mm}
  .slip.full .lead .z{margin-top:2.5mm}
  .slip.full .names{font-size:56pt;margin-top:5mm}
  /* מאיר: "תעשה לי כמו בדף של פרנס יום — למטה לשלוח לתורם, להעתיק או
     להדפיס". הכפתורים אינם חלק מהפתק ואינם מודפסים. */
  .acts{width:210mm;margin:6px auto 18px;display:flex;flex-wrap:wrap;gap:8px;
    justify-content:center;font-family:system-ui,sans-serif}
  .acts button{font:inherit;font-size:.92rem;font-weight:700;padding:10px 18px;border-radius:10px;
    border:none;color:#fff;background:#8a6a22;cursor:pointer}
  .acts button.wa{background:#25D366}
  .acts button.cp{background:#3b2f5e}
  .acts button.g{background:#fff;color:#8a6a22;border:1px solid #8a6a22}
  .acts button:disabled{opacity:.6;cursor:default}
  @media print{
    .acts{display:none}
    /* הדפסת פתק אחד בלבד — כשלוחצים "הדפס את הפתק הזה" */
    body.oneonly .sheet:not(.only){display:none}
    /* מאיר: "בכל ההדפסות על הבלאנק המילה בס"ד למעלה קטועה, ויש צבע לבן
       סביב הבלאנק — אני רוצה שהבלאנק יהיה בשלמותו לגמרי."
       אף מדפסת אינה מדפיסה עד קצה הנייר (4-6מ"מ מכל צד הם שטח מת), ולכן
       הדף כולו — הבלאנק והשמות יחד — מוקטן ב-3.8% ומתרכז. ההקטנה היא
       transform ולא שינוי מידות, ולכן שבירת השורות והגופן שנבחרו נשארים
       בדיוק כמו במסך. מאחורי הדף המוקטן נפרש אותו בלאנק על כל העמוד
       (בחצי דף — פעמיים, בדיוק על גבולות הפתקים), כדי שהשוליים יהיו
       בצבע הנייר של הבלאנק ולא לבנים. */
    html,body{background:#fdf8ee url("/bleed/iz-slip.jpg") top center/100% 50% repeat-y;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    body.fullmode{background:#fdf8ee url("/bleed/iz-page.jpg") center center/100% 100% no-repeat}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .bar,.hint{display:none}
    .sheet{width:210mm;height:297mm;margin:0;box-shadow:none;
      transform:scale(.962);transform-origin:center center}
    .slip{break-inside:avoid;page-break-inside:avoid}
    .sheet{break-after:page;page-break-after:always}
    .sheet:last-child{break-after:auto;page-break-after:auto}
  }
</style>
</head>
<body>
<div class="bar">
  <b>🕯️ דפי קוויטל — יששכר־זבולון</b>
  <input id="q" placeholder="🔍 חפש אברך או תורם…" autocomplete="off">
  <select id="pick"><option value="">כל האברכים</option></select>
  <select id="filt">
    <option value="names">רק מי שיש לו שמות</option>
    <option value="all">הכל (גם בלי שמות)</option>
  </select>
  <select id="mode">
    <option value="half">חצי דף — שניים בעמוד</option>
    <option value="full">דף שלם — אחד בעמוד</option>
  </select>
  <span class="sp"></span>
  <span id="cnt"></span>
  <button onclick="window.print()">🖨️ הדפס</button>
</div>
<div class="hint" id="hint"></div>
<div id="out"></div>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let ROWS = [];

// מאיר: "תסדר שכל שם ושם האם והבקשה ואז פסיק, והשם הבא באותה שורה —
// לא שיתפוס מקום". שורות בודדות מתחברות לרצף אחד מופרד בפסיקים.
function kvFlow(t) {
  const parts = String(t || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) return parts.join('');
  let out = parts[0];
  for (let i = 1; i < parts.length; i++) {
    out += (/[,.:;·|]$/.test(out) ? ' ' : ', ') + parts[i];
  }
  return out;
}
// הקטנה לפי מדידה אמיתית — לא לפי ניחוש אורך — כדי ששום דבר לא ייחתך
// שם ארוך בכותרת (למשל ה"ה חיים ולאה אסתר לאקס) גלש מחוץ לפתק.
// מקטינים במדידה עד שהשורה נכנסת, בדיוק כמו בשמות הקוויטל.
// שורת הראש וכותרות השותפים מוקטנות יחד לגודל אחד. מאיר: "הכל אותו
// גודל ללא הבדל" — לכן לא מודדים כל אחת לחוד, אלא מחפשים את הגודל
// הגדול ביותר שבו *כולן* נכנסות, ומחילים אותו על כולן.
function fitWho(slip) {
  const who = slip.querySelector('.who');
  const subs = [...slip.querySelectorAll('.subwho')];
  const nms = who ? [...who.querySelectorAll('.nm')] : [];
  if (!nms.length && !subs.length) return;
  const set = pt => {
    nms.forEach(n => {
      n.style.fontSize = pt + 'pt';
      const i = n.querySelector('i');
      if (i) i.style.fontSize = Math.max(8, pt * 0.58) + 'pt';
    });
    subs.forEach(sw => {
      sw.style.fontSize = Math.max(8, pt * 0.58) + 'pt';
      sw.querySelectorAll('b').forEach(b => { b.style.fontSize = pt + 'pt'; });
      sw.querySelectorAll('i').forEach(i => { i.style.fontSize = Math.max(8, pt * 0.58) + 'pt'; });
    });
  };
  for (let pt = 24; pt >= 9; pt -= 0.5) {
    set(pt);
    const okWho = !who || who.scrollWidth <= who.clientWidth;
    const okSub = subs.every(sw => sw.scrollWidth <= sw.clientWidth);
    if (okWho && okSub) return;
  }
}
// כל הרצועות בדף יורדות יחד לאותו גודל — אחרת אצל שותף אחד השמות
// ענקיים ואצל השני זעירים, וזה נראה כמו שני דפים שהודבקו
function fitNames(slip) {
  const els = [...slip.querySelectorAll('.names')];
  if (!els.length) return;
  const top = slip.classList.contains('full') ? 56 : 45;
  for (let pt = top; pt >= 7; pt -= 0.5) {
    els.forEach(el => {
      el.style.fontSize = pt + 'pt';
      el.style.lineHeight = (pt > 20 ? 1.28 : 1.22);
    });
    if (els.every(el => (el.firstElementChild || el).scrollHeight <= el.clientHeight)) return;
  }
}
// מאיר: "מיטמן הם שלושה שמחזיקים את ציון כהן — שיהיה כתוב בהתחלה אפרים
// מיטמן והשמות שלו, אחר כך ציון כהן יששכר / מאיר מיטמן זבולון ואז השמות
// שלו, ורק לוגו אחד למעלה". הראש והנוסח פעם אחת; לכל שותף נוסף כותרת
// משלו מעל השמות שלו, וקו מפריד ביניהם.
function slip(g, flip, full) {
  const ps = g.parts;
  const nmOf = r => r.names ? `<div class="names"><span>${esc(kvFlow(r.names))}</span></div>`
                            : '<div class="names"><span class="empty">— אין עדיין שמות לקוויטל —</span></div>';
  const avn = esc(g.avreich_p || g.avreich), avt = esc(g.av_t || "ר'");
  const dnm = r => (r.donor_t === '' ? '' : `<i>${esc(r.donor_t || "ר'")}</i> `) + esc(r.donor_p || r.donor);
  const secs = ps.map((r, i) => '<div class="sec">' + (i ? `<div class="subwho">
        <i>יששכר</i> <b>${avt} ${avn}</b> &nbsp;·&nbsp; <i>זבולון</i> <b>${dnm(r)}</b></div>` : '')
    + nmOf(r) + '</div>').join('');
  return `<div class="slip${flip ? ' flip' : ''}${full ? ' full' : ''}"><img class="bg" src="${full ? '/iz-page.jpg' : '/iz-slip.jpg'}" alt=""><div class="in">
    <div class="who">
      <div class="w"><div class="lbl">יששכר</div><div class="nm"><i>${avt}</i> ${avn}</div></div>
      <div class="w"><div class="lbl">זבולון</div><div class="nm">${dnm(ps[0])}</div></div>
    </div>
    <div class="lead">יהי רצון שזכות לימוד התורה והתפילה שאני לומד ומתפלל בעת רצון הגדול של חצות הלילה<span class="z">יעמוד לזכות:</span></div>
    <div class="secs">${secs}</div>
  </div></div>`;
}
// ----- התמונה של פתק אחד, בדיוק כמו שהוא מצויר -----
// מאיר: "שיהיה לי את שתי האפשרויות, גם על חצי דף כזה וגם על דף שלם, עם
// אפשרות העתקה, הדפסה ולשלוח לתורם". התמונה מגיעה מהשרת באותו סידור
// שרואים כאן, בגודל שמתאים לשליחה בוואטסאפ ובמייל.
function slipImgUrl(g, ext) {
  const p = new URLSearchParams();
  p.set('av', g.avreich_p || g.avreich);
  p.set('avt', g.av_t || "ר'");
  // שותף לכל שלישייה donor/dnt/names — השרת מצייר את כולם על אותו דף
  g.parts.forEach(r => {
    p.append('donor', r.donor_p || r.donor);
    p.append('dnt', r.donor_t === '' ? '' : (r.donor_t || "ר'"));
    p.append('names', r.names || '');
  });
  if (!FULL) p.set('half', '1');
  return '/izslip.' + (ext || 'png') + '?' + p.toString();
}
async function slipBlob(r, ext) {
  const res = await fetch(slipImgUrl(r, ext));
  const b = await res.blob();
  if (!b || b.size < 5000 || (b.type || '').indexOf('image') < 0) throw new Error('bad');
  return b;
}
function flash(b, txt) {
  const t0 = b.dataset.t0 || b.textContent;
  b.dataset.t0 = t0; b.textContent = txt;
  setTimeout(() => { b.textContent = b.dataset.t0; }, 2500);
}
async function copySlip(b, r) {
  if (!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write)) {
    alert('הדפדפן הזה לא תומך בהעתקת תמונה — השתמש ב"שלח לתורם"'); return; }
  const t0 = b.textContent; b.disabled = true; b.textContent = 'מעתיק…';
  try {
    // ספארי דורש שההבטחה תיווצר בתוך הלחיצה עצמה
    await navigator.clipboard.write([new ClipboardItem({'image/png': slipBlob(r, 'png')})]);
    b.disabled = false; b.textContent = t0; flash(b, '✅ הועתק — הדבק בוואטסאפ'); return;
  } catch (e) {}
  try {
    const blob = await slipBlob(r, 'png');
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
    b.disabled = false; b.textContent = t0; flash(b, '✅ הועתק — הדבק בוואטסאפ'); return;
  } catch (e) {
    b.disabled = false; b.textContent = t0;
    alert('ההעתקה נכשלה — נסה "שלח לתורם"');
  }
}
async function sendSlip(b, r) {
  const t0 = b.textContent; b.disabled = true; b.textContent = 'מכין את התמונה…';
  let blob = null;
  try { blob = await slipBlob(r, 'jpg'); }
  catch (e) { b.disabled = false; b.textContent = t0; window.open(slipImgUrl(r, 'jpg'), '_blank'); return; }
  const who = (r.avreich_p || r.avreich || '').trim();
  const fname = 'קוויטל' + (who ? (' — ' + who) : '') + '.jpg';
  const cap = 'קוויטל יששכר־זבולון — כולל חצות 🕯️';
  b.disabled = false; b.textContent = t0;
  try {
    const file = new File([blob], fname, {type: 'image/jpeg'});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      await navigator.share({files: [file], text: cap}); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      const png = await slipBlob(r, 'png');
      await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
      alert('התמונה הועתקה — פתח וואטסאפ ווב או מייל והדבק (Ctrl+V)'); return; }
  } catch (e) {}
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fname; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
// הדפסת פתק אחד בלבד — שאר הדף מוסתר רק לרגע ההדפסה
function printOne(sheet) {
  document.querySelectorAll('.sheet.only').forEach(s => s.classList.remove('only'));
  sheet.classList.add('only');
  document.body.classList.add('oneonly');
  const back = () => { document.body.classList.remove('oneonly'); sheet.classList.remove('only'); };
  window.addEventListener('afterprint', back, {once: true});
  setTimeout(back, 60000);            // רשת ביטחון אם הדפדפן לא מדווח
  window.print();
}

let FULL = false;
function paint() {
  const only = document.getElementById('pick').value;
  const mode = document.getElementById('filt').value;
  FULL = document.getElementById('mode').value === 'full';
  document.body.classList.toggle('fullmode', FULL);   // הבלאנק שמאחורי הדף בהדפסה
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  // תורם בעילום שם מודפס כ"א.א.", אבל במשרד עדיין מוצאים אותו לפי שמו
  const hit = r => !q || (r.avreich + ' ' + r.donor + ' ' + (r.donor_find || '') + ' ' + (r.names || ''))
    .toLowerCase().includes(q);
  let rows = ROWS.filter(r => (!only || r.avreich === only) && (mode === 'all' || r.names) && hit(r));
  // אברך אחד = דף אחד, גם כשמחזיקים אותו כמה שותפים
  const gm = new Map();
  rows.forEach(r => {
    let g = gm.get(r.avreich);
    if (!g) gm.set(r.avreich, g = {avreich: r.avreich, avreich_p: r.avreich_p,
                                   av_t: r.av_t, parts: []});
    g.parts.push(r);
  });
  const groups = [...gm.values()];
  const many = groups.filter(g => g.parts.length > 1).length;
  document.getElementById('cnt').textContent = groups.length + ' דפים · ' + rows.length + ' שותפים';
  document.getElementById('hint').innerHTML = (FULL
    ? 'דף שלם — אברך אחד בעמוד, לשליחה לתורם או להדפסה. תחת כל דף: שליחה, העתקה והדפסה של אותו דף בלבד.'
    : 'חצי דף — אברך אחד בכל עמוד, פעמיים, שני החצאים באותו כיוון. גוזרים בקו המקווקו ומקבלים שני פתקים זהים, או מקפלים.')
    + (many ? ' &nbsp;·&nbsp; <b>' + many + ' אברכים מוחזקים ביותר משותף אחד — כל השותפים שלהם באותו דף, מחולק בקו מפריד.</b>' : '');
  let h = '';
  groups.forEach((g, i) => {
    h += '<div class="sheet' + (FULL ? ' one' : '') + '" data-i="' + i + '">'
       + (FULL ? slip(g, false, true) : (slip(g) + slip(g, true))) + '</div>'
       + '<div class="acts" data-i="' + i + '">'
       + '<button class="wa act-send">📤 שלח לתורם</button>'
       + '<button class="cp act-copy">📋 העתק תמונה</button>'
       + '<button class="act-print">🖨️ הדפס את הדף הזה</button>'
       + '</div>';
  });
  document.getElementById('out').innerHTML = h ||
    '<div class="hint">אין פתקים להצגה.</div>';
  document.querySelectorAll('.slip').forEach(sl => { fitWho(sl); fitNames(sl); });
  document.querySelectorAll('.acts').forEach(box => {
    const r = groups[+box.dataset.i];
    const sheet = document.querySelector('.sheet[data-i="' + box.dataset.i + '"]');
    box.querySelector('.act-send').onclick = function () { sendSlip(this, r); };
    box.querySelector('.act-copy').onclick = function () { copySlip(this, r); };
    box.querySelector('.act-print').onclick = () => printOne(sheet);
  });
}
(async () => {
  const q = new URLSearchParams(location.search);
  const r = await fetch('/api/izslips' + (q.get('av') ? ('?av=' + encodeURIComponent(q.get('av'))) : ''))
    .then(x => x.json()).catch(() => ({rows: []}));
  ROWS = r.rows || [];
  const sel = document.getElementById('pick');
  [...new Set(ROWS.map(x => x.avreich))].sort((a, b) => a.localeCompare(b, 'he'))
    .forEach(a => { const o = document.createElement('option'); o.value = o.textContent = a; sel.appendChild(o); });
  if (q.get('av')) sel.value = q.get('av');
  sel.onchange = paint;
  document.getElementById('mode').onchange = paint;
  document.getElementById('filt').onchange = paint;
  document.getElementById('q').oninput = paint;
  paint();
})();
</script>
