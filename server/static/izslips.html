<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>דפי קוויטל — יששכר־זבולון</title>
<style>
  /* שלושה פתקים בדף A4, לגזירה. כל פתק על הבלאנק של כולל חצות. */
  @page{size:A4 portrait;margin:0}
  :root{--ink:#2A2740;--gold:#8a6a22;--deep:#7a1f1f}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#EDE7DA;color:var(--ink);
    font-family:"Frank Ruhl Libre","Times New Roman",serif}
  .bar{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:10px 14px;background:#3B357A;color:#fff;font-family:system-ui,sans-serif}
  .bar b{font-size:1rem}
  .bar .sp{flex:1}
  .bar button,.bar select{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:9px;
    border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
  .bar button:hover{background:rgba(255,255,255,.24)}
  /* מאיר: "כשאני רוצה לבחור אברך ספציפי הוא לא מראה לי את שמותיהם,
     רק בטאבלט ולא במחשב". חלון הבחירה במחשב נפתח על רקע לבן, והאפשרויות
     ירשו color:#fff מהסרגל — לבן על לבן. כאן נקבע להן צבע משלהן. */
  .bar select option{color:#2A2740;background:#fff;font-weight:600}
  .bar select{max-width:min(46vw,320px);text-overflow:ellipsis}
  /* מאיר: "בשורה של כל האברכים שיהיה שורת חיפוש אברך ספציפי" */
  .bar input{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:9px;min-width:200px;
    border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff}
  .bar input::placeholder{color:rgba(255,255,255,.7)}
  .bar input:focus{outline:none;background:rgba(255,255,255,.22)}
  .hint{padding:8px 14px;background:#fff8e6;color:#7a5a12;font-family:system-ui,sans-serif;font-size:.86rem}
  .sheet{width:210mm;height:297mm;margin:12px auto;background:#fff;
    box-shadow:0 6px 24px rgba(40,36,64,.18);display:flex;flex-direction:column}
  /* מאיר: "כשאני מוריד להדפסה זה לא מראה את הלוגו ועיצוב הבלאנק".
     רקע ב-CSS אינו מודפס אלא אם המשתמש מסמן "גרפיקת רקע" בתיבת
     ההדפסה. תמונה אמיתית מודפסת תמיד, ולכן הבלאנק הוא <img> ולא
     background — ולמקרה שנשאר רקע כלשהו, גם print-color-adjust. */
  .slip{width:210mm;height:148.5mm;position:relative;overflow:hidden;background:#fdf8ee;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .slip>.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;
    z-index:0;pointer-events:none}
  .slip .in{position:absolute;inset:6mm 11mm 6mm 11mm;display:flex;flex-direction:column;z-index:1}
  /* שורת הראש — מוסטת שמאלה כדי לא להיכנס מתחת ללוגו שבימין */
  .who{display:flex;gap:13mm;align-items:flex-start;padding-inline-start:36mm;min-height:33mm;
    overflow:hidden}
  .who .w{line-height:1.2}
  .who .lbl{font-size:14pt;color:var(--gold);font-weight:800;letter-spacing:.01em}
  .who .nm{font-size:24pt;font-weight:800;color:var(--deep);white-space:nowrap}
  /* התואר ר' / מרת / ה"ה — קטן מהשם עצמו, כמו שמאיר ביקש */
  .who .nm i{font-style:normal;font-size:14pt;font-weight:700;opacity:.9}
  /* הנוסח — פי שניים מקודם, ו"לזכות" בשורה נפרדת */
  .lead{margin-top:0.5mm;font-size:21pt;color:var(--ink);font-weight:700;line-height:1.3;
    text-align:center}
  .lead .z{display:block;margin-top:1.5mm;color:var(--deep);font-weight:800}
  .names{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
    margin-top:3mm;font-size:45pt;font-weight:800;line-height:1.28;overflow:hidden}
  .names span{display:block;width:100%}
  .empty{color:#9a9384;font-weight:600;font-size:16pt}
  /* קו הקיפול הוא גבול של הפתק העליון ולא אלמנט נוסף — אלמנט נפרד
     הוסיף פיקסל וגלש לעמוד שני בהדפסה */
  .slip:first-child{border-bottom:2px dashed #a08c5e}
  /* מאיר: "בחצי השני יהיה אותו תורם שוב, פשוט הפוך — כדי שאם אקפל את
     הדף יהיה לכל צד את הצד כתוב, וכך האברך יוכל ללמוד והדף עומד מולו
     במשולש". החצי התחתון הוא אותו פתק מסובב ב-180°, כך שאחרי קיפול
     באמצע הדף עומד כאוהל ושני הצדדים נקראים כשורה. */
  .slip.flip{transform:rotate(180deg)}
  @media print{
    html,body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .bar,.hint{display:none}
    .sheet{width:210mm;height:297mm;margin:0;box-shadow:none}
    .slip{break-inside:avoid;page-break-inside:avoid}
    .sheet{break-after:page;page-break-after:always}
    .sheet:last-child{break-after:auto;page-break-after:auto}
  }
</style>
</head>
<body>
<div class="bar">
  <b>🕯️ דפי קוויטל — יששכר־זבולון</b>
  <input id="q" placeholder="🔍 חפש אברך או תורם…" autocomplete="off">
  <select id="pick"><option value="">כל האברכים</option></select>
  <select id="filt">
    <option value="names">רק מי שיש לו שמות</option>
    <option value="all">הכל (גם בלי שמות)</option>
  </select>
  <span class="sp"></span>
  <span id="cnt"></span>
  <button onclick="window.print()">🖨️ הדפס</button>
</div>
<div class="hint">תורם אחד בכל דף, פעמיים — למעלה, ולמטה אותו פתק הפוך. מקפלים בקו המקווקו והדף עומד כאוהל, כתוב וקריא משני הצדדים. בחר אברך מהרשימה כדי להדפיס רק אותו.</div>
<div id="out"></div>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let ROWS = [];

// מאיר: "תסדר שכל שם ושם האם והבקשה ואז פסיק, והשם הבא באותה שורה —
// לא שיתפוס מקום". שורות בודדות מתחברות לרצף אחד מופרד בפסיקים.
function kvFlow(t) {
  const parts = String(t || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) return parts.join('');
  let out = parts[0];
  for (let i = 1; i < parts.length; i++) {
    out += (/[,.:;·|]$/.test(out) ? ' ' : ', ') + parts[i];
  }
  return out;
}
// הקטנה לפי מדידה אמיתית — לא לפי ניחוש אורך — כדי ששום דבר לא ייחתך
// שם ארוך בכותרת (למשל ה"ה חיים ולאה אסתר לאקס) גלש מחוץ לפתק.
// מקטינים במדידה עד שהשורה נכנסת, בדיוק כמו בשמות הקוויטל.
function fitWho(slip) {
  const who = slip.querySelector('.who');
  if (!who) return;
  const nms = [...who.querySelectorAll('.nm')];
  for (let pt = 24; pt >= 11; pt -= 0.5) {
    nms.forEach(n => {
      n.style.fontSize = pt + 'pt';
      const i = n.querySelector('i');
      if (i) i.style.fontSize = Math.max(8, pt * 0.58) + 'pt';
    });
    if (who.scrollWidth <= who.clientWidth) return;
  }
}
function fitNames(slip) {
  const el = slip.querySelector('.names');
  if (!el) return;
  const inner = el.firstElementChild || el;
  for (let pt = 45; pt >= 7; pt -= 0.5) {
    el.style.fontSize = pt + 'pt';
    el.style.lineHeight = (pt > 20 ? 1.28 : 1.22);
    if (inner.scrollHeight <= el.clientHeight) return;
  }
}
function slip(r, flip) {
  const nm = r.names ? `<div class="names"><span>${esc(kvFlow(r.names))}</span></div>`
                     : '<div class="names"><span class="empty">— אין עדיין שמות לקוויטל —</span></div>';
  return `<div class="slip${flip ? ' flip' : ''}"><img class="bg" src="/iz-slip.jpg" alt=""><div class="in">
    <div class="who">
      <div class="w"><div class="lbl">יששכר</div><div class="nm"><i>${esc(r.av_t || "ר'")}</i> ${esc(r.avreich_p || r.avreich)}</div></div>
      <div class="w"><div class="lbl">זבולון</div><div class="nm"><i>${esc(r.donor_t || "ר'")}</i> ${esc(r.donor_p || r.donor)}</div></div>
    </div>
    <div class="lead">יהי רצון שזכות לימוד התורה והתפילה שאני לומד ומתפלל בעת רצון הגדול של חצות הלילה<span class="z">יעמוד לזכות:</span></div>
    ${nm}
  </div></div>`;
}
function paint() {
  const only = document.getElementById('pick').value;
  const mode = document.getElementById('filt').value;
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const hit = r => !q || (r.avreich + ' ' + r.donor + ' ' + (r.names || ''))
    .toLowerCase().includes(q);
  let rows = ROWS.filter(r => (!only || r.avreich === only) && (mode === 'all' || r.names) && hit(r));
  document.getElementById('cnt').textContent = rows.length + ' פתקים';
  let h = '';
  for (const r of rows) {
    h += '<div class="sheet">' + slip(r) + slip(r, true) + '</div>';
  }
  document.getElementById('out').innerHTML = h ||
    '<div class="hint">אין פתקים להצגה.</div>';
  document.querySelectorAll('.slip').forEach(sl => { fitWho(sl); fitNames(sl); });
}
(async () => {
  const q = new URLSearchParams(location.search);
  const r = await fetch('/api/izslips' + (q.get('av') ? ('?av=' + encodeURIComponent(q.get('av'))) : ''))
    .then(x => x.json()).catch(() => ({rows: []}));
  ROWS = r.rows || [];
  const sel = document.getElementById('pick');
  [...new Set(ROWS.map(x => x.avreich))].sort((a, b) => a.localeCompare(b, 'he'))
    .forEach(a => { const o = document.createElement('option'); o.value = o.textContent = a; sel.appendChild(o); });
  if (q.get('av')) sel.value = q.get('av');
  sel.onchange = paint;
  document.getElementById('filt').onchange = paint;
  document.getElementById('q').oninput = paint;
  paint();
})();
</script>
</body>
</html>
