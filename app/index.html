<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כולל חצות — מערכת תורמים</title>
<style>
  :root{
    --ground:#FBF8F2;--card:#FFFFFF;--ink:#2A2740;--muted:#6E6A82;--line:#E7E0D2;
    --accent:#3B357A;--accent-soft:#EEEBFA;--gold:#9C7A2E;--gold-soft:#F5ECD6;
    --klali:#5A7A8C;--klali-soft:#E6EEF2;--yes:#2F7A57;--yes-soft:#E4F1EA;--no:#C43A2B;--no-soft:#F6E7E1;--shadow:0 6px 24px rgba(40,36,64,.10);
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#17151F;--card:#221F2E;--ink:#ECE7DA;--muted:#A29CB4;--line:#332F42;
    --accent:#A79EEA;--accent-soft:#2A2740;--gold:#D8B25E;--gold-soft:#2C2740;
    --klali:#8FB2C4;--klali-soft:#22303A;--yes:#6FC79A;--yes-soft:#1E3329;--no:#E86B5D;--no-soft:#3A2320;--shadow:0 8px 30px rgba(0,0,0,.4);}}
  :root[data-theme="light"]{--ground:#FBF8F2;--card:#FFFFFF;--ink:#2A2740;--muted:#6E6A82;--line:#E7E0D2;--accent:#3B357A;--accent-soft:#EEEBFA;--gold:#9C7A2E;--gold-soft:#F5ECD6;--klali:#5A7A8C;--klali-soft:#E6EEF2;--yes:#2F7A57;--yes-soft:#E4F1EA;--no:#C43A2B;--no-soft:#F6E7E1;--shadow:0 6px 24px rgba(40,36,64,.10);}
  :root[data-theme="dark"]{--ground:#17151F;--card:#221F2E;--ink:#ECE7DA;--muted:#A29CB4;--line:#332F42;--accent:#A79EEA;--accent-soft:#2A2740;--gold:#D8B25E;--gold-soft:#2C2740;--klali:#8FB2C4;--klali-soft:#22303A;--yes:#6FC79A;--yes-soft:#1E3329;--no:#E86B5D;--no-soft:#3A2320;--shadow:0 8px 30px rgba(0,0,0,.4);}
  *{box-sizing:border-box} html,body{margin:0;overflow-x:hidden}
  body{font-family:-apple-system,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;background:var(--ground);color:var(--ink);line-height:1.5;direction:rtl}
  .app{max-width:820px;margin:0 auto;padding:0 14px 60px}
  header.top{background:var(--ground);padding:14px 0 8px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .brand .logo{font-size:1.5rem}
  .brand h1{font-size:1.2rem;margin:0;font-weight:800}
  .brand .st{margin-inline-start:auto;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .search{width:100%;font-family:inherit;font-size:1.05rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
  .search:focus{outline:2px solid var(--accent);border-color:transparent}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{flex:1;background:none;border:none;font-family:inherit;font-size:.95rem;font-weight:700;color:var(--muted);padding:9px;border-radius:9px;cursor:pointer}
  .tab.on{background:var(--accent-soft);color:var(--accent)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:.83rem;font-weight:600;padding:6px 12px;border-radius:99px;cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:transparent}
  .list{margin-top:12px;display:flex;flex-direction:column;gap:7px}
  .rowc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .12s}
  .rowc:hover{border-color:var(--accent)}
  .rowc .nm{font-weight:700;font-size:1.05rem}
  .rowc .nm small{font-weight:500;color:var(--muted)}
  .rowc .en{font-size:.82rem;color:var(--muted);margin-top:2px;text-align:start}
  .rowc .biz{font-size:.8rem;color:var(--gold);margin-top:2px}
  .rowc .amt{font-size:.8rem;color:var(--yes);margin-top:2px;font-weight:600}
  .rowc .purp{font-size:.8rem;color:var(--accent);margin-top:2px;font-weight:600}
  .purpose{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 13px;font-weight:700;margin:6px 0 4px}
  .cnt{color:var(--muted);font-size:.85rem;margin:10px 2px 0;font-variant-numeric:tabular-nums}
  .pill.reg{background:var(--yes-soft);color:var(--yes)}
  .pill.occ{background:var(--klali-soft);color:var(--klali)}
  .rowc .miss{font-size:.82rem;color:var(--no);font-weight:700;margin-top:3px}
  .mgrid{display:flex;gap:3px;flex-wrap:wrap;max-width:230px;justify-content:flex-end}
  .mc{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700}
  .mc span{opacity:.85}
  .mc.gp{background:var(--yes-soft);color:var(--yes)}
  .mc.gx{background:#E23B2E;color:#fff}
  .mc.gmiss{background:#E23B2E;color:#fff}
  .mc.gn{background:var(--line);color:var(--muted);opacity:.5}
  .rowc .meta{margin-inline-start:auto;text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .rowc .ph{font-size:.82rem;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums}
  .pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .pill.ishz{background:var(--gold-soft);color:var(--gold)}
  .pill.k101{background:var(--accent-soft);color:var(--accent)}
  .pill.klali{background:var(--klali-soft);color:var(--klali)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  /* overlay */
  .ov{position:fixed;inset:0;background:rgba(20,18,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .ov.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px 32px;animation:up .25s ease}
  @media(min-width:640px){.ov{align-items:center}.sheet{border-radius:20px}}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet .x{float:inline-start;background:var(--line);border:none;color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer}
  .sheet h2{margin:.1em 0 2px;font-size:1.5rem}
  .sheet .subn{color:var(--muted);margin-bottom:14px}
  .field{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .field .k{color:var(--muted);font-size:.85rem;min-width:74px}
  .field .v{font-weight:600}
  .field .v a{color:var(--accent);text-decoration:none}
  .pr{background:var(--ground);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;white-space:pre-wrap;font-size:.92rem}
  /* kvittel */
  .kbar{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .print{margin-inline-start:auto;background:var(--accent);color:#fff;border:none;font-family:inherit;font-weight:700;padding:9px 16px;border-radius:10px;cursor:pointer}
  .kblock{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:8px}
  .kblock .who{font-size:.8rem;color:var(--muted);margin-bottom:4px}
  .kblock .names{font-size:1.05rem;white-space:pre-wrap}
  @media print{
    header.top,.tabs,.chips,.search,.brand .st,#printHint{display:none!important}
    body,.app{background:#fff;color:#000;max-width:100%}
    .kblock{border:none;border-bottom:1px solid #ccc;border-radius:0;padding:8px 0;break-inside:avoid}
    .kbar{display:none}
  }
</style>

const GLAST=(function(){
  const ms=DB.donors.map(d=>d.months||'').filter(Boolean);

  const mx=Math.max(1,...cnt); let last=0;

})();
function gaps(m){ // חודשים שלא עברו: בין החודש הראשון שנגבה לבין חודש הגבייה הנוכחי, וזה לא 'p'
  if(!m) return [];
  const firstP=m.indexOf('p'); if(firstP<0) return [];

  for(let i=firstP;i<=GLAST;i++){ if(m[i]!=='p') g.push(i); }

  view.innerHTML=`<div class="kbar"><b>${title}</b><span style="color:var(--muted);font-size:.85rem">(${list.length} שמות)</span>
      <button class="print" onclick="window.print()">הדפס 🖨️</button></div>
    <p id="printHint" style="color:var(--muted);font-size:.8rem;margin:6px 0">בחר דרגה למעלה כדי לסנן, ואז הדפס.</p>
    ${list.map(p=>`<div class="kblock"><div class="who">${esc(p.donor)} · ${TIERS[p.tier]?TIERS[p.tier][0]:''}</div><div class="names">${esc(p.text)}</div></div>`).join('')||'<div class="empty">אין שמות</div>'}`;
}
function renderOcc(){
  const list=DB.occasional.filter(o=>matchQ(o.name));
  view.innerHTML=`<div class="list">${list.map(o=>`
    <div class="rowc" style="cursor:default"><div><div class="nm">${esc(o.name)}</div>
      <div class="biz" style="color:var(--muted)">${esc(o.detail)}</div></div>
      <div class="meta"><span class="ph">${esc(o.total)?('$'+esc(o.total)):''}</span></div></div>`).join('')||'<div class="empty">אין תוצאות</div>'}</div>`;
}
render();
</script>
